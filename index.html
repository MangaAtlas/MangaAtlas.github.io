8716414190.webp',"ruridragon":GH+'manga-covers/ruridragon/cover-1788716384933.webp',"the-exiled-heavy-knight-knows-how-to-game-the-system":GH+'manga-covers/the-exiled-heavy-knight-knows-how-to-game-the-system/cover-1788716627841.webp'};function norm(id){return String(id||'').trim().toLowerCase().replace(/-(ja|en|fr|pt|br|es|de|it|ko|zh|cn|tw)$/i,'')}function findManga(by,id){return by.get(id)||by.get(norm(id))||[...by.values()].find(m=>norm(m.id)===norm(id))||{}}function cover(p,id){const n=norm(id);if(coverMap[n])return coverMap[n];let s=String(p||'').trim();if(!s||s.includes('placehold.co'))return '';if(s.startsWith('http'))return s.replace('https://mangaatlas.github.io/',GH);s=s.replace(/^\//,'');return s.startsWith('manga-covers/')?GH+s:''}async function init(){try{const d=await fetch('/data/content.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()),dates=await fetch('/data/chapter-dates.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():{chapters:{}}).catch(()=>({chapters:{}})),by=new Map((d.mangas||[]).map(m=>[m.id,m])),dm=dates.chapters||{},latest=[...(d.chapters||[])].sort((a,b)=>{const A=Date.parse(a.createdAt||dm[a.id]?.createdAt||'')||0,B=Date.parse(b.createdAt||dm[b.id]?.createdAt||'')||0;return B-A||Number(b.number)-Number(a.number)}),groups=[['japan','🇯🇵 Japan','JP'],['usa','🇺🇸 United States','US'],['france','🇫🇷 France','FR'],['brazil','🇧🇷 Brazil','BR']];document.getElementById('app').innerHTML=groups.map(([id,name,country])=>{const rows=latest.filter(c=>c.country===country).slice(0,40);return `<section id="${id}" class="country-row"><div class="country-head"><div class="country-title">${name}</div><div class="line"></div></div><div class="grid">${rows.length?rows.map(c=>{const m=findManga(by,c.mangaId),u=cover(m.cover,c.mangaId)||placeholder,title=c.title||`${m.native_title||m.title||'Manga'} raw Chapter ${c.number}`;return `<a class="card" href="/chapter.html?slug=${encodeURIComponent(c.slug)}"><img src="${esc(u)}" alt="${esc(m.title||title)}" loading="lazy" onerror="this.onerror=null;this.src='${placeholder}'"><div><strong>${esc(title)}</strong><div class="muted">Chapter ${esc(c.number)} · ${esc(m.title||'MangaAtlas')}</div></div></a>`}).join(''):'<div class="empty">No chapters yet.</div>'}</div></section>`}).join('')}catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="empty">Content could not be loaded. Please refresh.</div>'}}init();</script></body></html>
