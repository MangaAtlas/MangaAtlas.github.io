<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="description" content="MangaAtlas — latest manga chapters and releases."><link rel="canonical" href="https://mangaatlas.github.io/"><title>MangaAtlas — Latest Manga Chapters</title><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid #20222b;background:#0b0c11}.brand{font-size:24px;font-weight:800}.brand span{color:#5b8bd9}.navlinks{display:flex;gap:20px;color:#aeb3c0;font-size:14px}.hero{padding:65px 5%;background:radial-gradient(circle at 80% 20%,#142d52,#111018 40%,#08090d 75%)}h1{font-size:clamp(40px,6vw,70px);margin:0 0 14px}.hero p{max-width:680px;color:#b8bbc6;font-size:17px;line-height:1.6}.section{max-width:1380px;margin:auto;padding:30px 5%}.country-row{padding:25px 0;border-bottom:1px solid #22252e}.country-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}.country-title{font-size:22px;font-weight:800}.line{height:1px;background:#22252e;flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:10px;border:1px solid #242732;border-radius:11px;background:#101118;min-height:116px}.card img{width:78px;height:96px;object-fit:cover;border-radius:7px;background:#171922}.muted{color:#9296a5;font-size:12px;margin-top:7px}.empty{padding:20px;color:#9296a5;border:1px dashed #303340;border-radius:12px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.nav{padding:14px 5%;align-items:flex-start}.navlinks{gap:10px;flex-wrap:wrap}.hero{padding:45px 5%}.grid{grid-template-columns:1fr}}</style><!-- MangaAtlas GA4 --><script async src="https://www.googletagmanager.com/gtag/js?id=G-50N8R6DVZH"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-50N8R6DVZH',{page_title:document.title,page_location:location.href});</script></head><body><nav class="nav"><a class="brand" href="/">Manga<span>Atlas</span></a><div class="navlinks"><a href="#japan">🇯🇵 Japan</a><a href="#usa">🇺🇸 USA</a><a href="#france">🇫🇷 France</a><a href="#brazil">🇧🇷 Brazil</a><a href="/admin/">Admin</a></div></nav><header class="hero"><h1>Discover manga beyond borders.</h1><p>Latest manga chapters and releases, powered entirely by GitHub.</p></header><main id="app" class="section"><div class="empty">Loading manga…</div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const coverMap={"blue-lock":"https://raw.githubusercontent.com/MangaAtlas/MangaAtlas.github.io/main/manga-covers/blue-lock/cover-1788579031675.webp","kingdom":"https://raw.githubusercontent.com/MangaAtlas/MangaAtlas.github.io/main/manga-covers/kingdom/cover-1788578937927.webp"};function coverUrl(p,id){if(coverMap[id])return coverMap[id];let s=String(p||'').trim();if(!s||s.includes('placehold.co'))return 'https://placehold.co/300x400';s=s.replace(/^https:\/\/mangaatlas\.github\.io\//i,'').replace(/^https:\/\/raw\.githubusercontent\.com\/MangaAtlas\/MangaAtlas\.github\.io\/main\//i,'').replace(/^\//,'');if(s.startsWith('manga-covers/'))return 'https://raw.githubusercontent.com/MangaAtlas/MangaAtlas.github.io/main/'+s.split('/').map(encodeURIComponent).join('/');return s}async function init(){try{const d=await fetch('/data/content.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()),by=new Map((d.mangas||[]).map(m=>[m.id,m])),latest=[...(d.chapters||[])].sort((a,b)=>Number(b.number)-Number(a.number)),groups=[['japan','🇯🇵 Japan','JP'],['usa','🇺🇸 United States','US'],['france','🇫🇷 France','FR'],['brazil','🇧🇷 Brazil','BR']];document.getElementById('app').innerHTML=groups.map(([id,name,country])=>{const rows=latest.filter(c=>c.country===country).slice(0,40);return `<section id="${id}" class="country-row"><div class="country-head"><div class="country-title">${name}</div><div class="line"></div></div><div class="grid">${rows.length?rows.map(c=>{const m=by.get(c.mangaId)||{};const displayTitle=c.title||`${m.native_title||m.title||'Manga'} raw Chapter ${c.number}`;return `<a class="card" href="/chapter.html?slug=${encodeURIComponent(c.slug)}"><img src="${esc(coverUrl(m.cover,c.mangaId))}" alt="${esc(m.title||displayTitle)}" loading="lazy"><div><strong>${esc(displayTitle)}</strong><div class="muted">Chapter ${esc(c.number)} · ${esc(m.title||'MangaAtlas')}</div></div></a>`}).join(''):'<div class="empty">No chapters yet.</div>'}</div></section>`}).join('')}catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="empty">Content could not be loaded. Please refresh.</div>'}}init();</script></body></html>
