m:10px}.feature span{color:#989cab;line-height:1.6;font-size:14px}.empty,.error{padding:35px;border:1px dashed #303340;border-radius:15px;color:#9296a5}.footer{border-top:1px solid #20222b;padding:28px 6%;color:#777b89;font-size:13px;display:flex;justify-content:space-between;gap:20px}.rtl{direction:rtl}.rtl .nav,.rtl .footer{direction:rtl}@media(max-width:800px){.countries,.features{grid-template-columns:1fr 1fr}.navlinks a{display:none}}@media(max-width:520px){.countries,.features{grid-template-columns:1fr}.hero{padding-top:65px}.lang{font-size:12px}}
</style></head>
<body><nav class="nav"><a class="brand" href="?country=global">Manga<span>Atlas</span></a><div class="navlinks"><a href="#markets" data-i="markets">Markets</a><a href="#features" data-i="explore">Explore</a><a href="/admin/" data-i="admin">Admin</a><select id="country" class="lang" aria-label="Language"><option value="global">🌐 Global</option><option value="JP">🇯🇵 日本語</option><option value="US">🇺🇸 English</option><option value="FR">🇫🇷 Français</option><option value="BR">🇧🇷 Português</option></select></div></nav>

<script>
const SUPABASE_URL='https://vcrrkyqiunczhpxdcoil.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_IWiCOqUZ7PtPaISAo_5RDw_9uTvyD4z';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const data={global:{html:'en',dir:'ltr',countryCode:null,eyebrow:'THE GLOBAL MANGA HUB',heroTitle:'Discover manga beyond borders.',heroText:'MangaAtlas brings together manga news, releases, rankings and discovery from the world’s biggest manga markets.',primary:'Explore markets',secondary:'See what’s coming',marketTitle:'Manga library',marketSub:'Browse every published title across all markets.',aboutTitle:'About MangaAtlas',aboutText:'MangaAtlas is a free manga discovery and information platform. Official sources and legal reading or purchase links are prioritized.',markets:'Markets',explore:'Explore',admin:'Admin',copyright:'© 2026 MangaAtlas'},JP:{html:'ja',dir:'ltr',countryCode:'JP',eyebrow:'日本のマンガ情報',heroTitle:'日本のマンガを、もっと深く、もっと自由に。',heroText:'MangaAtlasは、日本のマンガ作品、発売情報、出版社、ランキング、ニュースをわかりやすく紹介する無料のマンガ情報プラットフォームです。',primary:'日本の作品を見る',secondary:'注目情報を見る',marketTitle:'日本のマンガ',marketSub:'日本発のマンガ作品を一覧で紹介します。',aboutTitle:'MangaAtlasについて',aboutText:'MangaAtlasは、合法的な情報源と公式の読書・購入先を大切にする無料のマンガ発見プラットフォームです。',markets:'市場',explore:'探す',admin:'管理',copyright:'© 2026 MangaAtlas'},US:{html:'en',dir:'ltr',countryCode:'US',eyebrow:'THE MANGA HUB FOR THE UNITED STATES',heroTitle:'Discover manga made for your world.',heroText:'Explore manga releases, licensing news, publishers, rankings and the global manga market.',primary:'Explore manga',secondary:'Latest information',marketTitle:'Manga available in the US market',marketSub:'Titles assigned to the United States market.',aboutTitle:'About MangaAtlas',aboutText:'A free discovery platform focused on manga metadata, news and official reading or purchase links.',markets:'Markets',explore:'Explore',admin:'Admin',copyright:'© 2026 MangaAtlas'},FR:{html:'fr',dir:'ltr',countryCode:'FR',eyebrow:'LE HUB MANGA DE LA FRANCE',heroTitle:'Découvrez le manga, au-delà des frontières.',heroText:'MangaAtlas rassemble les sorties manga, les éditeurs, les classements et les actualités.',primary:'Explorer les mangas',secondary:'Voir les nouveautés',marketTitle:'Mangas du marché français',marketSub:'Titres assignés au marché français.',aboutTitle:'À propos de MangaAtlas',aboutText:'MangaAtlas est une plateforme gratuite de découverte et d’information sur les mangas.',markets:'Marchés',explore:'Explorer',admin:'Administration',copyright:'© 2026 MangaAtlas'},BR:{html:'pt-BR',dir:'ltr',countryCode:'BR',eyebrow:'O HUB DE MANGÁS DO BRASIL',heroTitle:'Descubra mangás sem fronteiras.',heroText:'O MangaAtlas reúne lançamentos, editoras, rankings, notícias e tendências.',primary:'Explorar mangás',secondary:'Ver novidades',marketTitle:'Mangás do mercado brasileiro',marketSub:'Títulos atribuídos ao mercado brasileiro.',aboutTitle:'Sobre o MangaAtlas',aboutText:'O MangaAtlas é uma plataforma gratuita de descoberta e informação sobre mangás.',markets:'Mercados',explore:'Explorar',admin:'Administração',copyright:'© 2026 MangaAtlas'}};
function text(t){return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
async function loadManga(countryCode){const wrap=document.getElementById('countryCards');wrap.innerHTML='<div class="empty">Loading manga…</div>';let query=sb.from('manga').select('id,title,native_title,author,artist,description,cover_url,country,status,official_url,featured,slug').order('featured',{ascending:false}).order('title');if(countryCode) query=query.eq('country',countryCode);const {data:rows,error}=await query;if(error){console.error(error);wrap.innerHTML='<div class="error">Unable to load manga. Please refresh the page.</div>';return}if(!rows?.length){wrap.innerHTML='<div class="empty">No manga published for this market yet.</div>';return}wrap.innerHTML=rows.map(m=>`<a class="card" href="manga.html?slug=${encodeURIComponent(m.slug)}"><img class="cover" src="${text(m.cover_url||'https://placehold.co/600x800/171922/ffffff?text=Manga')}" alt="${text(m.title)}" loading="lazy"><h3>${text(m.title)}</h3><p>${text(m.author||'')} ${m.status?`· ${text(m.status)}`:''}</p><p>${text(m.description||'')}</p></a>`).join('')}
function render(){const key=new URLSearchParams(location.search).get('country')||'global',d=data[key]||data.global;document.documentElement.lang=d.html;document.body.classList.toggle('rtl',d.dir==='rtl');document.title=`MangaAtlas — ${key==='JP'?'日本のマンガ情報':key==='FR'?'Découverte Manga':key==='BR'?'Descoberta de Mangás':key==='US'?'US Manga':'Global Manga Discovery'}`;['eyebrow','heroTitle','heroText','primary','secondary','marketTitle','marketSub','aboutTitle','aboutText','copyright'].forEach(id=>document.getElementById(id).textContent=d[id]);document.querySelector('[data-i="markets"]').textContent=d.markets;document.querySelector('[data-i="explore"]').textContent=d.explore;document.querySelector('[data-i="admin"]').textContent=d.admin;document.getElementById('country').value=key;document.getElementById('marketsFooter').textContent='Japan · United States · France · Brazil';loadManga(d.countryCode)}
document.getElementById('country').addEventListener('change',e=>location.href=`?country=${e.target.value}`);render();
</script></body></html>
