<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="description" content="MangaAtlas — latest manga chapters and releases."><link rel="canonical" href="https://mangaatlas.github.io/"><title>MangaAtlas — Latest Manga Chapters</title><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid #20222b;background:#0b0c11}.brand{font-size:24px;font-weight:800}.brand span{color:#5b8bd9}.navlinks{display:flex;gap:20px;color:#aeb3c0;font-size:14px}.hero{padding:55px 5%;background:radial-gradient(circle at 80% 20%,#142d52,#111018 40%,#08090d 75%)}h1{font-size:clamp(40px,6vw,70px);margin:0 0 14px}.hero p{max-width:680px;color:#b8bbc6;font-size:17px;line-height:1.6}.section{max-width:1380px;margin:auto;padding:30px 5%}.featured{margin:0 0 28px;padding:28px;border:2px solid #5b8bd9;border-radius:18px;background:linear-gradient(135deg,#121a29,#101118 65%);box-shadow:0 12px 40px rgba(0,0,0,.3)}.featured-label{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#7da8ef;margin-bottom:12px}.featured-card{display:grid;grid-template-columns:190px 1fr;gap:28px;align-items:center}.featured-card img{width:190px;height:245px;object-fit:cover;border-radius:12px;background:#171922}.featured-title{font-size:clamp(26px,4vw,42px);line-height:1.15;font-weight:900;margin:0 0 12px}.featured-meta{color:#aeb3c0;font-size:15px;margin-bottom:18px}.featured-button{display:inline-block;padding:13px 22px;border-radius:10px;background:#5b8bd9;color:#fff;font-weight:800}.featured + .featured{border-color:#30394b}.empty{padding:20px;color:#9296a5;border:1px dashed #303340;border-radius:12px}@media(max-width:600px){. mg src="${esc(f.cover)}" alt="${esc(f.meta.split(' · ')[0])} manga cover" loading="${i?'lazy':'eager'}" onerror="this.style.display='none'"><div><h2 class="featured-title">${esc(title)}</h2><div class="featured-meta">${esc(f.meta)}</div><span class="featured-button">${esc(f.button)}</span></div></a></section>`}).join('');document.title='MangaAtlas — Latest Manga Chapters'}catch(e){console.error(e);app.innerHTML='<div class="empty">Content could not be loaded. Please refresh.</div>'}}init();</script><script src="/upcoming.js"></script></body></html>
