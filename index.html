b-130','kagurabachi'],coverCandidates:['manga-covers/kagurabachi/cover-1788578413437.webp']},{name:'Kingdom',aliases:['キングダム','Kingdom'],slugHints:['kingdom-raw-888'],coverCandidates:['manga-covers/kingdom/cover-1788578937927.webp']}];function findChapter(chapters,p){for(const s of p.slugHints){const c=chapters.find(x=>String(x.slug||'')===s);if(c)return c}return chapters.find(x=>p.slugHints.some(h=>String(x.slug||'').toLowerCase().includes(String(h).toLowerCase())))}function coverFor(c,p){return c?.cover||c?.cover_url||GH+p.coverCandidates[0]}async function init(){const app=document.getElementById('app');try{const d=await fetch('/data/content.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('content '+r.status);return r.json()});const chapters=d.chapters||[];app.innerHTML='<div class="heading"><h2 class="section-title">🔥 Popular</h2><p class="section-subtitle">Only these six series are shown as featured chapters.</p></div>'+POPULAR.map((p,i)=>{const c=findChapter(chapters,p);const slug=c?.slug||p.slugHints[0];const title=c?.title||`${p.name} — Latest Chapter`;const meta=c?.number?`${p.name} · Chapter ${c.number} · Japan · New Release`:`${p.name} · Latest Chapter · Japan`;return `<section class="featured"><div class="featured-label">🔥 Latest Featured Chapter</div><a class="featured-card" href="/chapter.html?slug=${encodeURIComponent(slug)}"><img src="${esc(coverFor(c,p))}" alt="${esc(p.name)} manga cover" loading="${i<2?'eager':'lazy'}" onerror="this.style.display='none'"><div><h2 class="featured-title">${esc(title)}</h2><div class="featured-meta">${esc(meta)}</div><span class="featured-button">Read Latest Chapter →</span></div></a></section>`}).join('');document.title='MangaAtlas Popular — Latest Featured Chapters'}catch(e){console.error(e);app.innerHTML='<div class="empty">Content could not be loaded. Please refresh.</div>'}}init();</script><script src="/upcoming.js"></script></body></html>
