<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="description" content="MangaAtlas — latest manga chapters and raw releases."><link rel="canonical" href="https://mangaatlas.github.io/"><title>MangaAtlas — Latest Manga Chapters & Raw Releases</title><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid #20222b;background:#0b0c11}.brand{font-size:24px;font-weight:800}.brand span{color:#5b8bd9}.navlinks{display:flex;gap:20px;color:#aeb3c0;font-size:14px}.navlinks .archive{color:#fff;font-weight:800}.hero{padding:55px 5%;background:radial-gradient(circle at 80% 20%,#142d52,#111018 40%,#08090d 75%)}h1{font-size:clamp(40px,6vw,70px);margin:0 0 14px}.hero p{max-width:760px;color:#b8bbc6;font-size:17px;line-height:1.6}.section{max-width:1380px;margin:auto;padding:30px 5%}.ma-fallback{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.ma-fallback a{padding:18px;border:1px solid #2b3547;border-radius:12px;background:#0e131c}.ma-fallback b{display:block;font-size:14px}.ma-fallback span{display:block;color:#8f97a8;font-size:12px;margin-top:7px}</style><script src="/analytics.js"></script></head><body><nav class="nav"><a class="brand" href="/"><span>Manga</span>Atlas</a><div class="navlinks"><a class="archive" href="/latest-chapters.html">Latest Chapters</a><a href="/admin/">Admin</a></div></nav><header class="hero"><h1>Discover manga beyond borders.</h1><p>Latest manga chapters, raw releases, and new updates — all in one place.</p></header><main id="app" class="section"><div class="empty">Loading MangaAtlas…</div></main><script src="/latest-chapters.js?v=2"></script><script src="/homepage-system.js?v=4"></script><script>(async()=>{setTimeout(async()=>{const app=document.getElementById('app');if(!app||app.querySelector('.ma-home-wrap'))return;try{const U='https://raw.githubusercontent.com/MangaAtlas/MangaAtlas.github.io/main/';const get=async p=>{const r=await fetch(U+p+'?v='+Date.now(),{cache:'no-store'});const d=await r.json();return typeof d.content==='string'?JSON.parse(d.content):d};const [a,b]=await Promise.all([get('data/content.json'),get('data/manual-chapters.json')]);const all=[...(a.chapters||[]),...(b.chapters||[])],seen=new Set(),rows=[];for(const c of all){const k=String(c.slug||'').toLowerCase();if(!k||seen.has(k))continue;seen.add(k);rows.push(c)}const id=c=>String(c.mangaId||c.manga_id||c.seriesId||c.series_id||c.mangaTitle||c.manga||c.series||'').toLowerCase().replace(/[-_](ja|raw)$/,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');rows.sort((x,y)=>Number(y.number||0)-Number(x.number||0));const latest=new Map();for(const c of rows){const k=id(c);if(k&&!latest.has(k))latest.set(k,c)}const list=[...latest.values()].sort((x,y)=>Number(y.number||0)-Number(x.number||0)).slice(0,18);app.innerHTML='<div class="ma-fallback">'+list.map(c=>'<a href="/chapter.html?slug='+encodeURIComponent(c.slug)+'"><b>'+String(c.mangaTitle||c.manga||c.series||c.mangaId||'Manga').replace(/[<>]/g,'')+'</b><span>Chapter '+String(c.number??'').replace(/[<>]/g,'')+'</span></a>').join('')+'</div>'}catch(e){console.warn('Homepage fallback failed',e)}},2500)})();</script></body></html>
