<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://mangaatlas.github.io/latest-chapters.html"><title>Latest Manga Chapters | MangaAtlas</title><meta name="description" content="Browse the latest manga chapters on MangaAtlas, including Japanese manga raw chapters and new releases."><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid #20222b;background:#0b0c11}.brand{font-size:24px;font-weight:800}.brand span{color:#5b8bd9}.navlinks{display:flex;gap:18px;color:#aeb3c0;font-size:14px}.hero{padding:45px 5%;background:radial-gradient(circle at 80% 20%,#142d52,#111018 40%,#08090d 75%)}h1{margin:0 0 10px;font-size:clamp(34px,5vw,58px)}.hero p{max-width:800px;color:#b8bbc6;line-height:1.7}.wrap{max-width:1200px;margin:auto;padding:30px 5%}.count{color:#8f96a6;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.card{display:block;padding:18px;border:1px solid #292d38;border-radius:14px;background:#101218;transition:.15s}.card:hover{border-color:#5b8bd9;transform:translateY(-2px)}.manga{color:#7da8ef;font-size:13px;font-weight:800;margin-bottom:8px}.title{font-weight:800;line-height:1.4}.meta{color:#858b9a;font-size:13px;margin-top:9px}.empty{padding:20px;border:1px dashed #303340;color:#9296a5}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style><script src="/analytics.js"></script></head><body><nav class="nav"><a class="brand" href="/"><span>Manga</span>Atlas</a><div class="navlinks"><a href="/">Home</a><a href="/admin/">Admin</a></div></nav><header class="hero"><h1>Latest Manga Chapters</h1><p>Browse recent manga releases and raw chapters on MangaAtlas. Each chapter links directly to its reader page for easier discovery and navigation.</p></header><main class="wrap"><div id="count" class="count">Loading chapters…</div><div id="list" class="grid"></div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const key=c=>String(c.slug||c.id||c.title||'');async function json(p){const r=await fetch(p+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}async function init(){try{const[d,m]=await Promise.all([json('/data/content.json'),json('/data/manual-chapters.json').catch(()=>({chapters:[]}))]);const all=[...(d.chapters||[])];for(const c of(m.chapters||[])){if(c.slug&&!all.some(x=>key(x)===key(c)))all.push(c)}all.sort((a,b)=>{const da=Date.parse(a.updatedAt||a.date||a.createdAt||'')||0,db=Date.parse(b.updatedAt||b.date||b.createdAt||'')||0;if(db!==da)return db-da;return (Number(b.number)||0)-(Number(a.number)||0)});document.getElementById('count').textContent=all.length+' published chapters available';document.getElementById('list').innerHTML=all.map(c=>{const slug=String(c.slug||'');const title=c.title||('Chapter '+(c.number??''));const manga=c.mangaTitle||c.manga||c.mangaName||'Manga';return '<a class="card" href="/chapter.html?slug='+encodeURIComponent(slug)+'"><div class="manga">'+esc(manga)+'</div><div class="title">'+esc(title)+'</div><div class="meta">Chapter '+esc(c.number??'')+' · Read chapter →</div></a>'}).join('')||'<div class="empty">No chapters available.</div>'}catch(e){console.error(e);document.getElementById('count').textContent='';document.getElementById('list').innerHTML='<div class="empty">Unable to load chapters. Please refresh.</div>'}}init();</script></body></html>
