<script>
const slug=decodeURIComponent(new URLSearchParams(location.search).get('slug')||'');
function imageUrl(p){let s=String(p||'').trim();if(!s)return '';s=s.replace(/^https:\/\/mangaatlas\.github\.io\//i,'').replace(/^https:\/\/raw\.githubusercontent\.com\/MangaAtlas\/MangaAtlas\.github\.io\/main\//i,'').replace(/^\//,'');if(s.startsWith('chapter-images/'))return 'https://raw.githubusercontent.com/MangaAtlas/MangaAtlas.github.io/main/'+s.split('/').map(encodeURIComponent).join('/');return s}
async function init(){
 const r=document.getElementById('reader');
 if(!slug){r.innerHTML='<div class="error">Chapter not found.</div>';return}
 try{
  const d=await fetch('/data/content.json?v='+Date.now(),{cache:'no-store'}).then(x=>x.json());
  const c=(d.chapters||[]).find(x=>String(x.slug)===slug);
  if(!c){r.innerHTML='<div class="error">Chapter not found.</div>';return}
  const m=(d.mangas||[]).find(x=>x.id===c.mangaId)||{};
  const pageTitle=c.title||`${m.title||'Manga'} — Chapter ${c.number} | MangaAtlas`;
  document.title=pageTitle;
  document.getElementById('desc').content=`Read ${c.title||m.title||'manga'} on MangaAtlas.`;
  document.getElementById('title').textContent=c.title||`${m.title||''} · Chapter ${c.number}`;
  if(window.mangaAtlasAnalytics) window.mangaAtlasAnalytics.pageView({chapter_slug:c.slug,chapter_number:c.number,manga_id:c.mangaId,manga_title:m.title});
  const pages=(c.pages||[]).map(p=>typeof p==='string'?p:p.url).filter(Boolean).map(imageUrl);
  if(!pages.length){r.innerHTML='<div class="empty">This chapter has no pages yet.</div>';return}
  r.innerHTML=pages.map((u,i)=>`<img class="page" src="${u}" alt="${(c.title||m.title||'Manga')}, page ${i+1}" loading="${i<2?'eager':'lazy'}" decoding="async">`).join('');
 }catch(e){console.error(e);r.innerHTML='<div class="error">Unable to load this chapter.</div>'}
}
init();
</script>
