<style>*{box-sizing:border-box}body{margin:0;background:#07080b;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}.bar{position:sticky;top:0;z-index:5;background:#0c0e13ee;backdrop-filter:blur(10px);border-bottom:1px solid #222733;padding:14px 5%;display:flex;justify-content:space-between;align-items:center}.bar a{color:#b7bdc9;text-decoration:none}.title{font-weight:800}.reader{max-width:1000px;margin:auto}.pages{width:100%}.page{display:block;width:100%;height:auto;margin:0 auto;background:#111}.empty{text-align:center;padding:100px 20px;color:#8b92a1}.error{color:#ff8c9b;text-align:center;padding:100px 20px}.chapter-ad{display:flex;justify-content:center;align-items:center;width:100%;overflow:hidden;margin:18px auto;padding:8px;min-height:70px}.chapter-ad.top{min-height:90px}.chapter-ad.middle{min-height:266px}.chapter-ad.bottom{min-height:106px}.chapter-ad-inner{width:100%;display:flex;justify-content:center;align-items:center;min-height:50px}

<body>
<header class="bar"><a href="/">← MangaAtlas</a><span id="title" class="title">Chapter</span></header>
<section class="chapter-ad top" aria-label="Advertisement"><div class="chapter-ad-inner"><div id="container-9c318a50ef96d7af9089a1f23c3dcd48"></div><script async="async" data-cfasync="false" src="https://pl31305611.profitableratecpmnetwork.com/9c318a50ef96d7af9089a1f23c3dcd48/invoke.js"></script></div></section>
<main id="reader" class="reader"><div class="empty">Loading chapter…</div></main>
<section id="middleAd" class="chapter-ad middle" aria-label="Advertisement"><div class="chapter-ad-inner"><script src="https://pl31305612.profitableratecpmnetwork.com/33/42/f5/3342f5af23f7a0a9a4797216c21f1442.js"></script></div></section>
<section class="chapter-ad bottom" aria-label="Advertisement"><div class="chapter-ad-inner"><script>atOptions={key:'2e991058e24736f278716e790d11b67f',format:'iframe',height:90,width:728,params:{}};</script><script src="https://www.highrevenueformat.com/2e991058e24736f278716e790d11b67f/invoke.js"></script></div></section>
<script>
const slug=decodeURIComponent(new URLSearchParams(location.search).get('slug')||'');
function imageUrl(p){let s=String(p||'').trim();if(!s)return '';const raw=s.match(/^https:\/\/raw\.githubusercontent\.com\/MangaAtlas\/MangaAtlas\.github\.io\/(?:main|master)\/(.+)$/i);if(raw)s=raw[1];else s=s.replace(/^https:\/\/mangaatlas\.github\.io\//i,'').replace(/^\.\//,'').replace(/^\//,'');if(/^https?:\/\//i.test(s))return s;return '/'+s.split('/').map(encodeURIComponent).join('/')}
function fallbackImage(img){const src=img.getAttribute('src')||'';if(src.startsWith('/chapter-images/')){const path=src.slice(1);img.onerror=null;img.src='https://raw.githubusercontent.com/MangaAtlas/MangaAtlas.github.io/main/'+path}}
async function init(){const r=document.getElementById('reader');if(!slug){r.innerHTML='<div class="error">Chapter not found.</div>';return}try{const d=await fetch('/data/content.json?v='+Date.now(),{cache:'no-store'}).then(x=>{if(!x.ok)throw new Error('content.json '+x.status);return x.json()});const c=(d.chapters||[]).find(x=>String(x.slug)===slug);if(!c){r.innerHTML='<div class="error">Chapter not found.</div>';return}const m=(d.mangas||[]).find(x=>x.id===c.mangaId)||{};document.title=c.title||`${m.title||'Manga'} — Chapter ${c.number} | MangaAtlas`;document.getElementById('desc').content=`Read ${c.title||m.title||'manga'} on MangaAtlas.`;document.getElementById('title').textContent=c.title||`${m.title||''} · Chapter ${c.number}`;const pages=(c.pages||[]).map(p=>typeof p==='string'?p:(p.url||p.path||p.src||'')).filter(Boolean).map(imageUrl);if(!pages.length){r.innerHTML='<div class="error">This chapter has no pages yet.</div>';return}const mid=Math.max(1,Math.floor(pages.length/2));r.innerHTML='<div id="pagesBefore" class="pages"></div><div id="pagesAfter" class="pages"></div>';const before=document.getElementById('pagesBefore'),after=document.getElementById('pagesAfter');before.innerHTML=pages.slice(0,mid).map((u,i)=>`<img class="page" src="${u}" alt="${(c.title||m.title||'Manga').replace(/"/g,'&quot;')}, page ${i+1}" loading="${i<2?'eager':'lazy'}" decoding="async" onerror="fallbackImage(this)">`).join('');after.innerHTML=pages.slice(mid).map((u,j)=>{const i=mid+j;return `<img class="page" src="${u}" alt="${(c.title||m.title||'Manga').replace(/"/g,'&quot;')}, page ${i+1}" loading="lazy" decoding="async" onerror="fallbackImage(this)">`}).join('');const ad=document.getElementById('middleAd');r.insertBefore(ad,r.querySelector('#pagesAfter'));if(window.mangaAtlasAnalytics)window.mangaAtlasAnalytics.pageView({chapter_slug:c.slug,chapter_number:c.number,manga_id:c.mangaId,manga_title:m.title})}catch(e){console.error(e);r.innerHTML='<div class="error">Unable to load this chapter.</div>'}}init();
</script>
</body></html>
