<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><title>Chapter | MangaAtlas</title><meta id="desc" name="description" content="Read manga chapters on MangaAtlas."><style>*{box-sizing:border-box}body{margin:0;background:#07080b;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}.bar{position:sticky;top:0;z-index:5;background:#0c0e13ee;backdrop-filter:blur(10px);border-bottom:1px solid #222733;padding:14px 5%;display:flex;justify-content:space-between;align-items:center}.bar a{color:#b7bdc9;text-decoration:none}.title{font-weight:800}.reader{max-width:1000px;margin:auto}.page{display:block;width:100%;height:auto;margin:0 auto;background:#111}.empty{text-align:center;padding:100px 20px;color:#8b92a1}.error{color:#ff8c9b;text-align:center;padding:100px 20px}.ad{min-height:90px;display:flex;align-items:center;justify-content:center;margin:10px 0;overflow:hidden}@media(max-width:600px){.reader{width:100%}}</style></head><body><header class="bar"><a href="/">← MangaAtlas</a><span id="title" class="title">Chapter</span></header><main id="reader" class="reader"><div class="empty">Loading chapter…</div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const slug=decodeURIComponent(new URLSearchParams(location.search).get('slug')||'');function imageUrl(p){let s=String(p||'').trim();if(!s)return '';s=s.replace(/^https:\/\/mangaatlas\.github\.io\//i,'').replace(/^https:\/\/raw\.githubusercontent\.com\/MangaAtlas\/MangaAtlas\.github\.io\/main\//i,'').replace(/^\//,'');if(s.startsWith('chapter-images/'))return 'https://cdn.jsdelivr.net/gh/MangaAtlas/MangaAtlas.github.io@main/'+s.split('/').map(encodeURIComponent).join('/');return s}async function init(){const r=document.getElementById('reader');if(!slug){r.innerHTML='<div class="error">Chapter not found.</div>';return}try{const d=await fetch('/data/content.json?v='+Date.now(),{cache:'no-store'}).then(x=>x.json());const c=(d.chapters||[]).find(x=>String(x.slug)===slug);if(!c){r.innerHTML='<div class="error">Chapter not found.</div>';return}const m=(d.mangas||[]).find(x=>x.id===c.mangaId)||{};document.title=`${m.title||'Manga'} — Chapter ${c.number} | MangaAtlas`;document.getElementById('desc').content=`Read ${m.title||'manga'} Chapter ${c.number} on MangaAtlas.`;document.getElementById('title').textContent=`${m.title||''} · Chapter ${c.number}`;const pages=(c.pages||[]).map(p=>typeof p==='string'?p:p.url).filter(Boolean).map(imageUrl);if(!pages.length){r.innerHTML='<div class="empty">This chapter has no pages yet.</div>';return}r.innerHTML=pages.map((p,i)=>`<img class="page" src="${esc(p)}" alt="${esc(m.title||c.title)} Chapter ${esc(c.number)} page ${i+1}" loading="${i?'lazy':'eager'}" decoding="async" onerror="this.onerror=null;this.src='';this.alt='Image failed to load: '+this.alt">`).join('')}catch(e){console.error(e);r.innerHTML='<div class="error">Unable to load chapter data. Please refresh.</div>'}}init();</script></body></html>
