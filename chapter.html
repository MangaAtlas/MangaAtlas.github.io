<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><title>Chapter | MangaAtlas</title><meta id="desc" name="description" content="Read manga chapters on MangaAtlas."><style>*{box-sizing:border-box}body{margin:0;background:#07080b;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}.bar{position:sticky;top:0;z-index:5;background:#0c0e13ee;backdrop-filter:blur(10px);border-bottom:1px solid #222733;padding:14px 5%;display:flex;justify-content:space-between;align-items:center}.bar a{color:#b7bdc9;text-decoration:none}.title{font-weight:800}.reader{max-width:1000px;margin:auto}.pages{width:100%}.page{display:block;width:100%;height:auto;margin:0 auto;background:#111}.error{text-align:center;padding:100px 20px;color:#ff8c9b}.coming{max-width:850px;margin:60px auto;padding:34px 28px;border:1px solid #2d3a4d;border-radius:18px;background:#111822;text-align:center}.coming p{color:#aeb6c4;line-height:1.8}.related{max-width:900px;margin:34px auto 70px;padding:24px 26px;border:1px solid #222733;border-radius:14px;background:#0c0f15}.related h2{font-size:18px;margin:0 0 14px}.keywords{display:flex;flex-wrap:wrap;gap:9px}.keyword{display:inline-block;padding:7px 10px;border:1px solid #2a3040;border-radius:999px;color:#bfc6d2;font-size:13px}</style><script src="/analytics.js"></script></head><body><header class="bar"><a href="/">← MangaAtlas</a><span id="title" class="title">Chapter</span></header><main id="reader" class="reader">Loading chapter…</main><script>
const slug=decodeURIComponent(new URLSearchParams(location.search).get('slug')||'');
const raw='https://raw.githubusercontent.com/MangaAtlas/MangaAtlas.github.io/main/';
const special={
'sakamoto-days-raw-275':{manga:'DAYS',title:'SAKAMOTO DAYS – サカモトデイズ raw 第275話',number:275,pages:['0001-1789034740375-0.webp','0002-1789034742373-1.webp','0003-1789034744409-2.webp','0004-1789034746195-3.webp','0005-1789034748331-4.webp','0006-1789034750166-5.webp','0007-1789034752196-6.webp','0008-1789034755145-7.webp','0009-1789034757555-8.webp','0010-1789034759627-9.webp','0011-1789034781567-0.webp','0012-1789034783840-1.webp','0013-1789034785967-2.webp','0014-1789034788321-3.webp','0015-1789034790324-4.webp','0016-1789034794972-5.webp','0017-1789034797884-6.webp','0018-1789034800136-7.webp','0019-1789034802498-8.webp','0020-1789034804486-9.webp'].map(x=>raw+'chapter-images/sakamoto-days-ja/chapter-275/'+x)},
'ワンピース-One Piece-1193':{manga:'One Piece',title:'ワンピース Raw raw 第1193話 ( One Piece raw Chapter 1193 )',number:1193,pages:['0001-1789034417848-0.webp','0002-1789034420531-1.webp','0003-1789034423138-2.webp','0004-1789034425120-3.webp','0005-1789034427554-4.webp','0006-1789034429491-5.webp','0007-1789034431781-6.webp','0008-1789034434199-7.webp','0009-1789034437091-8.webp','0011-1789034539546-0.webp','0012-1789034543925-2.webp','0013-1789034546448-3.webp','0014-1789034548659-4.webp','0015-1789034550793-5.webp','0016-1789034553024-6.webp','0017-1789034556010-7.webp'].map(x=>raw+'chapter-images/one-piece/chapter-1193/'+x)}
};
function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}
function normalizePages(p){return (p||[]).map(x=>typeof x==='string'?x:(x?.url||x?.path||x?.src||'')).filter(Boolean).map(x=>/^https?:\/\//i.test(x)?x:raw+x.replace(/^\//,''))}
function relatedKeywords(c){const title=String(c.title||'').trim();const manga=String(c.manga||c.mangaTitle||title).trim();const n=c.number?String(c.number):'';const base=[title,manga+' chapter '+n,manga+' raw chapter '+n,'read '+manga+' chapter '+n,'manga '+manga+' '+n,'latest '+manga+' chapter','manga raw online'];return [...new Set(base.filter(Boolean))].slice(0,8)}
function render(c){const r=document.getElementById('reader');const pages=normalizePages(c.pages);document.title=c.title+' | MangaAtlas';document.getElementById('desc').content='Read '+c.title+' on MangaAtlas.';document.getElementById('title').textContent=c.title;if(!pages.length){r.innerHTML='<div class="coming"><h1>'+esc(c.title)+'</h1><p>Chapter added successfully. Images can be uploaded from the Admin panel.</p></div>';return}const tags=relatedKeywords(c).map(k=>'<span class="keyword">'+esc(k)+'</span>').join('');r.innerHTML='<div class="pages">'+pages.map((u,i)=>'<img class="page" src="'+u+'" alt="'+esc(c.title)+'" loading="'+(i<2?'eager':'lazy')+'" decoding="async">').join('')+'</div><section class="related" aria-label="Related chapter searches"><h2>Related manga searches</h2><div class="keywords">'+tags+'</div></section>';if(window.mangaAtlasAnalytics)window.mangaAtlasAnalytics.pageView({chapter_slug:slug,chapter_number:c.number,manga_title:c.manga||c.mangaTitle})}
async function getJson(path){const r=await fetch(path+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function init(){if(!slug){document.getElementById('reader').innerHTML='<div class="error">Chapter not found.</div>';return}try{
const d=await getJson('/data/content.json');let c=(d.chapters||[]).find(x=>String(x.slug)===slug);if(c){render(c);return}
const u=await getJson('/data/upcoming-chapters.json').catch(()=>({chapters:[]}));c=(u.chapters||[]).find(x=>String(x.slug)===slug);if(c){render(c);return}
const m=await getJson('/data/manual-chapters.json');c=(m.chapters||[]).find(x=>String(x.slug)===slug);if(c){render(c);return}
if(special[slug]){render(special[slug]);return}
document.getElementById('reader').innerHTML='<div class="error">Chapter not found.</div>';
}catch(e){console.error(e);document.getElementById('reader').innerHTML='<div class="error">Unable to load this chapter.</div>'}}
init();
</script></body></html>
