<body>

<main id="reader" class="reader"><div class="empty">Loading chapter…</div></main>

<script>
const slug=decodeURIComponent(new URLSearchParams(location.search).get('slug')||'');
function imageUrl(p){let s=String(p||'').trim();if(!s)return '';const raw=s.match(/^https:\/\/raw\.githubusercontent\.com\/MangaAtlas\/MangaAtlas\.github\.io\/(?:main|master)\/(.+)$/i);if(raw)s=raw[1];else s=s.replace(/^https:\/\/mangaatlas\.github\.io\//i,'').replace(/^\.\//,'').replace(/^\//,'');if(/^https?:\/\//i.test(s))return s;return '/'+s.split('/').map(encodeURIComponent).join('/')}
function fallbackImage(img){const src=img.getAttribute('src')||'';if(src.startsWith('/chapter-images/')){const path=src.slice(1);img.onerror=null;img.src='https://raw.githubusercontent.com/MangaAtlas/MangaAtlas.github.io/main/'+path}}
function loadMiddleAd(){const box=document.getElementById('middleAd');const inner=document.createElement('div');inner.className='chapter-ad-inner';box.appendChild(inner);const opt=document.createElement('script');opt.textContent="atOptions={key:'8b11294931fe6646d489e066d12c4a7b',format:'iframe',height:250,width:300,params:{}};";inner.appendChild(opt);const s=document.createElement('script');s.src='https://www.highrevenueformat.com/8b11294931fe6646d489e066d12c4a7b/invoke.js';inner.appendChild(s)}
async function init(){const r=document.getElementById('reader');if(!slug){r.innerHTML='<div class="error">Chapter not found.</div>';return}try{const d=await fetch('/data/content.json?v='+Date.now(),{cache:'no-store'}).then(x=>{if(!x.ok)throw new Error('content.json '+x.status);return x.json()});const c=(d.chapters||[]).find(x=>String(x.slug)===slug);if(!c){r.innerHTML='<div class="error">Chapter not found.</div>';return}const m=(d.mangas||[]).find(x=>x.id===c.mangaId)||{};document.title=c.title||`${m.title||'Manga'} — Chapter ${c.number} | MangaAtlas`;document.getElementById('desc').content=`Read ${c.title||m.title||'manga'} on MangaAtlas.`;document.getElementById('title').textContent=c.title||`${m.title||''} · Chapter ${c.number}`;const pages=(c.pages||[]).map(p=>typeof p==='string'?p:(p.url||p.path||p.src||'')).filter(Boolean).map(imageUrl);if(!pages.length){r.innerHTML='<div class="error">This chapter has no pages yet.</div>';return}const mid=Math.max(1,Math.floor(pages.length/2));const before=pages.slice(0,mid),after=pages.slice(mid);r.innerHTML=before.map((u,i)=>`<img class="page" src="${u}" alt="${(c.title||m.title||'Manga').replace(/"/g,'&quot;')}, page ${i+1}" loading="${i<2?'eager':'lazy'}" decoding="async" onerror="fallbackImage(this)">`).join('');loadMiddleAd();after.forEach((u,j)=>{const i=mid+j;const img=document.createElement('img');img.className='page';img.src=u;img.alt=`${c.title||m.title||'Manga'}, page ${i+1}`;img.loading='lazy';img.decoding='async';img.onerror=()=>fallbackImage(img);r.appendChild(img)});if(window.mangaAtlasAnalytics)window.mangaAtlasAnalytics.pageView({chapter_slug:c.slug,chapter_number:c.number,manga_id:c.mangaId,manga_title:m.title})}catch(e){console.error(e);r.innerHTML='<div class="error">Unable to load this chapter.</div>'}}init();
</script>
