<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="description" content="MangaAtlas chapter page with manga chapter information and uploaded pages."><link id="canonical" rel="canonical" href="https://mangaatlas.github.io/"><title>Chapter | MangaAtlas</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#07080b;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}.bar{position:sticky;top:0;z-index:5;background:#0c0e13ee;backdrop-filter:blur(10px);border-bottom:1px solid #222733;padding:14px 5%;display:flex;justify-content:space-between;align-items:center}.bar a{color:#b7bdc9;text-decoration:none}.title{font-weight:800}.views{color:#8b92a1;font-size:12px;margin-left:12px}.reader{max-width:1000px;margin:auto}.page{display:block;width:100%;height:auto;margin:0 auto;background:#111}.ad-slot{display:flex;justify-content:center;align-items:center;min-height:50px;margin:18px auto;overflow:hidden;clear:both}.ad-250{min-height:250px}.ad-90{min-height:90px}.ad-50{min-height:50px}.empty{text-align:center;padding:100px 20px;color:#8b92a1}.error{color:#ff8c9b;text-align:center;padding:100px 20px}</style></head><body><header class="bar"><a id="back" href="/">← MangaAtlas</a><span id="title" class="title">Chapter</span></header><main id="reader" class="reader"></main><script>const sb=supabase.createClient('https://vcrrkyqiunczhpxdcoil.supabase.co','sb_publishable_IWiCOqUZ7PtPaISAo_5RDw_9uTvyD4z');const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');function normalizePage(p){if(typeof p==='object'&&p)return p;try{const x=JSON.parse(p);return typeof x==='object'&&x?x:{url:String(p)};}catch{return {url:String(p)}}}function decodeSlug(value){let s=String(value||'');for(let i=0;i<3&&/%[0-9A-Fa-f]{2}/.test(s);i++){try{const d=decodeURIComponent(s);if(d===s)break;s=d}catch{break}}return s}function makeScript(src,attrs={}){const s=document.createElement('script');s.src=src;Object.entries(attrs).forEach(([k,v])=>s.setAttribute(k,v));return s}function addHighRevenue(slot,key,width,height){window.atOptions={key,format:'iframe',height,width,params:{}};slot.appendChild(makeScript('https://www.highrevenueformat.com/'+key+'/invoke.js'))}function addContainerAd(slot,key){slot.id='container-'+key+'-'+Math.random().toString(36).slice(2);const s=makeScript('https://pl29176333.profitableratecpmnetwork.com/'+key+'/invoke.js');s.async=false;s.setAttribute('data-cfasync','false');slot.appendChild(s)}function addAds(){document.querySelectorAll('.ad-slot').forEach(slot=>{const kind=slot.dataset.ad||'';if(kind==='250')addHighRevenue(slot,'2e98052bd7486fbea838bfdf61333dcc',300,250);else if(kind==='728')addHighRevenue(slot,'5a6c64cb9575c309f734f8923695283f',728,90);else if(kind==='320')addHighRevenue(slot,'23c41132d95748e456a7a25b71fe13b8',320,50);else if(kind==='container')addContainerAd(slot,'e37cafb809028dfd79839ebe63f4a0e4')});const pop=makeScript('https://pl29176332.profitableratecpmnetwork.com/ce/2b/ec/ce2bec91c99bbf03669eb325da7e6c8f.js');pop.async=true;document.body.appendChild(pop)}async function init(){const path=location.pathname.replace(/\/+$/,'');let slug=new URLSearchParams(location.search).get('slug')||'';if(slug)slug=decodeSlug(slug);if(!slug){const m=path.match(/^\/chapter\/(.+)$/);if(m)slug=decodeSlug(m[1]);else if(path.startsWith('/chapter.html/'))slug=decodeSlug(path.split('/').pop()||'')}const r=document.getElementById('reader');if(!slug){r.innerHTML='<div class="error">Chapter not found.</div>';return}const q=await sb.from('chapters').select('id,chapter_number,title,pages,manga_id,manga(title,slug),view_count,created_at').eq('url_slug',slug).single();const data=q.data;if(q.error||!data){r.innerHTML='<div class="error">Chapter not found.</div>';return}const canonical=`https://mangaatlas.github.io/chapter/${encodeURIComponent(slug)}`;document.getElementById('canonical').href=canonical;document.title=`${data.manga?.title||'Manga'} — 第${data.chapter_number}話 | MangaAtlas`;document.querySelector('meta[name="description"]').content=`${data.manga?.title||'Manga'} 第${data.chapter_number}話。MangaAtlasで最新の漫画チャプターを読む。`;document.getElementById('title').innerHTML=`${esc(data.manga?.title||'')} · 第${esc(data.chapter_number)}話${data.title?` — ${esc(data.title)}`:''}<span class="views">👁 ${Number(data.view_count||0).toLocaleString()} views</span>`;document.getElementById('back').href=`/manga/${encodeURIComponent(data.manga?.slug||'')}`;const viewKey=`manga-atlas-viewed-${data.id}`;if(!sessionStorage.getItem(viewKey)){const vr=await sb.rpc('increment_chapter_view',{p_chapter_id:data.id});if(!vr.error){sessionStorage.setItem(viewKey,'1');if(typeof vr.data==='number'){const v=document.querySelector('.views');if(v)v.textContent=`👁 ${vr.data.toLocaleString()} views`;}}}const pages=(data.pages||[]).map(normalizePage).filter(p=>p.url);if(!pages.length){r.innerHTML='<div class="empty">No pages uploaded yet.</div>';return}let html='<div class="ad-slot ad-250" data-ad="250"></div>';pages.forEach((p,i)=>{html+=`<img class="page" src="${esc(p.url)}" alt="${esc(p.alt||`${data.manga?.title||'Manga'} 第${data.chapter_number}話`)} - page ${i+1}" loading="lazy">`;if((i+1)%5===0)html+='<div class="ad-slot ad-250" data-ad="250"></div>';if(i===7)html+='<div class="ad-slot ad-50" data-ad="320"></div>';if((i+1)%10===0)html+='<div class="ad-slot ad-250" data-ad="250"></div>';if((i+1)%15===0)html+='<div class="ad-slot" data-ad="container"></div>'});html+='<div class="ad-slot ad-90" data-ad="728"></div>';r.innerHTML=html;addAds()}init();</script></body></html>
