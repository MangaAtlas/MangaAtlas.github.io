<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow,max-image-preview:large">
<title>Chapter | MangaAtlas</title>
<meta id="desc" name="description" content="Read manga chapters on MangaAtlas.">
<style>
*{box-sizing:border-box}body{margin:0;background:#07080b;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}.bar{position:sticky;top:0;z-index:5;background:#0c0e13ee;backdrop-filter:blur(10px);border-bottom:1px solid #222733;padding:14px 5%;display:flex;justify-content:space-between;align-items:center}.bar a{color:#b7bdc9;text-decoration:none}.title{font-weight:800}.reader{max-width:1000px;margin:auto}.page{display:block;width:100%;height:auto;margin:0 auto;background:#111}.empty{text-align:center;padding:100px 20px;color:#8b92a1}.error{color:#ff8c9b;text-align:center;padding:100px 20px}.chapter-ads{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 8px}.chapter-ad{display:flex;justify-content:center;align-items:center;width:100%;min-height:0;overflow:hidden;min-height:1px}.chapter-ad[data-disabled="1"]{display:none}
</style>
<script src="/analytics.js"></script>
</head>
<body>
<header class="bar"><a href="/">← MangaAtlas</a><span id="title" class="title">Chapter</span></header>
<section id="chapterAds" class="chapter-ads" aria-label="Advertisement" hidden>
  <div class="chapter-ad" data-ad="1"></div>
  <div class="chapter-ad" data-ad="2"></div>
  <div class="chapter-ad" data-ad="3"></div>
  <div class="chapter-ad" data-ad="4"></div>
</section>
<main id="reader" class="reader"><div class="empty">Loading chapter…</div></main>
<script>
const slug=decodeURIComponent(new URLSearchParams(location.search).get('slug')||'');

/* Ads: one eligible ad session per 50 chapter pageviews in this browser.
   The approved ad snippets themselves are unchanged; only their execution is deferred. */
function adEligible(){
  try{
    const key='mangaatlas_ad_pageviews_v1';
    const n=Math.max(0,parseInt(localStorage.getItem(key)||'0',10))+1;
    localStorage.setItem(key,String(n));
    return n%50===0;
  }catch(e){return false}
}
function addScript(slot,src,attrs={}){const s=document.createElement('script');s.src=src;Object.entries(attrs).forEach(([k,v])=>s.setAttribute(k,v));slot.appendChild(s)}
function loadAds(){
  const section=document.getElementById('chapterAds');
  if(!adEligible()){section.hidden=true;return}
  section.hidden=false;
  const slots=[...section.querySelectorAll('[data-ad]')];
  const load=slot=>{
    if(slot.dataset.loaded==='1')return;slot.dataset.loaded='1';
    const n=slot.dataset.ad;
    if(n==='1'){
      addScript(slot,'https://pl31305611.profitableratecpmnetwork.com/9c318a50ef96d7af9089a1f23c3dcd48/invoke.js',{async:'async','data-cfasync':'false'});
      const d=document.createElement('div');d.id='container-9c318a50ef96d7af9089a1f23c3dcd48';slot.appendChild(d);
    }else if(n==='2'){
      window.atOptions={'key':'2e991058e24736f278716e790d11b67f','format':'iframe','height':90,'width':728,'params':{}};
      addScript(slot,'https://www.highrevenueformat.com/2e991058e24736f278716e790d11b67f/invoke.js',{'type':'text/javascript'});
    }else if(n==='3'){
      window.atOptions={'key':'e4d112d8537fd34ba895ce915fd0cf89','format':'iframe','height':50,'width':320,'params':{}};
      addScript(slot,'https://www.highrevenueformat.com/e4d112d8537fd34ba895ce915fd0cf89/invoke.js',{'type':'text/javascript'});
    }else if(n==='4'){
      addScript(slot,'https://pl31305612.profitableratecpmnetwork.com/33/42/f5/3342f5af23f7a0a9a4797216c21f1442.js');
    }
  };
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){load(e.target);io.unobserve(e.target)}}),{rootMargin:'600px 0px'});
    slots.forEach(s=>io.observe(s));
  }else slots.forEach(load);
}
function imageUrl(p){
 let s=String(p||'').trim(); if(!s)return '';
 const raw=s.match(/^https:\/\/raw\.githubusercontent\.com\/MangaAtlas\/MangaAtlas\.github\.io\/(?:main|master)\/(.+)$/i);
 if(raw)s=raw[1];
 else s=s.replace(/^https:\/\/mangaatlas\.github\.io\//i,'').replace(/^\.\//,'').replace(/^\//,'');
 if(/^https?:\/\//i.test(s))return s;
 return '/'+s.split('/').map(encodeURIComponent).join('/');
}
function fallbackImage(img){
 const src=img.getAttribute('src')||'';
 if(src.startsWith('/chapter-images/')){
   const path=src.slice(1);
   img.onerror=null;
   img.src='https://raw.githubusercontent.com/MangaAtlas/MangaAtlas.github.io/main/'+path;
 }
}
async function init(){
 const r=document.getElementById('reader');
 if(!slug){r.innerHTML='<div class="error">Chapter not found.</div>';return}
 try{
  const d=await fetch('/data/content.json?v='+Date.now(),{cache:'no-store'}).then(x=>{if(!x.ok)throw new Error('content.json '+x.status);return x.json()});
  const c=(d.chapters||[]).find(x=>String(x.slug)===slug);
  if(!c){r.innerHTML='<div class="error">Chapter not found.</div>';return}
  const m=(d.mangas||[]).find(x=>x.id===c.mangaId)||{};
  document.title=c.title||`${m.title||'Manga'} — Chapter ${c.number} | MangaAtlas`;
  document.getElementById('desc').content=`Read ${c.title||m.title||'manga'} on MangaAtlas.`;
  document.getElementById('title').textContent=c.title||`${m.title||''} · Chapter ${c.number}`;
  const pages=(c.pages||[]).map(p=>typeof p==='string'?p:(p.url||p.path||p.src||'')).filter(Boolean).map(imageUrl);
  if(!pages.length){r.innerHTML='<div class="error">This chapter has no pages yet.</div>';loadAds();return}
  r.innerHTML=pages.map((u,i)=>`<img class="page" src="${u}" alt="${(c.title||m.title||'Manga').replace(/"/g,'&quot;')}, page ${i+1}" loading="${i<2?'eager':'lazy'}" decoding="async" onerror="fallbackImage(this)">`).join('');
  loadAds();
  if(window.mangaAtlasAnalytics)window.mangaAtlasAnalytics.pageView({chapter_slug:c.slug,chapter_number:c.number,manga_id:c.mangaId,manga_title:m.title});
 }catch(e){console.error(e);r.innerHTML='<div class="error">Unable to load this chapter.</div>'}
}
init();
</script>
</body>
</html>
