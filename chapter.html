<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter | MangaAtlas</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#07080b;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}.bar{position:sticky;top:0;z-index:5;background:#0c0e13ee;backdrop-filter:blur(10px);border-bottom:1px solid #222733;padding:14px 5%;display:flex;justify-content:space-between;align-items:center}.bar a{color:#b7bdc9;text-decoration:none}.title{font-weight:800}.views{color:#8b92a1;font-size:12px;margin-left:12px}.reader{max-width:1000px;margin:auto}.page{display:block;width:100%;height:auto;margin:0 auto;background:#111}.empty{text-align:center;padding:100px 20px;color:#8b92a1}.error{color:#ff8c9b;text-align:center;padding:100px 20px}</style></head><body><header class="bar"><a id="back" href="/">← MangaAtlas</a><span id="title" class="title">Chapter</span></header><main id="reader" class="reader"></main><script>const sb=supabase.createClient('https://vcrrkyqiunczhpxdcoil.supabase.co','sb_publishable_IWiCOqUZ7PtPaISAo_5RDw_9uTvyD4z');const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');function normalizePage(p){if(typeof p==='object'&&p)return p;try{const x=JSON.parse(p);return typeof x==='object'&&x?x:{url:String(p)};}catch{return {url:String(p)}}}async function init(){let slug=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');if(slug==='chapter.html')slug=new URLSearchParams(location.search).get('slug')||'';const r=document.getElementById('reader');if(!slug){r.innerHTML='<div class="error">Chapter not found.</div>';return}const q=await sb.from('chapters').select('id,chapter_number,title,pages,manga_id,manga(title,slug),view_count').eq('url_slug',slug).single();const data=q.data;if(q.error||!data){r.innerHTML='<div class="error">Chapter not found.</div>';return}document.title=`${data.manga?.title||'Manga'} — 第${data.chapter_number}話 | MangaAtlas`;document.getElementById('title').innerHTML=`${esc(data.manga?.title||'')} · 第${esc(data.chapter_number)}話${data.title?` — ${esc(data.title)}`:''}<span class="views">👁 ${Number(data.view_count||0).toLocaleString()} views</span>`;document.getElementById('back').href=`/manga.html?slug=${encodeURIComponent(data.manga?.slug||'')}`;const viewKey=`manga-atlas-viewed-${data.id}`;if(!sessionStorage.getItem(viewKey)){const vr=await sb.rpc('increment_chapter_view',{p_chapter_id:data.id});if(!vr.error){sessionStorage.setItem(viewKey,'1');if(typeof vr.data==='number'){const v=document.querySelector('.views');if(v)v.textContent=`👁 ${vr.data.toLocaleString()} views`;}}}const pages=(data.pages||[]).map(normalizePage).filter(p=>p.url);r.innerHTML=pages.length?pages.map((p,i)=>`<img class="page" src="${esc(p.url)}" alt="${esc(p.alt||data.title||`第${data.chapter_number}話`)} - page ${i+1}" loading="lazy">`).join(''):'<div class="empty">No pages uploaded yet.</div>'}init();</script></body></html>
