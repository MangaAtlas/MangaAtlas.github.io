<style>*{box-sizing:border-box}body{margin:0;background:#07080b;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}.bar{position:sticky;top:0;z-index:5;background:#0c0e13ee;backdrop-filter:blur(10px);border-bottom:1px solid #222733;padding:14px 5%;display:flex;justify-content:space-between;align-items:center}.bar a{color:#b7bdc9;text-decoration:none}.title{font-weight:800}.reader{max-width:1000px;margin:auto}.pages{width:100%}.page{display:block;width:100%;height:auto;margin:0 auto;background:#111}.empty{text-align:center;padding:100px 20px;color:#8b92a1}.error{color:#ff8c9b;text-align:center;padding:100px 20px}.coming{max-width:850px;margin:60px auto;padding:34px 28px;border:1px solid #2d3a4d;border-radius:18px;background:#111822;text-align:center}.coming h1{line-height:1.35}.coming p{color:#aeb6c4;line-height:1.8}</style>
<script src="/analytics.js"></script>
</head>
<body>
<header class="bar"><a href="/">← MangaAtlas</a><span id="title" class="title">Chapter</span></header>
<main id="reader" class="reader"><div class="empty">Loading chapter…</div></main>
<script>
const slug=decodeURIComponent(new URLSearchParams(location.search).get('slug')||'');
const canonical={'SAKAMOTO-275':'sakamoto-days-raw-275'};
const raw='https://raw.githubusercontent.com/MangaAtlas/MangaAtlas.github.io/main/';
const special={
 'sakamoto-days-raw-275':{

 },
 'ワンピース-One Piece-1193':{

  pages:['0001-1789034417848-0.webp','0002-1789034420531-1.webp','0003-1789034423138-2.webp','0004-1789034425120-3.webp','0005-1789034427554-4.webp','0006-1789034429491-5.webp','0007-1789034431781-6.webp','0008-1789034434199-7.webp','0009-1789034437091-8.webp','0011-1789034539546-0.webp','0012-1789034543925-2.webp','0013-1789034546448-3.webp','0014-1789034548659-4.webp','0015-1789034550793-5.webp','0016-1789034553024-6.webp','0017-1789034556010-7.webp'].map(x=>raw+'chapter-images/one-piece/chapter-1193/'+x)
 },
 'kingdom-raw-888':{
  manga:'Kingdom',title:'キングダム raw ( Kingdom Raw ) 第888話',number:888,
  pages:[]
 }
};
function esc(v){return String(v??'').replace(/[&<>\\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#039;'}[m]))}
function render(c){const r=document.getElementById('reader');document.title=c.title+' | MangaAtlas';document.getElementById('desc').content='Read '+c.title+' on MangaAtlas.';document.getElementById('title').textContent=c.title;const pages=c.pages||[];if(!pages.length){r.innerHTML='<div class="coming"><h1>'+esc(c.title)+'</h1><p>Chapter added successfully. Images can be uploaded from the Admin panel.</p></div>';return}const mid=Math.max(1,Math.floor(pages.length/2));r.innerHTML='<div id="before" class="pages"></div><div id="after" class="pages"></div>';const make=(u,i)=>'<img class="page" src="'+u+'" alt="'+esc(c.title)+'" loading="'+(i<2?'eager':'lazy')+'" decoding="async">';document.getElementById('before').innerHTML=pages.slice(0,mid).map(make).join('');document.getElementById('after').innerHTML=pages.slice(mid).map((u,j)=>make(u,mid+j).join('')).join('');if(window.mangaAtlasAnalytics)window.mangaAtlasAnalytics.pageView({chapter_slug:slug,chapter_number:c.number,manga_title:c.manga})}
async function init(){if(!slug){document.getElementById('reader').innerHTML='<div class="error">Chapter not found.</div>';return}if(canonical[slug]){location.replace('/chapter.html?slug='+encodeURIComponent(canonical[slug]));return}if(special[slug]){render(special[slug]);return}try{const d=await fetch('/data/content.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json());const c=(d.chapters||[]).find(x=>String(x.slug)===slug);if(c){const pages=(c.pages||[]).map(p=>typeof p==='string'?p:(p.url||p.path||p.src||'')).filter(Boolean).map(p=>/^https?:\/\//i.test(p)?p:'/'+p.replace(/^\//,''));render({...c,pages});return}const u=await fetch('/data/upcoming-chapters.json?v='+Date.now()).then(r=>r.json()).catch(()=>({chapters:[]}));const up=(u.chapters||[]).find(x=>String(x.slug)===slug);if(up){document.getElementById('reader').innerHTML='<section class="coming"><h1>'+esc(up.title)+'</h1><p>'+esc(up.releaseNote||'Latest chapter is coming soon.')+'</p></section>';return}document.getElementById('reader').innerHTML='<div class="error">Chapter not found.</div>'}catch(e){console.error(e);document.getElementById('reader').innerHTML='<div class="error">Unable to load this chapter.</div>'}}
init();
</script>
