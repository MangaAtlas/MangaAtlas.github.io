<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow,max-image-preview:large">
<title>Chapter | MangaAtlas</title>
<meta id="desc" name="description" content="Read manga chapters on MangaAtlas.">
<style>*{box-sizing:border-box}body{margin:0;background:#07080b;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}.bar{position:sticky;top:0;z-index:5;background:#0c0e13ee;backdrop-filter:blur(10px);border-bottom:1px solid #222733;padding:14px 5%;display:flex;justify-content:space-between;align-items:center}.bar a{color:#b7bdc9;text-decoration:none}.title{font-weight:800}.reader{max-width:1000px;margin:auto}.page{display:block;width:100%;height:auto;margin:0 auto;background:#111}.empty{text-align:center;padding:100px 20px;color:#8b92a1}.error{color:#ff8c9b;text-align:center;padding:100px 20px}.chapter-ad{display:flex;justify-content:center;align-items:center;width:100%;overflow:hidden;margin:18px auto;min-height:50px}.chapter-ad.top{min-height:50px}.chapter-ad.middle{min-height:250px}.chapter-ad.bottom{min-height:90px}.chapter-ad-inner{width:100%;display:flex;justify-content:center;align-items:center}</style>
<script src="/analytics.js"></script>
</head>
<body>
<header class="bar"><a href="/">← MangaAtlas</a><span id="title" class="title">Chapter</span></header>
<main id="reader" class="reader"><div class="empty">Loading chapter…</div></main>
<script>
const slug=decodeURIComponent(new URLSearchParams(location.search).get('slug')||'');
function imageUrl(p){let s=String(p||'').trim();if(!s)return '';const raw=s.match(/^https:\/\/raw\.githubusercontent\.com\/MangaAtlas\/MangaAtlas\.github\.io\/(?:main|master)\/(.+)$/i);if(raw)s=raw[1];else s=s.replace(/^https:\/\/mangaatlas\.github\.io\//i,'').replace(/^\.\//,'').replace(/^\//,'');if(/^https?:\/\//i.test(s))return s;return '/'+s.split('/').map(encodeURIComponent).join('/')}
function fallbackImage(img){const src=img.getAttribute('src')||'';if(src.startsWith('/chapter-images/')){const path=src.slice(1);img.onerror=null;img.src='https://raw.githubusercontent.com/MangaAtlas/MangaAtlas.github.io/main/'+path}}
function adBox(type){const el=document.createElement('div');el.className='chapter-ad '+type;const inner=document.createElement('div');inner.className='chapter-ad-inner';el.appendChild(inner);return {el,inner}}
function addExternalScript(parent,src,attrs={}){const s=document.createElement('script');s.src=src;Object.keys(attrs).forEach(k=>s.setAttribute(k,attrs[k]));parent.appendChild(s)}
function addAds(){
  const top=adBox('top');
  const topContainer=document.createElement('div');topContainer.id='container-9c318a50ef96d7af9089a1f23c3dcd48';top.inner.appendChild(topContainer);
  addExternalScript(top.inner,'https://pl31305611.profitableratecpmnetwork.com/9c318a50ef96d7af9089a1f23c3dcd48/invoke.js',{async:'async','data-cfasync':'false'});
  const middle=adBox('middle');
  const middleOptions=document.createElement('script');middleOptions.textContent="atOptions={key:'8b11294931fe6646d489e066d12c4a7b',format:'iframe',height:250,width:300,params:{}};";middle.inner.appendChild(middleOptions);
  addExternalScript(middle.inner,'https://www.highrevenueformat.com/8b11294931fe6646d489e066d12c4a7b/invoke.js');
  const bottom=adBox('bottom');
  const bottomOptions=document.createElement('script');bottomOptions.textContent="atOptions={key:'2e991058e24736f278716e790d11b67f',format:'iframe',height:90,width:728,params:{}};";bottom.inner.appendChild(bottomOptions);
  addExternalScript(bottom.inner,'https://www.highrevenueformat.com/2e991058e24736f278716e790d11b67f/invoke.js');
  return {top,middle,bottom};
}
async function init(){const r=document.getElementById('reader');if(!slug){r.innerHTML='<div class="error">Chapter not found.</div>';return}try{const d=await fetch('/data/content.json?v='+Date.now(),{cache:'no-store'}).then(x=>{if(!x.ok)throw new Error('content.json '+x.status);return x.json()});const c=(d.chapters||[]).find(x=>String(x.slug)===slug);if(!c){r.innerHTML='<div class="error">Chapter not found.</div>';return}const m=(d.mangas||[]).find(x=>x.id===c.mangaId)||{};document.title=c.title||`${m.title||'Manga'} — Chapter ${c.number} | MangaAtlas`;document.getElementById('desc').content=`Read ${c.title||m.title||'manga'} on MangaAtlas.`;document.getElementById('title').textContent=c.title||`${m.title||''} · Chapter ${c.number}`;const pages=(c.pages||[]).map(p=>typeof p==='string'?p:(p.url||p.path||p.src||'')).filter(Boolean).map(imageUrl);if(!pages.length){r.innerHTML='<div class="error">This chapter has no pages yet.</div>';if(window.mangaAtlasAnalytics)window.mangaAtlasAnalytics.pageView({chapter_slug:c.slug,chapter_number:c.number,manga_id:c.mangaId,manga_title:m.title});return}
const ads=addAds();r.innerHTML='';r.appendChild(ads.top.el);const mid=Math.max(1,Math.floor(pages.length/2));pages.forEach((u,i)=>{const img=document.createElement('img');img.className='page';img.src=u;img.alt=`${c.title||m.title||'Manga'}, page ${i+1}`;img.loading=i<2?'eager':'lazy';img.decoding='async';img.onerror=()=>fallbackImage(img);r.appendChild(img);if(i+1===mid)r.appendChild(ads.middle.el)});r.appendChild(ads.bottom.el);if(window.mangaAtlasAnalytics)window.mangaAtlasAnalytics.pageView({chapter_slug:c.slug,chapter_number:c.number,manga_id:c.mangaId,manga_title:m.title})}catch(e){console.error(e);r.innerHTML='<div class="error">Unable to load this chapter.</div>'}}init();
</script>
</body></html>
