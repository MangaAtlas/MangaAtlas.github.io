<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapters Admin | MangaAtlas</title><style>body{margin:0;background:#08090d;color:#f4f5f7;font-family:system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav a{color:#ccd2df;text-decoration:none;border:1px solid #303542;border-radius:8px;padding:8px 11px}.panel{background:#101118;border:1px solid #292e39;border-radius:12px;padding:18px;margin:14px 0}h1,h2{margin-top:0}.muted{color:#aeb3c0;font-size:13px}.status{background:#171b23;padding:10px;border-radius:8px;margin-top:10px;white-space:pre-wrap}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select{width:100%;box-sizing:border-box;background:#090b10;color:#fff;border:1px solid #303542;border-radius:8px;padding:10px;margin:5px 0 10px}button{border:0;border-radius:8px;padding:10px 14px;background:#3f73c9;color:white;font-weight:700;cursor:pointer}.secondary{background:#292e39}.actions{display:flex;gap:8px;flex-wrap:wrap}.item{border:1px solid #292e39;border-radius:9px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.missing{border-color:#735d2d}.hidden{display:none}@media(max-width:700px){.row{grid-template-columns:1fr}.item{flex-direction:column;align-items:flex-start}}</style></head><body><div class="wrap"><div class="nav"><a href="/admin/">⚙️ Dashboard</a><a href="/admin/chapters.html">📚 Chapters</a><a href="/admin/manga.html">📖 Manga</a><a href="/">Open site</a></div><h1>📚 Chapters</h1><section id="login" class="panel"><h2>GitHub Admin Access</h2><p class="muted">Use the same GitHub token that works on Manga Admin.</p><input id="token" type="password" placeholder="github_pat_…"><button id="connect">Connect</button><div id="loginStatus" class="status"></div></section><main id="app" class="hidden"><section class="panel"><div class="actions"><button id="newChapter">＋ New chapter</button><button class="secondary" id="logout">Forget token</button></div><input id="search" placeholder="Search chapter, manga, slug or number…"></section><section class="panel"><div id="stats" class="muted"></div><div id="list"></div></section><section id="editor" class="panel hidden"><h2 id="heading">Add chapter</h2><label>Manga</label><select id="manga"></select><div class="row"><div><label>Chapter number</label><input id="number" type="number"></div><div><label>Chapter title</label><input id="title"></div><div><label>URL slug</label><input id="slug"></div><div><label>Country</label><select id="country"><option>JP</option><option>US</option><option>FR</option><option>BR</option></select></div></div><div class="actions"><button id="save">Save chapter</button><button class="secondary" id="cancel">Cancel</button></div><p class="muted">Images can be uploaded later.</p></section><div id="status" class="status"></div></main></div><script>'use strict';const OWNER='MangaAtlas',REPO='MangaAtlas.github.io',BRANCH='main',FILE='data/content.json';let token=sessionStorage.getItem('mangaatlas_github_token')||'',data={mangas:[],chapters:[]},sha='',editId=null;const $=id=>document.getElementById(id);function auth(){return{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'}}async function api(path,options={}){const r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+path,{...options,headers:{...auth(),...(options.headers||{})},cache:'no-store'}),t=await r.text();if(!r.ok)throw Error('GitHub '+r.status+': '+t.slice(0,500));return t?JSON.parse(t):{}}function decode(b64){const bin=atob(b64.replace(/\s/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}function encode(text){const bytes=new TextEncoder().encode(text);let s='';for(let i=0;i<bytes.length;i+=32768)s+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(s)}function human(slug){return decodeURIComponent(slug).replace(/[-_]+/g,' ').replace(/\b\w/g,x=>x.toUpperCase())}function numberFromSlug(slug){const m=decodeURIComponent(slug).match(/(?:-|\s|第)(\d+)(?:話)?$/);return m?Number(m[1]):0}function mangaForSlug(slug){const s=decodeURIComponent(slug).toLowerCase();const maps=[['blue-lock','blue-lock'],['one-piece','one-piece'],['one-piec','one-piece'],['hunter','hunter-x-hunter'],['hun x hun','hunter-x-hunter'],['sakamoto','days'],['days-ch','days'],['kagurab','kagurabachi'],['kingdom','kingdom'],['kingdo','kingdom'],['akane','akane-banashi'],['under-doctor','under-doctor'],['witch-watch','witch-watch'],['roboco','boku-to-roboko'],['kiyoshi','ultimate-exorcist-kiyoshi'],['nezumi','nezumis-first-love'],['shinobi','shinobi-undercover'],['ruridragon','ruridragon'],['yowamushi','yowamushi-pedal'],['tougen-anki','tougen-anki'],['mairimashita','mairimashita-iruma-kun'],['shuumatsu','shuumatsu-no-valkyrie'],['mokushiroku','mokushiroku-no-yon-kishi'],['red-blue','red-blue'],['magic-emperor','magic-emperor'],['chronicles-of-the-demon-faction','chronicles-of-the-demon-faction'],['star-embracing-swordmaster','star-embracing-swordmaster'],['the-regressed-mercenarys-machinations','the-regressed-mercenarys-machinations'],['the-exiled-heavy-knight','the-exiled-heavy-knight-knows-how-to-game-the-system'],['jukishi','the-exiled-heavy-knight-knows-how-to-game-the-system'],['psycho-eyes','psycho-eyes'],['golden-drop','golden-drop'],['vigilante','vigilante'],['under-ninja','under-ninja'],['nue','nue-no'],['yanineko','yanineko'],['my-gift-lvl-9999','infinite-gacha'],['guilty-circle','guilty-circle'],['tengoku-2-0','tengoku-2-0'],['japan-summons','nihon-koku-shokan'],['survival-in-another-world','goshujin-sama-to-yuku-isekai-survival'],['rare-monster','rare-monster-just-vermin'],['dare-demo','dare-demo-dakeru-kimi-ga-suki'],['paripi-komei','paripi-komei'],['zeikin-de-katta-hon','zeikin-de-katta-hon'],['dragon-no-hara','dragon-no-hara-de-oyasumi'],['rowa-rai','rowa-rai'],['court-mage','court-mage-exiled'],['isekai-walking','isekai-walking'],['tonari-no-seki','tonari-no-seki-no-yatsu'],['world-teacher','world-teacher'],['someone-hertz','someone-hertz']];for(const [needle,id] of maps)if(s.includes(needle))return id;const m=data.mangas.find(x=>s.startsWith(String(x.slug||'').toLowerCase()));return m?m.id:s.split('-')[0]}
async function syncPublicAndUpcoming(){let added=0;const existing=new Set(data.chapters.map(c=>String(c.slug||'')));try{const r=await fetch('/sitemap.xml?v='+Date.now(),{cache:'no-store'});if(r.ok){const xml=await r.text();for(const m of xml.matchAll(/<loc>(?:https?:\/\/mangaatlas\.github\.io\/)?chapter\.html\?slug=([^<]+)<\/loc>/g)){const slug=decodeURIComponent(m[1]);if(!slug||existing.has(slug))continue;data.chapters.push({id:'sitemap-'+slug.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),mangaId:mangaForSlug(slug),title:human(slug),number:numberFromSlug(slug),slug,country:'JP',pages:[],_publicOnly:true});existing.add(slug);added++}}}catch(e){}try{const r=await fetch('/data/upcoming-chapters.json?v='+Date.now(),{cache:'no-store'});if(r.ok){const u=await r.json();for(const c of (u.chapters||[])){if(!c.slug||existing.has(c.slug))continue;data.chapters.push({...c,pages:Array.isArray(c.pages)?c.pages:[],_upcoming:true});existing.add(c.slug);added++}}}catch(e){}return added}
async function load(){const x=await api('/contents/'+FILE+'?ref='+BRANCH);data=JSON.parse(decode(x.content));if(!Array.isArray(data.chapters))data.chapters=[];if(!Array.isArray(data.mangas))data.mangas=[];sha=x.sha;return await syncPublicAndUpcoming()}async function saveData(message){data.chapters.forEach(c=>{delete c._publicOnly;delete c._upcoming});const x=await api('/contents/'+FILE,{method:'PUT',body:JSON.stringify({message,content:encode(JSON.stringify(data,null,2)+'\n'),sha,branch:BRANCH})});sha=x.content.sha}function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}function populate(){$('manga').innerHTML=data.mangas.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.title)+' · '+esc(m.country)+'</option>').join('')}function chapters(){return data.chapters.map((c,i)=>({c,i})).sort((a,b)=>{const ad=Date.parse(a.c.updated_at||a.c.updatedAt||a.c.created_at||a.c.createdAt||'')||0,bd=Date.parse(b.c.updated_at||b.c.updatedAt||b.c.created_at||b.c.createdAt||'')||0;return bd-ad||(Number(b.c.number)||0)-(Number(a.c.number)||0)||b.i-a.i}).map(x=>x.c)}function render(){const q=$('search').value.trim().toLowerCase(),all=chapters(),rows=q?all.filter(c=>{const m=data.mangas.find(x=>x.id===c.mangaId);return[c.id,c.slug,c.title,c.number,c.country,c.mangaTitle,m&&m.title,m&&m.slug].join(' ').toLowerCase().includes(q)}):all;$('stats').textContent=all.length+' total chapters · '+rows.length+' shown';$('list').innerHTML=rows.length?rows.map(c=>{const m=data.mangas.find(x=>x.id===c.mangaId);const label=c._upcoming?'Upcoming':(c._publicOnly?'Public URL':'Published');return '<div class="item '+((c._upcoming||c._publicOnly)?'missing':'')+'"><div><b>'+esc(m?m.title:(c.mangaTitle||'Chapter'))+' · Chapter '+esc(c.number||'?')+'</b><br><small class="muted">'+esc(c.title||'')+' · '+esc(c.slug)+' · '+(Array.isArray(c.pages)?c.pages.length:0)+' pages · '+label+'</small></div><button class="secondary" onclick="editChapter(\''+esc(c.id)+'\')">Edit</button></div>'}).join(''):'<p class="muted">No chapters found.</p>';populate()}function reset(){editId=null;$('heading').textContent='Add chapter';$('number').value='';$('title').value='';$('slug').value='';$('country').value='JP';$('editor').classList.add('hidden')}window.editChapter=function(id){const c=data.chapters.find(x=>x.id===id);if(!c)return;editId=id;populate();$('heading').textContent='Edit chapter';$('manga').value=c.mangaId||'';$('number').value=c.number||'';$('title').value=c.title||'';$('slug').value=c.slug||'';$('country').value=c.country||'JP';$('editor').classList.remove('hidden');window.scrollTo({top:$('editor').offsetTop-20,behavior:'smooth'})};$('connect').onclick=async()=>{token=$('token').value.trim();if(!token){$('loginStatus').textContent='Enter your GitHub token.';return}$('connect').disabled=true;$('loginStatus').textContent='Connecting…';try{const added=await load();sessionStorage.setItem('mangaatlas_github_token',token);$('login').classList.add('hidden');$('app').classList.remove('hidden');render();$('status').textContent='✓ Connected — '+data.chapters.length+' chapters loaded ('+added+' public/upcoming synced).'}catch(e){sessionStorage.removeItem('mangaatlas_github_token');$('loginStatus').textContent='Error: '+e.message}finally{$('connect').disabled=false}};$('search').oninput=render;$('newChapter').onclick=()=>{reset();populate();$('editor').classList.remove('hidden')};$('cancel').onclick=reset;$('logout').onclick=()=>{sessionStorage.removeItem('mangaatlas_github_token');location.reload()};$('save').onclick=async()=>{try{const mangaId=$('manga').value,number=Number($('number').value),title=$('title').value.trim(),slug=$('slug').value.trim();if(!mangaId||!number||!title||!slug)throw Error('Manga, number, title and slug are required.');await load();if(editId){const c=data.chapters.find(x=>x.id===editId);if(!c)throw Error('Chapter not found.');Object.assign(c,{mangaId,number,title,slug,country:$('country').value,updated_at:new Date().toISOString()});delete c._publicOnly;delete c._upcoming}else{if(data.chapters.some(c=>c.slug===slug))throw Error('This slug already exists.');const id=slug.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'chapter-'+Date.now();data.chapters.push({id,mangaId,number,title,slug,country:$('country').value,pages:[],created_at:new Date().toISOString(),updated_at:new Date().toISOString()})}await saveData(editId?'Update chapter':'Add chapter');render();reset();$('status').textContent='✓ Chapter saved.'}catch(e){$('status').textContent='Error: '+e.message}};async function boot(){if(!token)return;try{const added=await load();$('login').classList.add('hidden');$('app').classList.remove('hidden');render();$('status').textContent='✓ Connected — '+data.chapters.length+' chapters loaded ('+added+' public/upcoming synced).'}catch(e){sessionStorage.removeItem('mangaatlas_github_token');$('loginStatus').textContent='Saved token failed: '+e.message}}boot();</script></body></html>
