<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapters Admin | MangaAtlas</title>
<style>
body{margin:0;background:#08090d;color:#f4f5f7;font-family:system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav a{color:#ccd2df;text-decoration:none;border:1px solid #303542;border-radius:8px;padding:8px 11px}.panel{background:#101118;border:1px solid #292e39;border-radius:12px;padding:18px;margin:14px 0}h1,h2{margin-top:0}.muted{color:#aeb3c0;font-size:13px}.status{background:#171b23;padding:10px;border-radius:8px;margin-top:10px;white-space:pre-wrap}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select{width:100%;box-sizing:border-box;background:#090b10;color:#fff;border:1px solid #303542;border-radius:8px;padding:10px;margin:5px 0 10px}button{border:0;border-radius:8px;padding:10px 14px;background:#3f73c9;color:white;font-weight:700;cursor:pointer}.secondary{background:#292e39}.actions{display:flex;gap:8px;flex-wrap:wrap}.item{border:1px solid #292e39;border-radius:9px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.pager{display:flex;justify-content:center;gap:10px;align-items:center;margin-top:15px}.hidden{display:none}@media(max-width:700px){.row{grid-template-columns:1fr}.item{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
<div class="nav"><a href="/admin/">⚙️ Dashboard</a><a href="/admin/chapters.html">📚 Chapters</a><a href="/admin/manga.html">📖 Manga</a><a href="/">Open site</a></div>
<h1>📚 Chapters</h1>
<section id="login" class="panel"><h2>GitHub Admin Access</h2><p class="muted">Use the same GitHub token that works on Manga Admin.</p><input id="token" type="password" placeholder="github_pat_…"><button id="connect">Connect</button><div id="loginStatus" class="status"></div></section>
<main id="app" class="hidden">
<section class="panel"><div class="actions"><button id="newChapter">＋ New chapter</button><button class="secondary" id="logout">Forget token</button></div></section>
<section class="panel"><div id="stats" class="muted"></div><div id="list"></div><div class="pager"><button class="secondary" id="prev">← Previous</button><span id="pageInfo" class="muted"></span><button class="secondary" id="next">Next →</button></div></section>
<section id="editor" class="panel hidden"><h2 id="heading">Add chapter</h2><label>Manga</label><select id="manga"></select><div class="row"><div><label>Chapter number</label><input id="number" type="number"></div><div><label>Chapter title</label><input id="title"></div><div><label>URL slug</label><input id="slug"></div><div><label>Country</label><select id="country"><option>JP</option><option>US</option><option>FR</option><option>BR</option></select></div></div><div class="actions"><button id="save">Save chapter</button><button class="secondary" id="cancel">Cancel</button></div><p class="muted">Images can be uploaded later from the Edit button.</p></section>
<div id="status" class="status"></div>
</main>
</div>
<script>
'use strict';
const OWNER='MangaAtlas',REPO='MangaAtlas.github.io',BRANCH='main',FILE='data/content.json',PER_PAGE=25;
let token=sessionStorage.getItem('mangaatlas_github_token')||'';
let data={mangas:[],chapters:[]},sha='',editId=null,page=1;
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function auth(){return {Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'}}
async function api(path,options={},attempt=0){
  const response=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+path,{...options,headers:{...auth(),...(options.headers||{})},cache:'no-store'});
  const text=await response.text();
  if((response.status===409||response.status===429||response.status>=500)&&attempt<3){await sleep(700*(attempt+1));return api(path,options,attempt+1)}
  if(!response.ok)throw new Error('GitHub '+response.status+': '+text.slice(0,700));
  return text?JSON.parse(text):{};
}
async function load(){
  const x=await api('/contents/'+FILE+'?ref='+BRANCH);
  if(!x.content)throw new Error('GitHub did not return content.json.');
  const raw=atob(x.content.replace(/\n/g,''));
  data=JSON.parse(decodeURIComponent(escape(raw)));
  if(!Array.isArray(data.chapters))data.chapters=[];
  if(!Array.isArray(data.mangas))data.mangas=[];
  sha=x.sha;
}
function b64(bytes){let s='';for(let i=0;i<bytes.length;i+=32768)s+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(s)}
async function saveData(message){const bytes=new TextEncoder().encode(JSON.stringify(data,null,2)+'\n');const x=await api('/contents/'+FILE,{method:'PUT',body:JSON.stringify({message,content:b64(bytes),sha,branch:BRANCH})});sha=x.content.sha}
function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}
function sorted(){return data.chapters.map((c,i)=>({c,i})).sort((a,b)=>{const ad=Date.parse(a.c.updated_at||a.c.updatedAt||a.c.created_at||a.c.createdAt||'')||0;const bd=Date.parse(b.c.updated_at||b.c.updatedAt||b.c.created_at||b.c.createdAt||'')||0;return bd-ad||(Number(b.c.number)||0)-(Number(a.c.number)||0)||b.i-a.i}).map(x=>x.c)}
function populate(){ $('manga').innerHTML=data.mangas.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.title)+' · '+esc(m.country)+'</option>').join('') }
function render(){
  const all=sorted(),totalPages=Math.max(1,Math.ceil(all.length/PER_PAGE));if(page>totalPages)page=totalPages;
  const rows=all.slice((page-1)*PER_PAGE,page*PER_PAGE);
  $('stats').textContent=all.length+' total chapters · Showing '+rows.length+' · 25 per page';
  $('list').innerHTML=rows.length?rows.map(c=>{const m=data.mangas.find(x=>x.id===c.mangaId);return '<div class="item"><div><b>'+esc(m?m.title:'Unknown')+' · Chapter '+esc(c.number)+'</b><br><small class="muted">'+esc(c.title||'')+' · '+esc(c.slug)+' · '+(Array.isArray(c.pages)?c.pages.length:0)+' pages</small></div><button class="secondary" onclick="editChapter(\''+esc(c.id)+'\')">Edit</button></div>'}).join(''):'<p class="muted">No chapters found in data/content.json.</p>';
  $('pageInfo').textContent='Page '+page+' / '+totalPages;$('prev').disabled=page<=1;$('next').disabled=page>=totalPages;populate();
}
function reset(){editId=null;$('heading').textContent='Add chapter';$('number').value='';$('title').value='';$('slug').value='';$('country').value='JP';$('editor').classList.add('hidden')}
window.editChapter=function(id){const c=data.chapters.find(x=>x.id===id);if(!c)return;editId=id;$('heading').textContent='Edit chapter';populate();$('manga').value=c.mangaId||'';$('number').value=c.number||'';$('title').value=c.title||'';$('slug').value=c.slug||'';$('country').value=c.country||'JP';$('editor').classList.remove('hidden');window.scrollTo({top:$('editor').offsetTop-20,behavior:'smooth'})};
$('connect').onclick=async function(){
  token=$('token').value.trim();
  if(!token){$('loginStatus').textContent='Enter your GitHub token.';return}
  $('connect').disabled=true;$('connect').textContent='Connecting…';$('loginStatus').textContent='Connecting to GitHub…';
  try{await load();sessionStorage.setItem('mangaatlas_github_token',token);$('login').classList.add('hidden');$('app').classList.remove('hidden');page=1;render();$('status').textContent='✓ Connected — '+data.chapters.length+' chapters loaded.'}
  catch(e){sessionStorage.removeItem('mangaatlas_github_token');$('loginStatus').textContent='Error: '+e.message}
  finally{$('connect').disabled=false;$('connect').textContent='Connect'}
};
$('newChapter').onclick=function(){reset();populate();$('editor').classList.remove('hidden')};
$('cancel').onclick=reset;
$('logout').onclick=function(){sessionStorage.removeItem('mangaatlas_github_token');location.reload()};
$('prev').onclick=function(){if(page>1){page--;render()}};
$('next').onclick=function(){page++;render()};
$('save').onclick=async function(){try{const mangaId=$('manga').value,number=Number($('number').value),title=$('title').value.trim(),slug=$('slug').value.trim();if(!mangaId||!number||!title||!slug)throw new Error('Manga, number, title and slug are required.');await load();if(editId){const c=data.chapters.find(x=>x.id===editId);if(!c)throw new Error('Chapter not found.');Object.assign(c,{mangaId,number,title,slug,country:$('country').value,updated_at:new Date().toISOString()})}else{if(data.chapters.some(c=>c.slug===slug))throw new Error('This slug already exists.');const id=slug.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'chapter-'+Date.now();data.chapters.push({id,mangaId,number,title,slug,country:$('country').value,pages:[],created_at:new Date().toISOString(),updated_at:new Date().toISOString()});editId=id}await saveData(editId?'Update chapter':'Add chapter');render();reset();$('status').textContent='✓ Chapter saved.'}catch(e){$('status').textContent='Error: '+e.message}};
async function boot(){if(!token)return;try{await load();$('login').classList.add('hidden');$('app').classList.remove('hidden');render();$('status').textContent='✓ Connected — '+data.chapters.length+' chapters loaded.'}catch(e){sessionStorage.removeItem('mangaatlas_github_token');$('loginStatus').textContent='Saved token failed: '+e.message}}
boot();
</script>
</body>
</html>
