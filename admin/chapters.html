<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapters Admin | MangaAtlas</title><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f4f5f7;font-family:system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:22px 16px}.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.nav a{color:#b9c0ce;text-decoration:none;padding:9px 12px;border:1px solid #292e39;border-radius:8px}.panel{background:#101118;border:1px solid #292e39;border-radius:12px;padding:18px;margin:14px 0}h1,h2{margin-top:0}label{display:block;color:#aeb3c0;font-size:13px;margin:10px 0 5px}input,select{width:100%;background:#090b10;color:#fff;border:1px solid #303542;border-radius:8px;padding:10px;font:inherit}.row,.parts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:8px;padding:10px 14px;background:#3f73c9;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#292e39}.danger{background:#9f3947}.muted{color:#aeb3c0;font-size:13px}.status{background:#171b23;padding:10px;border-radius:8px;margin-top:10px;white-space:pre-wrap}.list{display:grid;gap:8px}.item{border:1px solid #292e39;border-radius:9px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}.pager{display:flex;justify-content:center;gap:8px;align-items:center;margin-top:14px}.part{border:1px solid #303542;border-radius:10px;padding:14px;background:#0b0d12}.part button{width:100%;margin-top:10px}.progress{min-height:18px;margin-top:8px;font-size:13px;white-space:pre-wrap}@media(max-width:700px){.row,.parts{grid-template-columns:1fr}.item{flex-direction:column;align-items:flex-start}}</style></head><body><div class="wrap"><div class="nav"><a href="/admin/">⚙️ Dashboard</a><a href="/admin/chapters.html">📚 Chapters</a><a href="/admin/manga.html">📖 Manga</a><a href="/">Open site</a></div><h1>📚 Chapters</h1><div id="login" class="panel"><h2>GitHub Admin Access</h2><p class="muted">Token is kept only in this browser session.</p><input id="token" type="password" placeholder="github_pat_…"><div class="actions"><button id="connect">Connect</button></div><div id="loginStatus" class="status"></div></div><div id="app" class="hidden"><div class="panel"><div class="actions"><button id="newChapter">＋ New chapter</button><button class="secondary" id="logout">Forget token</button></div></div><div class="panel"><div id="stats" class="muted"></div><div id="chapterList" class="list"></div><div class="pager"><button class="secondary" id="prev">← Previous</button><span id="pageInfo" class="muted"></span><button class="secondary" id="next">Next →</button></div></div><div id="editor" class="panel hidden"><h2 id="heading">Add chapter</h2><label>Manga</label><select id="cManga"></select><div class="row"><div><label>Chapter number</label><input id="cNumber" type="number"></div><div><label>Chapter title</label><input id="cTitle"></div><div><label>URL slug</label><input id="cSlug"></div><div><label>Country</label><select id="cCountry"><option>JP</option><option>US</option><option>FR</option><option>BR</option></select></div></div><div class="parts"><div class="part"><b>📦 Part 1 — Images 1–10</b><input id="pages1" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="info1" class="muted">0 images selected</div><button id="upload1">Upload Part 1</button><div id="prog1" class="progress"></div></div><div class="part"><b>📦 Part 2 — Images 11–20</b><input id="pages2" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="info2" class="muted">0 images selected</div><button id="upload2">Upload Part 2</button><div id="prog2" class="progress"></div></div></div><div id="existing" class="muted"></div><div class="actions"><button id="save">Save chapter</button><button class="secondary" id="cancel">Cancel</button></div></div><div id="status" class="status"></div></div><script>'use strict';const O='MangaAtlas',R='MangaAtlas.github.io',B='main',D='data/content.json',PER=25;let token=sessionStorage.getItem('mangaatlas_github_token')||'',data=null,sha='',editId=null,page=1;const $=x=>document.getElementById(x);const sleep=m=>new Promise(r=>setTimeout(r,m));function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}function auth(){return{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'}}async function api(p,o={},a=0){const r=await fetch('https://api.github.com/repos/'+O+'/'+R+p,{...o,headers:{...auth(),...(o.headers||{})},cache:'no-store'});const t=await r.text();if((r.status===409||r.status===429||r.status>=500)&&a<4){await sleep(700*(a+1));return api(p,o,a+1)}if(!r.ok)throw Error('GitHub '+r.status+': '+t.slice(0,700));return t?JSON.parse(t):{}}async function read(){const x=await api('/contents/'+D+'?ref='+B);const raw=atob(x.content.replace(/\n/g,''));data=JSON.parse(decodeURIComponent(escape(raw)));sha=x.sha}function b64(b){let s='';for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode(...b.subarray(i,i+32768));return btoa(s)}async function write(msg){const bytes=new TextEncoder().encode(JSON.stringify(data,null,2)+'\n');const x=await api('/contents/'+D,{method:'PUT',body:JSON.stringify({message:msg,content:b64(bytes),sha,branch:B})});sha=x.content.sha}function setStatus(x){$('status').textContent=x}function populate(sel){$('cManga').innerHTML=(data.mangas||[]).map(m=>`<option value="${esc(m.id)}">${esc(m.title)} · ${esc(m.country)}</option>`).join('');if(sel)$('cManga').value=sel}function sorted(){return(data.chapters||[]).map((c,i)=>({...c,__i:i})).sort((a,b)=>{const ad=Date.parse(a.updated_at||a.created_at||'')||0,bd=Date.parse(b.updated_at||b.created_at||'')||0;if(ad!==bd)return bd-ad;return (Number(b.number)||0)-(Number(a.number)||0)})}function render(){const all=sorted(),pages=Math.max(1,Math.ceil(all.length/PER));if(page>pages)page=pages;const slice=all.slice((page-1)*PER,page*PER);$('stats').textContent=`${all.length} total chapters · Showing ${slice.length} · 25 per page`;$('chapterList').innerHTML=slice.map(c=>{const m=(data.mangas||[]).find(x=>x.id===c.mangaId);return `<div class="item"><div><b>${esc(m?.title||'Unknown')} · Chapter ${esc(c.number)}</b><br><small class="muted">${esc(c.title||'')} · ${esc(c.slug)} · ${(c.pages||[]).length} pages</small></div><div class="actions"><button class="secondary" onclick="editChapter('${esc(c.id)}')">Edit</button><button class="danger" onclick="delChapter('${esc(c.id)}')">Delete</button></div></div>`}).join('')||'<div class="muted">No chapters.</div>';$('pageInfo').textContent=`Page ${page} / ${pages}`;$('prev').disabled=page<=1;$('next').disabled=page>=pages;populate()}function reset(){editId=null;$('heading').textContent='Add chapter';['cNumber','cTitle','cSlug'].forEach(x=>$(x).value='');$('cCountry').value='JP';$('pages1').value='';$('pages2').value='';$('info1').textContent='0 images selected';$('info2').textContent='0 images selected';$('prog1').textContent='';$('prog2').textContent='';$('existing').textContent='';$('editor').classList.add('hidden');populate()}window.editChapter=id=>{const c=(data.chapters||[]).find(x=>x.id===id);if(!c)return;editId=id;$('heading').textContent='Edit chapter';populate(c.mangaId);$('cNumber').value=c.number||'';$('cTitle').value=c.title||'';$('cSlug').value=c.slug||'';$('cCountry').value=c.country||'JP';$('existing').textContent=`${(c.pages||[]).length} existing page(s). You can add more images.`;$('editor').classList.remove('hidden');window.scrollTo({top:$('editor').offsetTop-20,behavior:'smooth'})};window.delChapter=async id=>{if(!confirm('Delete this chapter?'))return;try{await read();data.chapters=(data.chapters||[]).filter(c=>c.id!==id);await write('Delete chapter');render();setStatus('✓ Chapter deleted.')}catch(e){setStatus('Error: '+e.message)}};function file64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(Error('Could not read '+f.name));r.readAsDataURL(f)})}async function prep(f){if(!/^image\/(jpeg|png|webp)$/i.test(f.type))throw Error(f.name+' must be JPG, PNG or WebP.');if(f.size>12*1024*1024)throw Error(f.name+' is over 12MB.');return f}async function uploadSet(input,progress,part){if(!editId)throw Error('Save the chapter details first, then upload images.');const c=(data.chapters||[]).find(x=>x.id===editId);if(!c)throw Error('Chapter not found.');const files=[...$(input).files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));if(!files.length)return;progress.textContent='Uploading…';const folder=(String(c.slug).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''))||editId;const urls=[...(c.pages||[])];for(let i=0;i<files.length;i++){const f=await prep(files[i]);const content=await file64(f);const name=String(part*10+i+1).padStart(4,'0')+'-'+Date.now()+'-'+i+'.'+(f.type==='image/png'?'png':f.type==='image/jpeg'?'jpg':'webp');const path='chapter-images/'+folder+'/'+name;const r=await api('/contents/'+path,{method:'PUT',body:JSON.stringify({message:'Upload chapter image '+name,content,branch:B})});urls.push(r.content.download_url||'https://raw.githubusercontent.com/'+O+'/'+R+'/'+B+'/'+path);progress.textContent=`Uploaded ${i+1}/${files.length}`;await read();const cc=(data.chapters||[]).find(x=>x.id===editId);if(cc){cc.pages=urls;await write('Update chapter pages')}}$('existing').textContent=`${urls.length} page(s) now attached.`;progress.textContent='✓ Upload complete';render()}
$('pages1').onchange=e=>$('info1').textContent=`${e.target.files.length} images selected`;$('pages2').onchange=e=>$('info2').textContent=`${e.target.files.length} images selected`;$('prev').onclick=()=>{if(page>1){page--;render();window.scrollTo({top:0,behavior:'smooth'})}};$('next').onclick=()=>{page++;render();window.scrollTo({top:0,behavior:'smooth'})};$('newChapter').onclick=()=>{reset();$('editor').classList.remove('hidden')};$('cancel').onclick=reset;$('logout').onclick=()=>{sessionStorage.removeItem('mangaatlas_github_token');location.reload()};$('connect').onclick=async()=>{token=$('token').value.trim();if(!token)return;$('loginStatus').textContent='Connecting…';try{await api('/contents/'+D+'?ref='+B);sessionStorage.setItem('mangaatlas_github_token',token);location.reload()}catch(e){$('loginStatus').textContent='Error: '+e.message}};$('save').onclick=async()=>{try{const mangaId=$('cManga').value,number=Number($('cNumber').value),title=$('cTitle').value.trim(),slug=$('cSlug').value.trim();if(!mangaId||!number||!title||!slug)throw Error('Manga, number, title and slug are required.');await read();if(editId){const c=data.chapters.find(x=>x.id===editId);if(!c)throw Error('Chapter not found.');Object.assign(c,{mangaId,number,title,slug,country:$('cCountry').value,updated_at:new Date().toISOString()})}else{const id=slug.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'chapter-'+Date.now();if(data.chapters.some(c=>c.slug===slug))throw Error('This slug already exists.');data.chapters.push({id,mangaId,number,title,slug,country:$('cCountry').value,pages:[],created_at:new Date().toISOString(),updated_at:new Date().toISOString()});editId=id}await write(editId?'Update chapter':'Add chapter');render();$('editor').classList.add('hidden');setStatus('✓ Chapter saved. Newest chapters are shown first.')}catch(e){setStatus('Error: '+e.message)}};$('upload1').onclick=()=>uploadSet('pages1',$('prog1'),0);$('upload2').onclick=()=>uploadSet('pages2',$('prog2'),1);async function boot(){if(!token){$('app').classList.add('hidden');return}try{await read();$('login').classList.add('hidden');$('app').classList.remove('hidden');render()}catch(e){$('loginStatus').textContent='Error: '+e.message}}boot();</script></body></html>
