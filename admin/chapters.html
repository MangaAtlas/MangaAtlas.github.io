<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapters Admin | MangaAtlas</title><style>body{margin:0;background:#08090d;color:#f4f5f7;font-family:system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav a{color:#ccd2df;text-decoration:none;border:1px solid #303542;border-radius:8px;padding:8px 11px}.panel{background:#101118;border:1px solid #292e39;border-radius:12px;padding:18px;margin:14px 0}.muted{color:#aeb3c0;font-size:13px}.status{background:#171b23;padding:10px;border-radius:8px;margin-top:10px;white-space:pre-wrap}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select{width:100%;box-sizing:border-box;background:#090b10;color:#fff;border:1px solid #303542;border-radius:8px;padding:10px;margin:5px 0 10px}button{border:0;border-radius:8px;padding:10px 14px;background:#3f73c9;color:white;font-weight:700;cursor:pointer}.secondary{background:#292e39}.actions{display:flex;gap:8px;flex-wrap:wrap}.item{border:1px solid #292e39;border-radius:9px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.virtual{border-color:#735d2d}.hidden{display:none}@media(max-width:700px){.row{grid-template-columns:1fr}.item{flex-direction:column;align-items:flex-start}}</style></head><body><div class="wrap"><div class="nav"><a href="/admin/">⚙️ Dashboard</a><a href="/admin/chapters.html">📚 Chapters</a><a href="/admin/manga.html">📖 Manga</a><a href="/">Open site</a></div><h1>📚 Chapters</h1><section id="login" class="panel"><h2>GitHub Admin Access</h2><p class="muted">Use the same GitHub token that works on Manga Admin.</p><input id="token" type="password" placeholder="github_pat_…"><button id="connect">Connect</button><div id="loginStatus" class="status"></div></section><main id="app" class="hidden"><section class="panel"><div class="actions"><button id="newChapter">＋ New chapter</button><button class="secondary" id="refresh">↻ Refresh all</button><button class="secondary" id="logout">Forget token</button></div><input id="search" placeholder="Search chapter, manga, slug or number…"></section><section class="panel"><div id="stats" class="muted"></div><div id="list"></div></section><section id="editor" class="panel hidden"><h2 id="heading">Add chapter</h2><label>Manga</label><select id="manga"></select><div class="row"><div><label>Chapter number</label><input id="number" type="number" step="0.1"></div><div><label>Chapter title</label><input id="title"></div><div><label>URL slug</label><input id="slug"></div><div><label>Country</label><select id="country"><option>JP</option><option>US</option><option>FR</option><option>BR</option></select></div></div><div class="actions"><button id="save">Save chapter</button><button class="secondary" id="cancel">Cancel</button></div><p class="muted">Images can be uploaded later.</p></section><div id="status" class="status"></div></main></div><script>'use strict';const OWNER='MangaAtlas',REPO='MangaAtlas.github.io',BRANCH='main',FILE='data/content.json';let token=sessionStorage.getItem('mangaatlas_github_token')||'',data={mangas:[],chapters:[]},sha='',editId=null;const $=id=>document.getElementById(id);function headers(){return{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'}}async function api(path,opt={}){const r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+path,{...opt,headers:{...headers(),...(opt.headers||{})},cache:'no-store'}),t=await r.text();if(!r.ok)throw Error('GitHub '+r.status+': '+t.slice(0,300));return t?JSON.parse(t):{}}function dec(s){const b=atob(String(s||'').replace(/\s/g,'')),u=Uint8Array.from(b,c=>c.charCodeAt(0));return new TextDecoder().decode(u)}function enc(s){const u=new TextEncoder().encode(s);let out='';for(let i=0;i<u.length;i+=32768)out+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(out)}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function human(s){try{s=decodeURIComponent(s)}catch(e){}return s.replace(/[-_]+/g,' ').replace(/\b\w/g,x=>x.toUpperCase())}function num(s){try{s=decodeURIComponent(s)}catch(e){}const m=String(s).match(/(?:-|\s|第)(\d+(?:\.\d+)?)(?:話)?$/);return m?Number(m[1]):0}const map=[['blue-lock','blue-lock'],['blue-loc','blue-lock'],['one-piece','one-piece'],['one-piec','one-piece'],['hunter','hunter-x-hunter'],['hun x hun','hunter-x-hunter'],['hun-x-hun','hunter-x-hunter'],['sakamoto','days'],['days-ch','days'],['kagurab','kagurabachi'],['kingdom','kingdom'],['kingdo','kingdom'],['akane','akane-banashi'],['under-doctor','under-doctor'],['witch-watch','witch-watch'],['roboco','boku-to-roboko'],['kiyoshi','ultimate-exorcist-kiyoshi'],['nezumi','nezumis-first-love'],['shinobi','shinobi-undercover'],['ruridragon','ruridragon'],['yowamushi','yowamushi-pedal'],['tougen-anki','tougen-anki'],['mairimashita','mairimashita-iruma-kun'],['shuumatsu','shuumatsu-no-valkyrie'],['mokushiroku','mokushiroku-no-yon-kishi'],['red-blue','red-blue'],['magic-emperor','magic-emperor'],['chronicles-of-the-demon-faction','chronicles-of-the-demon-faction'],['star-embracing-swordmaster','star-embracing-swordmaster'],['the-regressed-mercenarys-machinations','the-regressed-mercenarys-machinations'],['the-exiled-heavy-knight','the-exiled-heavy-knight-knows-how-to-game-the-system'],['four-knights','the-four-knights-of-the-apocalypse'],['psycho-eyes','psycho-eyes'],['golden-drop','golden-drop'],['vigilante','vigilante'],['under-ninja','under-ninja'],['nue','nue-no-onmyoji'],['yanineko','yanineko']];function mangaFor(slug){const s=String(slug).toLowerCase();for(const [a,b] of map)if(s.includes(a))return b;const m=data.mangas.find(x=>s===String(x.slug||'').toLowerCase()||s.startsWith(String(x.slug||'').toLowerCase()+'-'));return m?m.id:s.split(/[-\s]/)[0]}function add(c,source){if(!c?.slug||data.chapters.some(x=>String(x.slug)===String(c.slug)))return false;data.chapters.push({...c,pages:Array.isArray(c.pages)?c.pages:[],_virtual:true,_source:source});return true}async function sync(){let added=0,errors=[];try{const x=await api('/contents/data/upcoming-chapters.json?ref='+BRANCH);const u=JSON.parse(dec(x.content));for(const c of u.chapters||[])if(add(c,'Upcoming'))added++}catch(e){errors.push('Upcoming: '+e.message)}try{const x=await api('/contents/sitemap.xml?ref='+BRANCH);const xml=dec(x.content),re=/<loc>\s*(?:https?:\/\/mangaatlas\.github\.io\/)?chapter\.html\?slug=([^<\s]+)\s*<\/loc>/gi;let m;while(m=re.exec(xml)){let slug=m[1];try{slug=decodeURIComponent(slug)}catch(e){}if(add({id:'public-'+slug.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),mangaId:mangaFor(slug),title:human(slug),number:num(slug),slug,country:'JP',pages:[]},'Public URL'))added++}}catch(e){errors.push('Sitemap: '+e.message)}return{added,errors}}async function load(){const x=await api('/contents/'+FILE+'?ref='+BRANCH);data=JSON.parse(dec(x.content));data.chapters=Array.isArray(data.chapters)?data.chapters:[];data.mangas=Array.isArray(data.mangas)?data.mangas:[];sha=x.sha;return sync()}function all(){return data.chapters.map((c,i)=>({c,i})).sort((a,b)=>(Number(b.c.number)||0)-(Number(a.c.number)||0)||b.i-a.i).map(x=>x.c)}function populate(){$('manga').innerHTML=data.mangas.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.title)+' · '+esc(m.country)+'</option>').join('')}function render(){const a=all(),q=$('search').value.trim().toLowerCase(),rows=q?a.filter(c=>[c.id,c.slug,c.title,c.number,c.country,c.mangaTitle].join(' ').toLowerCase().includes(q)):a,p=a.filter(c=>!c._virtual).length;$('stats').textContent=a.length+' total chapters · '+rows.length+' shown · '+p+' published + '+(a.length-p)+' synced';$('list').innerHTML=rows.length?rows.map(c=>{const m=data.mangas.find(x=>x.id===c.mangaId),i=data.chapters.indexOf(c);return '<div class="item '+(c._virtual?'virtual':'')+'"><div><b>'+esc(m?m.title:(c.mangaTitle||'Chapter'))+' · Chapter '+esc(c.number||'?')+'</b><br><small class="muted">'+esc(c.title||'')+' · '+esc(c.slug)+' · '+(c.pages?.length||0)+' pages · '+esc(c._source||'Published')+'</small></div><button class="secondary editBtn" data-index="'+i+'">Edit</button></div>'}).join(''):'<p class="muted">No chapters found.</p>';populate()}function edit(i){const c=data.chapters[i];if(!c)return;editId=c.id;populate();$('manga').value=c.mangaId||'';$('number').value=c.number??'';$('title').value=c.title||'';$('slug').value=c.slug||'';$('country').value=c.country||'JP';$('heading').textContent='Edit chapter';$('editor').classList.remove('hidden');$('editor').scrollIntoView({behavior:'smooth',block:'start'})}function reset(){$('heading').textContent='Add chapter';$('number').value='';$('title').value='';$('slug').value='';$('country').value='JP';editId=null;$('editor').classList.add('hidden')}async function connect(){token=$('token').value.trim()||token;if(!token)return $('loginStatus').textContent='Enter your GitHub token.';$('connect').disabled=true;$('loginStatus').textContent='Loading chapters…';try{const r=await load();sessionStorage.setItem('mangaatlas_github_token',token);$('login').classList.add('hidden');$('app').classList.remove('hidden');render();$('status').textContent='✓ Connected — '+data.chapters.length+' chapters loaded. '+r.added+' synced.'+(r.errors.length?'\n'+r.errors.join('\n'):'')}catch(e){$('loginStatus').textContent='Error: '+e.message}finally{$('connect').disabled=false}}$('connect').onclick=connect;$('list').onclick=e=>{const b=e.target.closest('.editBtn');if(b)edit(Number(b.dataset.index))};$('search').oninput=render;$('refresh').onclick=async()=>{try{const r=await load();render();$('status').textContent='✓ Refreshed — '+data.chapters.length+' chapters loaded. '+r.added+' new records.'+(r.errors.length?'\n'+r.errors.join('\n'):'')}catch(e){$('status').textContent='Refresh error: '+e.message}};$('newChapter').onclick=()=>{reset();populate();$('editor').classList.remove('hidden')};$('cancel').onclick=reset;$('logout').onclick=()=>{sessionStorage.removeItem('mangaatlas_github_token');location.reload()};$('save').onclick=async()=>{try{const mangaId=$('manga').value,number=Number($('number').value),title=$('title').value.trim(),slug=$('slug').value.trim();if(!mangaId||!number||!title||!slug)throw Error('Manga, number, title and slug are required.');const id=editId;const x=await api('/contents/'+FILE+'?ref='+BRANCH);const fresh=JSON.parse(dec(x.content));fresh.chapters=Array.isArray(fresh.chapters)?fresh.chapters:[];if(id){const c=fresh.chapters.find(c=>c.id===id||c.slug===slug||c.slug===data.chapters.find(z=>z.id===id)?.slug);if(!c)throw Error('Chapter not found in content.json. If this is a synced public/upcoming record, Save will publish it as a new chapter.');Object.assign(c,{mangaId,number,title,slug,country:$('country').value,updated_at:new Date().toISOString()})}else{if(fresh.chapters.some(c=>c.slug===slug))throw Error('This slug already exists.');fresh.chapters.push({id:slug.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'chapter-'+Date.now(),mangaId,number,title,slug,country:$('country').value,pages:[],created_at:new Date().toISOString(),updated_at:new Date().toISOString()})}const out=await api('/contents/'+FILE,{method:'PUT',body:JSON.stringify({message:id?'Update chapter':'Add chapter',content:enc(JSON.stringify(fresh,null,2)+'\n'),sha:x.sha,branch:BRANCH})});sha=out.content.sha;data=fresh;render();reset();$('status').textContent='✓ Chapter saved successfully to content.json.'}catch(e){$('status').textContent='Save error: '+e.message}};</script></body></html>
