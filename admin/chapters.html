<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapters Admin | MangaAtlas</title><style>body{font:15px system-ui;background:#08090d;color:#eee;margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}.panel{background:#11131a;border:1px solid #292e39;border-radius:12px;padding:16px;margin:14px 0}button,input,select{padding:9px;border-radius:8px;border:1px solid #343a48;background:#090b10;color:#fff}button{background:#3f73c9;font-weight:700;cursor:pointer}.item{padding:12px;border:1px solid #292e39;border-radius:9px;margin:7px 0;display:flex;justify-content:space-between;gap:10px}.muted{color:#aab0bd}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>📚 Chapters Admin</h1><div class="panel"><input id="token" type="password" placeholder="GitHub token" style="width:70%"> <button id="connect">Connect</button><div id="msg" class="muted"></div></div><main id="app" class="hidden"><div class="panel"><button id="refresh">↻ Refresh</button> <input id="search" placeholder="Search chapters..." style="width:60%"></div><div class="panel"><b id="stats"></b><div id="list"></div></div><div id="edit" class="panel hidden"><h2 id="et">Edit chapter</h2><div class="row"><div><label>Chapter number</label><input id="num" type="number"></div><div><label>Title</label><input id="title" style="width:100%"></div><div><label>Slug</label><input id="slug" style="width:100%"></div><div><label>Manga</label><select id="manga" style="width:100%"></select></div></div><p><button id="save">Save chapter</button></p><hr><h3>🖼️ Upload chapter images</h3><input id="files" type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif"><p id="fi" class="muted"></p><button id="upload">Upload images</button><p id="up" class="muted"></p></div></main></div><script>'use strict';const owner='MangaAtlas',repo='MangaAtlas.github.io',branch='main',base='data/content.json',manual='data/manual-chapters.json';let token=sessionStorage.getItem('mangaatlas_github_token')||'',D={mangas:[],chapters:[]},current=null;const $=id=>document.getElementById(id),headers=()=>({Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'});async function api(path,opt={}){const r=await fetch('https://api.github.com/repos/'+owner+'/'+repo+path,{...opt,headers:{...headers(),...(opt.headers||{})},cache:'no-store'});const t=await r.text();if(!r.ok)throw Error('GitHub '+r.status+' '+t.slice(0,180));return t?JSON.parse(t):{}}function dec(s){const b=atob(s.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))}function enc(s){const u=new TextEncoder().encode(s);let x='';for(let i=0;i<u.length;i+=32768)x+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(x)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const x=await api('/contents/'+base+'?ref='+branch);D=JSON.parse(dec(x.content));D.mangas=D.mangas||[];D.chapters=D.chapters||[];try{const m=await api('/contents/'+manual+'?ref='+branch);const md=JSON.parse(dec(m.content));for(const c of md.chapters||[])if(!D.chapters.some(x=>x.slug===c.slug))D.chapters.push({...c,_manual:true})}catch(e){$('msg').textContent='Manual file load failed: '+e.message}render()}function render(){const q=$('search').value.toLowerCase();const a=D.chapters.filter(c=>!q||[c.title,c.slug,c.number,c.mangaId].join(' ').toLowerCase().includes(q)).sort((a,b)=>(+b.number||0)-(+a.number||0));$('stats').textContent=D.chapters.length+' total chapters · '+a.length+' shown';$('list').innerHTML=a.map(c=>'<div class="item"><div><b>'+esc(c.title)+'</b><br><span class="muted">Chapter '+esc(c.number)+' · '+esc(c.slug)+' · '+(c.pages?.length||0)+' pages'+(c._manual?' · Manual':'')+'</span></div><button onclick="edit('+D.chapters.indexOf(c)+')">Edit</button></div>').join('')||'<p class="muted">No chapters found.</p>';$('manga').innerHTML=D.mangas.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.title)+'</option>').join('')}window.edit=i=>{current=D.chapters[i];$('num').value=current.number||'';$('title').value=current.title||'';$('slug').value=current.slug||'';$('manga').value=current.mangaId||'';$('edit').classList.remove('hidden');$('edit').scrollIntoView({behavior:'smooth'})};async function save(){if(!current)return;const x=await api('/contents/'+base+'?ref='+branch),d=JSON.parse(dec(x.content));d.chapters=d.chapters||[];let c=d.chapters.find(z=>z.id===current.id||z.slug===current.slug);if(!c){c={...current};delete c._manual;d.chapters.push(c)}Object.assign(c,{mangaId:$('manga').value,number:Number($('num').value),title:$('title').value.trim(),slug:$('slug').value.trim(),country:'JP',pages:Array.isArray(c.pages)?c.pages:[]});await api('/contents/'+base,{method:'PUT',body:JSON.stringify({message:'Update chapter '+c.slug,content:enc(JSON.stringify(d,null,2)+'\n'),sha:x.sha,branch})});await load();current=D.chapters.find(z=>z.slug===c.slug);$('msg').textContent='✓ Chapter saved in content.json.'}function f64(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=()=>no(Error('read failed'));r.readAsDataURL(f)})}async function upload(){if(!current)throw Error('Select a chapter first.');const fs=[...$('files').files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));if(!fs.length)throw Error('Select images first.');const x=await api('/contents/'+base+'?ref='+branch),d=JSON.parse(dec(x.content));d.chapters=d.chapters||[];let c=d.chapters.find(z=>z.id===current.id||z.slug===current.slug);if(!c){c={...current};delete c._manual;c.pages=c.pages||[];d.chapters.push(c)}const m=D.mangas.find(z=>z.id===c.mangaId)||{};const folder='chapter-images/'+(m.slug||m.id||'manga')+'/chapter-'+c.slug;let paths=[];for(let i=0;i<fs.length;i++){const f=fs[i];$('up').textContent='Uploading '+(i+1)+'/'+fs.length+' '+f.name;const path=folder+'/'+String(i+1).padStart(4,'0')+'-'+f.name.replace(/[^a-zA-Z0-9._-]+/g,'_');const body={message:'Upload chapter image '+c.slug,content:await f64(f),branch};try{const old=await api('/contents/'+path+'?ref='+branch);body.sha=old.sha}catch(e){}await api('/contents/'+path,{method:'PUT',body:JSON.stringify(body)});paths.push(path)}c.pages=[...(c.pages||[]),...paths.filter(p=>!(c.pages||[]).includes(p))];await api('/contents/'+base,{method:'PUT',body:JSON.stringify({message:'Attach images '+c.slug,content:enc(JSON.stringify(d,null,2)+'\n'),sha:x.sha,branch})});$('up').textContent='✓ '+fs.length+' images uploaded and attached.';await load()}$('connect').onclick=async()=>{token=$('token').value.trim()||token;if(!token)return;$('connect').disabled=true;try{sessionStorage.setItem('mangaatlas_github_token',token);await load();$('app').classList.remove('hidden');$('msg').textContent='✓ Connected. Manual chapters included.'}catch(e){$('msg').textContent=e.message}finally{$('connect').disabled=false}};$('refresh').onclick=load;$('search').oninput=render;$('save').onclick=()=>save().catch(e=>$('msg').textContent=e.message);$('files').onchange=()=>{$('fi').textContent=$('files').files.length+' images selected'};$('upload').onclick=()=>upload().catch(e=>$('up').textContent='Error: '+e.message);if(token){$('token').value=token;$('connect').click()}</script></body></html>
