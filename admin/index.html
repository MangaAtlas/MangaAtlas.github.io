<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MangaAtlas Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#090a0f;color:#f5f5f7;font-family:system-ui;padding:40px}main{max-width:900px;margin:auto}.box{background:#11131b;border:1px solid #282b36;border-radius:18px;padding:24px;margin:18px 0}input,textarea,select{width:100%;padding:12px;margin:7px 0 14px;border-radius:9px;border:1px solid #303440;background:#0b0c11;color:white;box-sizing:border-box}button{background:#ff4d67;color:white;border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer}.muted{color:#9498a7}.preview{max-width:180px;max-height:240px;border-radius:10px;display:none;margin:10px 0}.status{margin-top:15px;color:#ff91a0}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head>
<body><main><h1>MangaAtlas Admin</h1><p class="muted">Manage manga metadata and upload cover images. Configure Supabase before using this panel.</p>
<div class="box"><h2>1. Sign in</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="login">Sign in</button><p id="authStatus" class="status"></p></div>
<div class="box"><h2>2. Add manga</h2><div class="row"><div><label>Title</label><input id="title" placeholder="Manga title"></div><div><label>Slug</label><input id="slug" placeholder="manga-title"></div></div><div class="row"><div><label>Author</label><input id="author"></div><div><label>Country</label><select id="country"><option value="JP">🇯🇵 Japan</option><option value="US">🇺🇸 USA</option><option value="FR">🇫🇷 France</option><option value="BR">🇧🇷 Brazil</option></select></div></div><label>Description</label><textarea id="description" rows="5"></textarea><label>Cover image</label><input id="cover" type="file" accept="image/jpeg,image/png,image/webp"><img id="preview" class="preview"><button id="save">Upload cover & save manga</button><p id="saveStatus" class="status"></p></div></main>
<script src="config.js"></script><script>
const cfg=window.MANGA_ATLAS_CONFIG||{};const client=cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY?supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):null;
const $=id=>document.getElementById(id);const status=(id,msg)=>$(id).textContent=msg;
$('cover').onchange=e=>{const f=e.target.files[0];if(f){$('preview').src=URL.createObjectURL(f);$('preview').style.display='block'}};
$('login').onclick=async()=>{if(!client)return status('authStatus','Add admin/config.js first.');const {error}=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});status('authStatus',error?error.message:'Signed in successfully.');};
$('save').onclick=async()=>{if(!client)return status('saveStatus','Add admin/config.js first.');const {data:{user}}=await client.auth.getUser();if(!user)return status('saveStatus','Sign in first.');const file=$('cover').files[0];if(!file)return status('saveStatus','Choose a cover image.');const slug=$('slug').value.trim();if(!slug||!$('title').value.trim())return status('saveStatus','Title and slug are required.');status('saveStatus','Uploading cover...');const path=`${slug}-${Date.now()}.${file.name.split('.').pop().toLowerCase()}`;let r=await client.storage.from('manga-covers').upload(path,file,{cacheControl:'31536000',upsert:false});if(r.error)return status('saveStatus',r.error.message);const {data:urlData}=client.storage.from('manga-covers').getPublicUrl(path);const row={slug,title:$('title').value.trim(),author:$('author').value.trim(),description:$('description').value.trim(),country:$('country').value,cover_url:urlData.publicUrl};const ins=await client.from('manga').insert(row);status('saveStatus',ins.error?ins.error.message:'Manga saved successfully.');};
</script></body></html>
