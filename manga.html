<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manga | MangaAtlas</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:45px 5%}.back{color:#9ea2b0}.back:hover{color:#fff}.detail{display:grid;grid-template-columns:280px 1fr;gap:35px;margin-top:30px}.cover{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;background:#171922}.eyebrow{color:#28589d;font-size:12px;font-weight:800;letter-spacing:2px}.title{font-size:clamp(34px,5vw,58px);margin:10px 0}.muted{color:#9296a5;line-height:1.7}.meta{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tag{border:1px solid #303340;background:#11131a;border-radius:999px;padding:8px 12px;color:#b9bdc9;font-size:13px}.error{text-align:center;padding:80px 20px}@media(max-width:700px){.detail{grid-template-columns:1fr}.cover{max-width:260px}.title{font-size:38px}}</style></head><body><main class="wrap"><a class="back" href="/">← MangaAtlas</a><div id="app"></div></main><script>const sb=supabase.createClient('https://vcrrkyqiunczhpxdcoil.supabase.co','sb_publishable_IWiCOqUZ7PtPaISAo_5RDw_9uTvyD4z');const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');async function init(){const slug=new URLSearchParams(location.search).get('slug');const app=document.getElementById('app');if(!slug){app.innerHTML='<div class="error"><h1>Manga not found</h1></div>';return}const {data,error}=await sb.from('manga').select('*').eq('slug',slug).single();if(error||!data){app.innerHTML='<div class="error"><h1>Manga not found</h1><p class="muted">This manga does not exist or its slug is incorrect.</p></div>';return}document.title=`${data.title} | MangaAtlas`;app.innerHTML=`<article class="detail"><img class="cover" src="${esc(data.cover_url||'https://placehold.co/600x800/171922/ffffff?text=Manga')}" alt="${esc(data.title)}"><div><div class="eyebrow">${esc(data.country||'')}</div><h1 class="title">${esc(data.title)}</h1>${data.native_title?`<p class="muted">${esc(data.native_title)}</p>`:''}<div class="meta">${data.author?`<span class="tag">Author: ${esc(data.author)}</span>`:''}${data.artist?`<span class="tag">Artist: ${esc(data.artist)}</span>`:''}${data.status?`<span class="tag">${esc(data.status)}</span>`:''}</div><p class="muted">${esc(data.description||'No description available yet.')}</p>${data.genres?.length?`<div class="meta">${data.genres.map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</div>`:''}</div></article>`}init();</script></body></html>
