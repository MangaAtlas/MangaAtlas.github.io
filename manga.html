<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="description" content="Manga information, chapters and latest releases on MangaAtlas."><link id="canonical" rel="canonical" href="https://mangaatlas.github.io/"><title>Manga | MangaAtlas</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0e;color:#f5f5f7;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:1200px;margin:auto;padding:30px 5% 70px}.back{color:#a8adba;text-decoration:none}.hero{display:grid;grid-template-columns:260px 1fr;gap:35px;margin-top:28px}.cover{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:16px}.title{font-size:clamp(34px,5vw,58px);margin:8px 0}.native{color:#aab0bd;font-size:18px}.meta{color:#9298a8;line-height:1.8}.chapters{margin-top:42px}.section-title{font-size:25px}.chapter-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.chapter{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px 18px;background:#10131a;border:1px solid #252a35;border-radius:12px;color:#fff;text-decoration:none}.chapter:hover{border-color:#5b8bd9}.chapter small{display:block;color:#818897;margin-top:5px}.arrow{font-size:20px;color:#789bd0}.empty{text-align:center;padding:60px 20px;color:#858c9b}.error{color:#ff8c9b}@media(max-width:800px){.hero{grid-template-columns:1fr}.cover{max-width:260px}.chapter-list{grid-template-columns:1fr}}@media(min-width:801px) and (max-width:1050px){.chapter-list{grid-template-columns:1fr 1fr}}</style><script src="/analytics.js"></script></head><body><main class="wrap"><a class="back" href="/">← MangaAtlas</a><div id="app"><div class="empty">Loading manga…</div></div></main><script>
(function(){'use strict';
var slug='';try{slug=new URLSearchParams(location.search).get('slug')||''}catch(e){}if(!slug){var m=location.pathname.match(/^\/manga\/(.+)$/);if(m)slug=decodeURIComponent(m[1])}
function norm(v){return String(v||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/-+/g,'-').replace(/^-+|-+$/g,'').replace(/-raw$/,'').replace(/-ja$/,'')}
function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(x){return({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'})[x]})}
function get(path){return fetch(path+'?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw Error();return r.json()}).catch(function(){return {}})}
function unwrap(d){if(d&&typeof d.content==='string'){try{return JSON.parse(d.content)}catch(e){}}return d||{}}
function mangaKey(m){return norm(m&& (m.id||m.mangaId||m.slug||m.title||m.name))}
function chapterKey(c,mangas){var vals=[c&&c.mangaId,c&&c.manga_id,c&&c.seriesId,c&&c.series_id,c&&c.manga,c&&c.mangaTitle,c&&c.series].filter(Boolean).map(norm);for(var i=0;i<mangas.length;i++){var k=mangaKey(mangas[i]);if(vals.indexOf(k)>=0)return k}var s=norm(c&&c.slug);for(var j=0;j<mangas.length;j++){var mk=mangaKey(mangas[j]);if(s===mk||s.indexOf(mk+'-')===0||s.indexOf(mk.replace(/-/g,''))===0)return mk}return vals[0]||''}
function num(c){var n=Number(c&&c.number);if(Number.isFinite(n))return n;var m=String(c&&c.title||c&&c.slug||'').match(/(?:chapter|chap|第)[^0-9]*([0-9]+)/i);return m?Number(m[1]):-1}
function unique(a){var s={};return a.filter(function(c){var k=String(c&&c.slug||'');if(!k||s[k])return false;s[k]=1;return true})}
function render(data,chapters,manga){var app=document.getElementById('app');document.title=(manga.title||'Manga')+' | MangaAtlas';document.getElementById('canonical').href='https://mangaatlas.github.io/manga.html?slug='+encodeURIComponent(manga.slug||manga.id);var cover=manga.cover||manga.cover_url||'https://placehold.co/640x860/151821/ffffff?text=Manga';chapters=unique(chapters).sort(function(a,b){return num(b)-num(a)});var list=chapters.length?chapters.map(function(c){return '<a class="chapter" href="/chapter.html?slug='+encodeURIComponent(c.slug)+'"><div><strong>Chapter '+esc(num(c)>-1?num(c):'')+(c.title?' — '+esc(c.title):'')+'</strong><small>'+esc(c.slug)+'</small></div><span class="arrow">→</span></a>'}).join(''):'<div class="empty">No chapters added yet.</div>';app.innerHTML='<div class="hero"><img class="cover" src="'+esc(cover)+'" alt="'+esc(manga.title)+'"><div><div class="meta">'+esc(manga.country||'')+' · '+esc(manga.language||'')+'</div><h1 class="title">'+esc(manga.title||manga.name||'Manga')+'</h1>'+(manga.native_title?'<div class="native">'+esc(manga.native_title)+'</div>':'')+'<p class="meta">'+esc(manga.description||'Manga chapters and raw releases on MangaAtlas.')+'</p></div></div><section class="chapters"><h2 class="section-title">📚 Chapters ('+chapters.length+')</h2><div class="chapter-list">'+list+'</div></section>'}
function boot(){if(!slug){document.getElementById('app').innerHTML='<div class="empty error">Manga not found.</div>';return}Promise.all([get('/data/content.json'),get('/data/manual-chapters.json'),get('/data/upcoming-chapters.json')]).then(function(ds){var base=unwrap(ds[0]),manual=unwrap(ds[1]),up=unwrap(ds[2]),mangas=Array.isArray(base.mangas)?base.mangas:[],manga=mangas.find(function(x){return norm(x.slug||x.id||x.title)===norm(slug)});if(!manga){document.getElementById('app').innerHTML='<div class="empty error">Manga not found.</div>';return}var key=mangaKey(manga),all=(base.chapters||[]).concat(manual.chapters||[],up.chapters||[]),chapters=all.filter(function(c){return chapterKey(c,mangas)===key});render(base,chapters,manga)}).catch(function(){document.getElementById('app').innerHTML='<div class="empty error">Unable to load manga.</div>'})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();})();
</script></body></html>
