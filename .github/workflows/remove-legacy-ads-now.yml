name: Remove legacy static ads
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message != 'Remove legacy static ads'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for any legacy injector run
        run: sleep 25
      - name: Remove legacy ads and injector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').glob('*.html'):
              text=p.read_text(encoding='utf-8')
              new=re.sub(r'\s*<!-- MangaAtlas STATIC ADS START -->.*?<!-- MangaAtlas STATIC ADS END -->\s*', '\n', text, flags=re.S)
              new=re.sub(r'\s*<!-- MangaAtlas STATIC ADS BOTTOM START -->.*?<!-- MangaAtlas STATIC ADS BOTTOM END -->\s*', '\n', new, flags=re.S)
              if new != text:
                  p.write_text(new, encoding='utf-8')
          Path('.github/workflows/install-static-ads.yml').unlink(missing_ok=True)
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'MangaAtlas Bot'
          git config user.email 'bot@mangaatlas.local'
          git add -A
          git diff --cached --quiet || git commit -m 'Remove legacy static ads'
          git push
