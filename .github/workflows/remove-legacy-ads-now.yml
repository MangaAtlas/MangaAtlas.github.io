name: Remove legacy ads

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy static ad blocks from public HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          providers = r'(?:https://pl31326962\.profitableratecpmnetwork\.com/[^"\']+|https://pl31326963\.profitableratecpmnetwork\.com/[^"\']+|https://www\.highrevenueformat\.com/[^"\']+)'
          for path in Path('.').glob('*.html'):
              if path.name == 'index.html' or path.parts[:1] == ('admin',):
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              text = re.sub(r'<!-- MangaAtlas STATIC ADS START -->.*?<!-- MangaAtlas STATIC ADS END -->\s*', '', text, flags=re.S)
              text = re.sub(r'<!-- MangaAtlas STATIC ADS BOTTOM START -->.*?<!-- MangaAtlas STATIC ADS BOTTOM END -->\s*', '', text, flags=re.S)
              text = re.sub(r'<script[^>]+src=["\']' + providers + r'["\'][^>]*>\s*</script>', '', text, flags=re.I|re.S)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print('cleaned', path)
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'MangaAtlas Bot'
          git config user.email 'bot@mangaatlas.local'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No legacy ad blocks found.'
            exit 0
          fi
          git commit -m 'Remove all legacy static ads from public pages'
          git push
