name: Refresh MangaAtlas sitemap and build MangaReader package

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate fresh sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Commit sitemap when changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Refresh sitemap"
          git push

  mangareader-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build clean MangaReader package
        shell: python
        run: |
          import os, re, shutil
          from pathlib import Path

          src = Path('.')
          out = Path('mangareader-package')
          if out.exists(): shutil.rmtree(out)
          out.mkdir()

          excluded = {'.git', '.github', 'ads', 'sitemap.xml'}
          for p in src.iterdir():
              if p.name in excluded: continue
              if p.name == 'mangareader-package': continue
              dest = out / p.name
              if p.is_dir(): shutil.copytree(p, dest)
              else: shutil.copy2(p, dest)

          # Remove all bundled ad files/references from the clean copy.
          for p in list(out.rglob('*')):
              if p.is_file() and p.suffix.lower() in {'.html','.js','.css','.xml','.txt','.md'}:
                  text = p.read_text(encoding='utf-8')
                  text = text.replace('MangaAtlas', 'MangaReader')
                  text = text.replace('MANGA_ATLAS_CONFIG', 'MANGAREADER_CONFIG')
                  text = text.replace('mangaatlas.github.io', 'YOUR-GITHUB-USERNAME.github.io')
                  text = text.replace('https://YOUR-GITHUB-USERNAME.github.io/', '/')
                  p.write_text(text, encoding='utf-8')

          # Shared, blank database configuration: uploaders can connect a fresh Supabase project.
          (out / 'config.js').write_text("window.MANGAREADER_CONFIG = {\n  SUPABASE_URL: '',\n  SUPABASE_ANON_KEY: '',\n  SITE_NAME: 'MangaReader'\n};\n", encoding='utf-8')

          # Make public pages consume the shared config instead of the old MangaAtlas database.
          for p in out.glob('*.html'):
              if p.name == 'config.js': continue
              text = p.read_text(encoding='utf-8')
              text = re.sub(r"supabase\.createClient\('https://vcrrkyqiunczhpxdcoil\.supabase\.co','[^']+'\)", "supabase.createClient(window.MANGAREADER_CONFIG.SUPABASE_URL,window.MANGAREADER_CONFIG.SUPABASE_ANON_KEY)", text)
              if 'supabase-js@2' in text and 'src="/config.js"' not in text:
                  text = text.replace('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>', '<script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>')
              p.write_text(text, encoding='utf-8')

          # Clean chapter reader: no ad slots, no ad scripts, no ad iframes.
          cp = out / 'chapter.html'
          text = cp.read_text(encoding='utf-8')
          text = re.sub(r"function adFrame\(.*?\}let adQueue=Promise\.resolve\(\);function queueAd\(.*?\}function loadOneAd\(.*?\}\}", "function addAds(){}", text, flags=re.S)
          text = re.sub(r"let html='<div class=\\\"ad-slot ad-container\\\" data-ad=\\\"container\\\"></div>';", "let html='';", text)
          text = re.sub(r"if\(ad728Count<6&&i<11\)\{html\+='<div class=\\\"ad-slot ad-90\\\" data-ad=\\\"728\\\"></div>';ad728Count\+\+\}", "", text)
          text = re.sub(r"if\(i===2\|\|i===7\)html\+='<div class=\\\"ad-slot ad-container\\\" data-ad=\\\"container\\\"></div>';", "", text)
          text = re.sub(r"if\(i===5\)html\+='<div class=\\\"ad-slot ad-50\\\" data-ad=\\\"320\\\"></div>';", "", text)
          text = text.replace("html+='<div class=\"ad-slot ad-250\" data-ad=\"300\"></div>';", "")
          text = re.sub(r"let ad728Count=0;", "", text)
          text = re.sub(r"\.ad-slot\{.*?\}\n?", "", text)
          cp.write_text(text, encoding='utf-8')

          # Fresh empty sitemap for the clone; no manga/chapter URLs are included.
          (out / 'sitemap.xml').write_text('''<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>https://YOUR-GITHUB-USERNAME.github.io/</loc></url>\n  <url><loc>https://YOUR-GITHUB-USERNAME.github.io/manga.html</loc></url>\n  <url><loc>https://YOUR-GITHUB-USERNAME.github.io/country.html</loc></url>\n  <url><loc>https://YOUR-GITHUB-USERNAME.github.io/japan-blog.html</loc></url>\n  <url><loc>https://YOUR-GITHUB-USERNAME.github.io/france-blog.html</loc></url>\n</urlset>\n''', encoding='utf-8')

          (out / 'MangaReader-SETUP.md').write_text('''# MangaReader setup\n\nThis package is a clean clone of the site UI/admin system. Manga and chapter data are intentionally not included.\n\n## Supabase\n1. Create a new Supabase project.\n2. Run `supabase/schema.sql` in the SQL editor.\n3. Put the new project URL and anon/publishable key in `config.js`.\n4. Put the same values in `admin/config.js`.\n5. Replace `YOUR-GITHUB-USERNAME` with the new GitHub Pages username/domain if needed.\n\nThe admin system remains included, but it is intentionally disconnected from the old MangaAtlas database until you configure the new Supabase project.\n''', encoding='utf-8')

          # Remove any remaining ad directory if copied indirectly.
          shutil.rmtree(out / 'ads', ignore_errors=True)

      - name: Zip MangaReader package
        run: zip -qr MangaReader.zip mangareader-package

      - name: Upload MangaReader ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaReader
          path: MangaReader.zip
          if-no-files-found: error
          retention-days: 30
