name: Refresh MangaAtlas sitemap

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate fresh sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Commit sitemap when changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Refresh sitemap"
          git push
