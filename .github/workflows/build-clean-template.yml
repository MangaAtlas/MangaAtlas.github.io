name: Build clean MangaAtlas template
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make clean template
        shell: bash
        run: |
          set -e
          rm -rf clean-template /tmp/MangaAtlas-clean-template.zip
          mkdir -p clean-template
          rsync -a --exclude='.git' --exclude='clean-template' --exclude='chapter-images' --exclude='manga-covers' --exclude='data/content.json' --exclude='sitemap.xml' --exclude='supabase' --exclude='.github/workflows/build-clean-template.yml' --exclude='*.zip' --exclude='*.rar' ./ clean-template/
          mkdir -p clean-template/chapter-images clean-template/manga-covers clean-template/data
          cat > clean-template/data/content.json <<'JSON'
          {
            "version": 1,
            "mangas": [],
            "chapters": []
          }
          JSON
          cat > clean-template/sitemap.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"></urlset>
          XML
          cd clean-template
          zip -r /tmp/MangaAtlas-clean-template.zip . -x '*.git*' '*.zip' '*.rar'
      - uses: actions/upload-artifact@v4
        with:
          name: MangaAtlas-clean-template
          path: /tmp/MangaAtlas-clean-template.zip
          retention-days: 30
