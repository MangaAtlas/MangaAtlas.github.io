name: Normalize manual chapter data
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize manual JSON wrapper
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/manual-chapters.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          changed=False
          while isinstance(d,dict) and isinstance(d.get('content'),str):
              try:
                  inner=json.loads(d['content'])
              except Exception:
                  break
              d=inner
              changed=True
          if changed and isinstance(d,dict) and isinstance(d.get('chapters'),list):
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          else:
              print('Manual data already normalized')
          PY
      - name: Commit normalized data
        run: |
          git config user.name 'MangaAtlas Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/manual-chapters.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Normalize manual chapter data'
          git push
