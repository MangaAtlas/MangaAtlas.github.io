name: Clear One Piece 1193 + Sakamoto Days 275 images

on:
  push:
    paths:
      - '.github/workflows/add-1193-275-and-fix-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clear old chapter images and references
        run: |
          rm -rf 'chapter-images/one-piece/chapter-1193'
          rm -rf 'chapter-images/one-piece/chapter-ワンピース-One Piece-1193'
          rm -rf 'chapter-images/sakamoto-days-ja/chapter-275'

          python - <<'PY'
          import json
          from pathlib import Path

          # Remove old Sakamoto manual entry completely so the Admin uploader
          # can create a fresh chapter record and attach newly uploaded images.
          p = Path('data/manual-chapters.json')
          if p.exists():
              d = json.loads(p.read_text(encoding='utf-8'))
              d['chapters'] = [
                  c for c in d.get('chapters', [])
                  if c.get('slug') != 'sakamoto-days-raw-275'
                  and c.get('id') != 'sakamoto-days-raw-275'
              ]
              p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Make both chapter records image-empty for a clean re-upload.
          p = Path('data/content.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          for c in d.get('chapters', []):
              if c.get('number') == 1193 and c.get('mangaId') == 'one-piece':
                  c['pages'] = []
              if c.get('number') == 275 and ('sakamoto' in str(c.get('slug','')).lower() or c.get('mangaId') == 'sakamoto-days-ja'):
                  c['pages'] = []
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Clear old One Piece 1193 and Sakamoto Days 275 images'
          git push
