name: Final cleanup deleted One Piece 1193 and Sakamoto Days 275

on:
  push:
    paths:
      - '.github/workflows/add-1193-275-and-fix-images.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove stale chapter data and links
        run: |
          python3 - <<'PY'
          import json, re, shutil
          from pathlib import Path

          ONE = 'ワンピース-One Piece-1193'
          SAKA = 'sakamoto-days-raw-275'

          def deleted(c):
              slug = str(c.get('slug',''))
              title = str(c.get('title',''))
              mid = str(c.get('mangaId',''))
              if slug == ONE or c.get('id') == '-one-piece-1193-':
                  return True
              if slug == SAKA or c.get('id') == SAKA:
                  return True
              if c.get('number') == 1193 and ('one-piece' in slug.lower() or 'one piece' in title.lower() or mid == 'one-piece'):
                  return True
              if c.get('number') == 275 and ('sakamoto' in slug.lower() or 'sakamoto' in title.lower() or 'sakamoto' in mid.lower()):
                  return True
              return False

          for path in [Path('data/content.json'), Path('data/manual-chapters.json'), Path('data/upcoming-chapters.json')]:
              if not path.exists():
                  continue
              try:
                  d = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if isinstance(d.get('chapters'), list):
                  d['chapters'] = [c for c in d['chapters'] if not deleted(c)]
                  path.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts or 'admin' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              text = re.sub(r'^[^\n]*(?:sakamoto-days-raw-275|%E3%83%AF%E3%83%B3%E3%83%94%E3%83%BC%E3%82%B9-One%20Piece-1193|ワンピース-One Piece-1193)[^\n]*\n?', '', text, flags=re.I|re.M)
              path.write_text(text, encoding='utf-8')

          for p in [
              Path('chapter-images/one-piece/chapter-1193'),
              Path('chapter-images/one-piece/chapter-ワンピース-One Piece-1193'),
              Path('chapter-images/sakamoto-days-ja/chapter-275'),
              Path('chapter-images/days/chapter-275')
          ]:
              if p.exists():
                  shutil.rmtree(p)
          PY

      - name: Remove this obsolete cleanup workflow
        run: |
          rm -f .github/workflows/add-1193-275-and-fix-images.yml .github/workflows/cleanup-deleted-1193-275.yml
          git config user.name 'MangaAtlas Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Permanently remove deleted One Piece 1193 and Sakamoto Days 275'
          git push
