name: Sync fresh chapter URLs to sitemap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add fresh chapter URLs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('sitemap.xml')
          text = path.read_text(encoding='utf-8')
          additions = [
              '  <url><loc>https://mangaatlas.github.io/chapter.html?slug=sakamoto-days-raw-275-v2</loc><lastmod>2026-09-12T05:21:00Z</lastmod></url>',
              '  <url><loc>https://mangaatlas.github.io/chapter.html?slug=one-piece-raw-1193-v2</loc><lastmod>2026-09-12T05:21:00Z</lastmod></url>'
          ]
          missing = [line for line in additions if line not in text]
          if missing:
              text = text.replace('</urlset>', '\n'.join(missing) + '\n</urlset>')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit sitemap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m 'Add fresh chapter URLs to sitemap'
          git push
