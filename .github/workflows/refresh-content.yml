name: GitHub-only content refresh
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub content
        run: node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('data/content.json','utf8')); if(!Array.isArray(d.mangas)||!Array.isArray(d.chapters)) process.exit(1); console.log('GitHub-only content OK:',d.mangas.length,'manga,',d.chapters.length,'chapters')"