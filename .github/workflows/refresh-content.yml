name: GitHub-only content refresh
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub content
        run: node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('data/content.json','utf8')); if(!Array.isArray(d.mangas)||!Array.isArray(d.chapters)) process.exit(1); console.log('GitHub-only content OK:',d.mangas.length,'manga,',d.chapters.length,'chapters')"

  seed-requested-metadata:
    if: startsWith(github.event.head_commit.message, 'Add requested manga metadata')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add requested manga and chapter records
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/content.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          mangas = data.setdefault('mangas', [])
          chapters = data.setdefault('chapters', [])
          requested = [
            ('akane-banashi','Akane-banashi','あかね噺',221),
            ('under-doctor','UNDER DOCTOR','アンダードクター',31),
            ('witch-watch','Witch Watch','ウィッチウォッチ',261),
            ('boku-to-roboko','BOKU TO ROBOKO','僕とロボコ',296),
            ('ultimate-exorcist-kiyoshi','Ultimate Exorcist Kiyoshi','悪祓士のキヨシくん',107),
            ('nezumis-first-love',"Nezumi's First Love",'ねずみの初恋',118),
            ('shinobi-undercover','Shinobi Undercover','しのびごと',96),
            ('ruridragon','RuriDragon','ルリドラゴン',51),
            ('the-exiled-heavy-knight-knows-how-to-game-the-system','The Exiled Heavy Knight Knows How to Game the System','追放された転生重騎士はゲーム知識で無双する',178),
          ]
          for mid, title, native, number in requested:
            slug = mid
            if not any(m.get('id') == mid or m.get('slug') == slug for m in mangas):
              mangas.append({'id':mid,'title':title,'native_title':native,'country':'JP','language':'ja','cover':'https://placehold.co/300x400','slug':slug})
            cslug = f'{slug}-raw-{number}'
            if not any(c.get('mangaId') == mid and c.get('number') == number for c in chapters):
              chapters.append({'id':f'{mid}-chapter-{number}','mangaId':mid,'title':f'{native} raw ( {title} raw ) 第{number}話','number':number,'slug':cslug,'country':'JP','pages':[]})
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit requested metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/content.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: add requested manga and chapters'
          git push
