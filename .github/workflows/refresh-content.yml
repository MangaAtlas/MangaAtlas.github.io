name: GitHub-only content refresh
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub content
        run: node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('data/content.json','utf8')); if(!Array.isArray(d.mangas)||!Array.isArray(d.chapters)) process.exit(1); console.log('GitHub-only content OK:',d.mangas.length,'manga,',d.chapters.length,'chapters')"
      - name: Fix ad provider and blank slots
        shell: python
        run: |
          from pathlib import Path
          for name in ['ads/728.html','ads/300.html']:
              p=Path(name)
              if p.exists():
                  s=p.read_text(encoding='utf-8').replace('www.highrevenueformat.com','www.highperformanceformat.com')
                  p.write_text(s,encoding='utf-8')
          p=Path('chapter.html')
          s=p.read_text(encoding='utf-8').replace('www.highrevenueformat.com','www.highperformanceformat.com')
          if 'function watchAd(slot)' not in s:
              s=s.replace("function adFrame(slot,html,height,src){", "function watchAd(slot){setTimeout(()=>{try{const f=slot.querySelector('iframe');if(!f){slot.classList.add('ad-empty');return}const d=f.contentDocument,b=d&&d.body;if(!b||(!b.children.length&&!b.textContent.trim()))slot.classList.add('ad-empty')}catch(e){}},12000)}function adFrame(slot,html,height,src){",1)
          s=s.replace("slot.dataset.adLoaded='yes';return}const code=", "slot.dataset.adLoaded='yes';watchAd(slot);return}const code=",1)
          s=s.replace("adFrame(slot,code,height);slot.dataset.adLoaded='yes'", "adFrame(slot,code,height);slot.dataset.adLoaded='yes';watchAd(slot)",1)
          s=s.replace("setTimeout(()=>{if(slot.dataset.adLoaded==='loading')slot.dataset.adLoaded='yes'},3000)", "setTimeout(()=>{if(slot.dataset.adLoaded==='loading')slot.dataset.adLoaded='yes';watchAd(slot)},3000)",1)
          s=s.replace("slot.appendChild(f);slot.dataset.adLoaded='yes'", "slot.appendChild(f);slot.dataset.adLoaded='yes';watchAd(slot)",1)
          css='.ad-slot.ad-empty{display:none!important;min-height:0!important;height:0!important;margin:0!important;padding:0!important}'
          if css not in s: s=s.replace('</style>',css+'</style>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit ad fix when changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chapter.html ads/728.html ads/300.html
          git commit -m 'Fix blank ad slots and ad provider rendering'
          git push
