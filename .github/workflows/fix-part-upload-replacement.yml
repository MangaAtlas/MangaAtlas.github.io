name: Fix part upload replacement

on:
  push:
    paths:
      - '.github/workflows/fix-part-upload-replacement.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin uploader safely
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p=Path('admin/index.html')
          s=p.read_text(encoding='utf-8')

          def replace_function(text,name,replacement):
              marker='async function '+name+'('
              start=text.find(marker)
              if start<0: raise SystemExit(name+' function not found')
              brace=text.find('{',start)
              if brace<0: raise SystemExit(name+' opening brace not found')
              depth=0; quote=None; esc=False; i=brace
              while i<len(text):
                  ch=text[i]
                  if quote:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: quote=None
                  else:
                      if ch in "'\"`": quote=ch
                      elif ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0:
                              end=i+1
                              return text[:start]+replacement+text[end:]
                  i+=1
              raise SystemExit(name+' closing brace not found')

          prepare="""async function prepareImage(file,max=1600,quality=.76){if(!file||!/^image\\/(jpeg|png|webp)$/i.test(file.type))throw Error(file?.name+' is not a JPG, PNG or WebP image.');if(file.size>7*1024*1024)throw Error(file.name+' is over 7MB.');const src=URL.createObjectURL(file);try{const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(Error('Could not decode '+file.name));i.src=src});const nw=img.naturalWidth,nh=img.naturalHeight,isLong=nh/nw>=3;let scale=isLong?Math.min(1,max/nw):Math.min(1,max/Math.max(nw,nh));const w=Math.max(1,Math.round(nw*scale)),h=Math.max(1,Math.round(nh*scale));const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');if(!ctx)throw Error('Image canvas is unavailable.');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,w,h);let blob=null;for(const q of (isLong?[.92,.86,.8,.74,.68,.62,.56]:[.82,.74,.66,.58,.5,.42])){blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Image compression failed.')),'image/webp',q));if(blob.size<=7*1024*1024)break}if(!blob||blob.size>7*1024*1024)throw Error(file.name+' is still too large after compression (7MB max).');return new File([blob],file.name.replace(/\\.[^.]+$/,'')+'.webp',{type:'image/webp'})}finally{URL.revokeObjectURL(src)}}"""
          s=replace_function(s,'prepareImage',prepare)

          helper="""async function deleteRepoFile(ref){let clean='';if(typeof ref==='string')clean=ref;else if(ref&&typeof ref==='object')clean=ref.url||ref.path||ref.src||'';if(!clean)return;try{clean=clean.replace(/^https?:\\/\\/[^/]+\\//,'');const at=clean.indexOf('@main/');if(at>=0)clean=clean.slice(at+6);clean=decodeURIComponent(clean).replace(/^\\/+/, '');if(!clean.startsWith('chapter-images/'))return;const r=await api('/contents/'+clean+'?ref='+BRANCH);if(r?.sha)await api('/contents/'+clean,{method:'DELETE',body:JSON.stringify({message:'Remove replaced chapter image '+clean,sha:r.sha,branch:BRANCH})})}catch(e){if(!/GitHub 404/.test(e.message))throw e}}"""
          if 'async function deleteRepoFile' not in s:
              marker='async function uploadFile'
              s=s.replace(marker,helper+marker,1)

          upload="""async function uploadPart(which){try{const input=$(which==='1'?'cPages1':'cPages2'),progress=$(which==='1'?'part1Progress':'part2Progress'),files=[...input.files];if(!editChapterId)throw Error('Pehle chapter ko Save chapter details se create karo, phir Part 1/Part 2 upload karo.');if(!files.length)throw Error('Is part ke liye images select karo.');if(files.length>10)throw Error('Ek part mein maximum 10 images upload karo.');const c=data.chapters.find(x=>x.id===editChapterId);if(!c)throw Error('Chapter not found.');const min=which==='1'?1:11,max=which==='1'?10:20;const oldPages=[...(c.pages||[])].slice(min-1,max);const latest=(await readData()).data;const fresh=latest.chapters.find(x=>x.id===c.id);if(!fresh)throw Error('Chapter not found in latest GitHub data.');const newPages=[...(fresh.pages||[])];for(let i=min-1;i<max;i++)newPages[i]=null;const used=new Set();const uploaded=[];for(let i=0;i<files.length;i++){progress.textContent=`Preparing image ${i+1}/${files.length}…`;const f=await prepareImage(files[i]);let pageNo=pageNumberFromName(files[i].name);if(!(pageNo>=min&&pageNo<=max)||used.has(pageNo)){pageNo=null;for(let n=min;n<=max;n++)if(!used.has(n)){pageNo=n;break}}if(!pageNo)throw Error('Part '+which+' mein maximum 10 pages allowed hain.');used.add(pageNo);const safe=files[i].name.replace(/[^a-zA-Z0-9._-]+/g,'-').replace(/\\.[^.]+$/,'');const path=`chapter-images/${fresh.mangaId}/chapter-${fresh.number}/p${String(pageNo).padStart(2,'0')}-${Date.now()}-${i}-${safe}.webp`;progress.textContent=`Uploading image ${i+1}/${files.length}…`;await uploadFile(path,f);newPages[pageNo-1]=path;uploaded.push(path)}progress.textContent='Removing old images from this part…';for(const old of oldPages){if(old&&!uploaded.includes(typeof old==='string'?old:(old.url||old.path||'')))await deleteRepoFile(old)}fresh.pages=newPages;const last=newPages.reduce((n,v,i)=>v?i+1:n,0);fresh.pages=newPages.slice(0,Math.max(last,max===20&&newPages.slice(10,20).some(Boolean)?20:Math.min(10,last)));const x=await readData();const finalChapter=x.data.chapters.find(z=>z.id===fresh.id);if(!finalChapter)throw Error('Chapter disappeared from GitHub data.');finalChapter.pages=fresh.pages;await writeData(x.data,x.sha,`Replace chapter ${fresh.number} part ${which}`);data=x.data;renderLists();progress.textContent=`✓ Part ${which}: ${files.length} new image(s) uploaded; old pages ${min}–${max} removed.`;setStatus(`Part ${which} updated. Purani images isi part se delete ho gayi hain; doosra part untouched hai.`)}catch(e){$(which==='1'?'part1Progress':'part2Progress').textContent='Error: '+e.message;setStatus('Error: '+e.message)}}"""
          s=replace_function(s,'uploadPart',upload)

          s=s.replace('Long single-image chapters (jaise 900×24641) ko ab width preserve karke upload kiya jayega.','Har image ka source aur final size maximum 7MB hai. Part 1/Part 2 update karne par usi part ki purani images GitHub se delete hokar new images se replace hoti hain.')
          s=s.replace('max 10 recommended','max 10 · 7MB each')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate admin JavaScript
        run: |
          python3 <<'PY' > /tmp/admin.js
          from pathlib import Path
          import re
          s=Path('admin/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          print('\n'.join(blocks))
          PY
          node --check /tmp/admin.js

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html
          git diff --cached --quiet || git commit -m 'Fix chapter part replacement and 7MB image limit'
          git push
