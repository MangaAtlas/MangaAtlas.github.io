name: One-time cleanup deleted 1193 and 275

on:
  push:
    paths:
      - '.github/workflows/cleanup-deleted-1193-275.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove stale chapter records and links
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          ONE = 'ワンピース-One Piece-1193'
          SAKA = 'sakamoto-days-raw-275'

          def bad(c):
              slug = str(c.get('slug',''))
              title = str(c.get('title',''))
              mid = str(c.get('mangaId',''))
              if slug == ONE or c.get('id') == '-one-piece-1193-':
                  return True
              if slug == SAKA or c.get('id') == SAKA:
                  return True
              if c.get('number') == 1193 and ('one-piece' in slug.lower() or 'one piece' in title.lower() or mid == 'one-piece'):
                  return True
              if c.get('number') == 275 and ('sakamoto' in slug.lower() or 'sakamoto' in title.lower() or 'sakamoto' in mid.lower()):
                  return True
              return False

          for path in [Path('data/content.json'), Path('data/manual-chapters.json'), Path('data/upcoming-chapters.json')]:
              if not path.exists():
                  continue
              try:
                  d = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              changed = False
              if isinstance(d.get('chapters'), list):
                  old = len(d['chapters'])
                  d['chapters'] = [c for c in d['chapters'] if not bad(c)]
                  changed = len(d['chapters']) != old
              if changed:
                  path.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Remove stale crawlable/static links from HTML pages without touching the rest.
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts or path.as_posix().startswith('admin/'):
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              old = text
              text = re.sub(r'^[^\n]*sakamoto-days-raw-275[^\n]*\n?', '', text, flags=re.I|re.M)
              text = re.sub(r'^[^\n]*%E3%83%AF%E3%83%B3%E3%83%94%E3%83%BC%E3%82%B9-One%20Piece-1193[^\n]*\n?', '', text, flags=re.I|re.M)
              text = re.sub(r'^[^\n]*ワンピース-One Piece-1193[^\n]*\n?', '', text, flags=re.I|re.M)
              if text != old:
                  path.write_text(text, encoding='utf-8')

          # Delete any remaining image directories if they still exist.
          import shutil
          for p in [
              Path('chapter-images/one-piece/chapter-1193'),
              Path('chapter-images/one-piece/chapter-ワンピース-One Piece-1193'),
              Path('chapter-images/sakamoto-days-ja/chapter-275'),
              Path('chapter-images/days/chapter-275')
          ]:
              if p.exists():
                  shutil.rmtree(p)
          PY

      - name: Commit cleanup and remove this one-time workflow
        run: |
          rm -f .github/workflows/cleanup-deleted-1193-275.yml
          git config user.name 'MangaAtlas Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Permanently remove deleted One Piece 1193 and Sakamoto Days 275'
          git push
