name: Fix MangaAtlas ad rendering

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-ad-rendering.yml'
      - 'ads/.ad-fix-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch ad provider and collapse empty slots
        shell: python
        run: |
          from pathlib import Path

          for name in ['ads/728.html', 'ads/300.html']:
              p = Path(name)
              if p.exists():
                  s = p.read_text(encoding='utf-8')
                  s = s.replace('www.highrevenueformat.com', 'www.highperformanceformat.com')
                  p.write_text(s, encoding='utf-8')

          p = Path('chapter.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('www.highrevenueformat.com', 'www.highperformanceformat.com')

          marker = "function adFrame(slot,html,height,src){"
          watcher = "function watchAd(slot){setTimeout(()=>{try{const f=slot.querySelector('iframe');if(!f){slot.classList.add('ad-empty');return}const d=f.contentDocument,b=d&&d.body;if(!b||(!b.children.length&&!b.textContent.trim()))slot.classList.add('ad-empty')}catch(e){}},12000)}"
          if 'function watchAd(slot)' not in s:
              s = s.replace(marker, watcher + marker, 1)

          s = s.replace("slot.dataset.adLoaded='yes';return}const code=", "slot.dataset.adLoaded='yes';watchAd(slot);return}const code=", 1)
          s = s.replace("adFrame(slot,code,height);slot.dataset.adLoaded='yes'", "adFrame(slot,code,height);slot.dataset.adLoaded='yes';watchAd(slot)", 1)
          s = s.replace("setTimeout(()=>{if(slot.dataset.adLoaded==='loading')slot.dataset.adLoaded='yes'},3000)", "setTimeout(()=>{if(slot.dataset.adLoaded==='loading')slot.dataset.adLoaded='yes';watchAd(slot)},3000)", 1)
          s = s.replace("slot.appendChild(f);slot.dataset.adLoaded='yes'", "slot.appendChild(f);slot.dataset.adLoaded='yes';watchAd(slot)", 1)

          css = '.ad-slot.ad-empty{display:none!important;min-height:0!important;height:0!important;margin:0!important;padding:0!important}'
          if css not in s:
              s = s.replace('</style>', css + '</style>', 1)

          p.write_text(s, encoding='utf-8')

      - name: Validate files
        run: |
          test -s chapter.html
          test -s ads/728.html
          test -s ads/300.html
          grep -q 'highperformanceformat.com' chapter.html
          grep -q 'highperformanceformat.com' ads/728.html
          grep -q 'highperformanceformat.com' ads/300.html

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chapter.html ads/728.html ads/300.html
          git commit -m 'Fix blank ad slots and ad provider rendering'
          git push
