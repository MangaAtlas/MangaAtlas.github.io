name: Keep Hunter x Hunter 420 deleted
on:
  workflow_run:
    workflows: ["Repair MangaAtlas content"]
    types: [completed]
permissions:
  contents: write
jobs:
  remove:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove deleted chapter from content and sitemap
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/content.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['chapters']=[c for c in d.get('chapters',[]) if not (
              str(c.get('slug','')) in {'Hun-x-Hun-420-Raw','Hun x Hun 420'} or
              (c.get('mangaId')=='hunter-x-hunter' and str(c.get('number'))=='420')
          )]
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          s=Path('sitemap.xml')
          text=s.read_text(encoding='utf-8')
          text='\n'.join(line for line in text.splitlines() if 'slug=Hun-x-Hun-420-Raw' not in line and 'slug=Hun%20x%20Hun%20420' not in line)+'\n'
          s.write_text(text,encoding='utf-8')
          PY
          if [ -d chapter-images/hunter-x-hunter/chapter-420 ]; then git rm -r chapter-images/hunter-x-hunter/chapter-420; fi
      - name: Commit deletion
        run: |
          git config user.name 'MangaAtlas Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/content.json sitemap.xml
          git diff --cached --quiet || git commit -m 'MangaAtlas repair complete - permanently delete Hunter x Hunter 420'
          git push
