name: Fix admin upload 409
on:
  push:
    paths:
      - .github/workflows/fix-admin-upload-409.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin upload conflict handling
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('admin/index.html')
          s = p.read_text(encoding='utf-8')

          old_write = r'''async function writeData(obj,sha,message){const bytes=new TextEncoder().encode(JSON.stringify(obj,null,2)+'\n');let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return api('/contents/'+DATA,{method:'PUT',body:JSON.stringify({message,content:btoa(bin),sha,branch:BRANCH})})}'''
          new_write = r'''async function writeData(obj,sha,message,attempt=0){const bytes=new TextEncoder().encode(JSON.stringify(obj,null,2)+'\n');let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));try{return await api('/contents/'+DATA,{method:'PUT',body:JSON.stringify({message,content:btoa(bin),sha,branch:BRANCH})})}catch(e){if(attempt<2&&/GitHub 409:.*does not match/i.test(e.message)){const latest=await readData();await sleep(300*(attempt+1));return writeData(obj,latest.sha,message,attempt+1)}throw e}}'''
          if old_write not in s:
              raise SystemExit('writeData target not found')
          s=s.replace(old_write,new_write,1)

          pattern = r"async function uploadPart\(which\)\{.*?\}\$\('uploadPart1'\)\.onclick"
          replacement = r'''async function uploadPart(which){try{const input=$(which==='1'?'cPages1':'cPages2'),progress=$(which==='1'?'part1Progress':'part2Progress'),files=[...input.files];if(!editChapterId)throw Error('Pehle chapter ko Save chapter details se create karo.');if(!files.length)throw Error('Is part ke liye images select karo.');if(files.length>10)throw Error('Ek part mein maximum 10 images upload karo.');const c=data.chapters.find(x=>x.id===editChapterId);if(!c)throw Error('Chapter not found.');const min=which==='1'?1:11,max=which==='1'?10:20;const uploadedPages={};for(let i=0;i<files.length;i++){progress.textContent=`Preparing image ${i+1}/${files.length}…`;const f=await prepareImage(files[i]);let pageNo=pageNumberFromName(files[i].name);if(!(pageNo>=min&&pageNo<=max))pageNo=min+i;if(pageNo>max)throw Error('Part mein maximum 10 images allowed hain.');const path=`chapter-images/${c.mangaId}/chapter-${c.number}/${String(pageNo).padStart(4,'0')}-${Date.now()}-${i}.webp`;progress.textContent=`Uploading image ${i+1}/${files.length}…`;uploadedPages[pageNo]=await uploadFile(path,f)}let latest=await readData(),fresh=latest.data.chapters.find(x=>x.id===c.id);if(!fresh)throw Error('Chapter disappeared from content data.');const pages=[...(fresh.pages||[])].slice(0,20);while(pages.length<20)pages.push(null);for(let i=min-1;i<max;i++)pages[i]=null;for(const [n,path] of Object.entries(uploadedPages))pages[Number(n)-1]=path;fresh.pages=pages.filter(Boolean);fresh.updatedAt=new Date().toISOString();await writeData(latest.data,latest.sha,`Upload chapter ${c.number} part ${which}`);data=latest.data;renderLists();progress.textContent=`✓ Part ${which} uploaded. Chapter now has ${fresh.pages.length} page(s).`;setStatus(`Part ${which} updated successfully. GitHub SHA conflict handling is now automatic.`)}catch(e){$(which==='1'?'part1Progress':'part2Progress').textContent='Error: '+e.message;setStatus('Error: '+e.message)}}$('uploadPart1').onclick'''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('uploadPart target not found')
          p.write_text(s2,encoding='utf-8')
      - name: Commit patched admin
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix admin Part upload SHA conflicts"
          git push
