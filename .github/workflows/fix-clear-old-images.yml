name: Fix Clear Old Images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-clear-old-images.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clear old DAYS 274 and Hunter x Hunter 420 images
        shell: bash
        run: |
          set -e
          for d in "chapter-images/days/chapter-274" "chapter-images/hunter-x-hunter/chapter-420"; do
            if [ -d "$d" ]; then
              git rm -r "$d"
            fi
          done
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/content.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          changed=False
          for c in data.get('chapters',[]):
              if c.get('slug') in {'days-ch-274','Hun-x-Hun-420-Raw'} or c.get('id') == 'hunter-420-raw':
                  if c.get('pages') != []:
                      c['pages']=[]
                      changed=True
          if changed:
              p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add data/content.json
          git diff --cached --quiet || git commit -m 'Clear old DAYS 274 and Hunter x Hunter 420 images [skip ci]'
          git push origin HEAD:main

      - name: Patch whole-chapter clear logic
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin/index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('async function clearPart(which){')
          if start < 0:
              raise SystemExit('clearPart function not found')
          end = s.find("$('cPages1').onchange", start)
          if end < 0:
              raise SystemExit('clearPart end marker not found')
          new = r'''async function clearPart(which){
          try{
            if(!editChapterId)throw Error('Pehle chapter select karo.');
            const c=data.chapters.find(x=>x.id===editChapterId);
            if(!c)throw Error('Chapter not found.');
            if(!confirm('Is chapter ki PURI images delete karni hain? Manga cover image safe rahegi.'))return;
            const p1=$('part1Progress'),p2=$('part2Progress');
            p1.textContent='Finding ALL chapter image files…';p2.textContent='';
            const norm=ref=>{
              let u=decodeURIComponent(String(ref||'').split('?')[0]);
              let m=u.match(/raw\.githubusercontent\.com\/[^/]+\/[^/]+\/[^/]+\/(.+)$/i);if(m)return m[1];
              m=u.match(/cdn\.jsdelivr\.net\/gh\/[^/]+\/[^@]+@[^/]+\/(.+)$/i);if(m)return m[1];
              m=u.match(/github\.com\/[^/]+\/[^/]+\/blob\/[^/]+\/(.+)$/i);if(m)return m[1];
              return u.replace(/^https?:\/\/[^/]+\//,'').replace(/^\/+/,'');
            };
            const manga=data.mangas.find(m=>m.id===c.mangaId);
            const cover=norm(manga?.cover||c.cover||c.coverImage||c.cover_image||'');
            const targets=new Set();
            for(const ref of (c.pages||[])){const path=norm(ref);if(path&&path!==cover)targets.add(path)}
            const dirs=new Set(['chapter-images/'+c.mangaId+'/chapter-'+c.number,'chapter-images/'+c.mangaId+'/'+c.number]);
            const walk=async folder=>{try{const list=await api('/contents/'+folder+'?ref='+BRANCH);if(!Array.isArray(list))return;for(const item of list){if(item.type==='file'&&item.path!==cover&&/\.(jpe?g|png|webp|gif)$/i.test(item.path))targets.add(item.path);else if(item.type==='dir'&&item.path.includes('/chapter-'+c.number))await walk(item.path)}}catch(e){if(!/GitHub 404/.test(e.message))throw e}};
            for(const d of dirs)await walk(d);
            let deleted=0;
            for(const path of targets){p1.textContent=`Deleting chapter image ${deleted+1}/${targets.size}…`;try{const meta=await api('/contents/'+path+'?ref='+BRANCH);if(meta?.sha){await api('/contents/'+path,{method:'DELETE',body:JSON.stringify({message:'Clear whole chapter images',sha:meta.sha,branch:BRANCH})});deleted++}}catch(e){if(!/GitHub 404/.test(e.message))throw e}}
            const latest=await readData(),fresh=latest.data.chapters.find(x=>x.id===editChapterId);if(!fresh)throw Error('Chapter not found after refresh.');fresh.pages=[];await writeData(latest.data,latest.sha,'Clear whole chapter images');data=latest.data;renderLists();p1.textContent=`✓ Whole chapter cleared — ${deleted} image file(s) deleted.`;p2.textContent='✓ Cover image untouched.';setStatus(`Pura chapter clear ho gaya. ${deleted} old image file(s) GitHub se delete ho gayi hain. Cover image untouched hai.`)
          }catch(e){$('part1Progress').textContent='Error: '+e.message;$('part2Progress').textContent='Error: '+e.message;setStatus('Error: '+e.message)}}
          '''
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')

      - name: Commit admin patch on latest main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix clear whole chapter images [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
