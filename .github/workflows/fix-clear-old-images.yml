name: Fix Clear Old Images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-clear-old-images.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin clear logic
        shell: python
        run: |
          from pathlib import Path

          p = Path('admin/index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('async function clearPart(which){')
          end = s.find("$('cPages1').onchange", start)
          if start < 0 or end < 0:
              raise SystemExit('clearPart block not found')

          new = r'''async function clearPart(which){
          try{
            if(!editChapterId)throw Error('Pehle chapter select karo.');
            const c=data.chapters.find(x=>x.id===editChapterId);
            if(!c)throw Error('Chapter not found.');
            if(!confirm('Is chapter ki PURI purani images delete karni hain? Cover image safe rahegi.'))return;
            const progress=$(which==='1'?'part1Progress':'part2Progress');
            progress.textContent='Finding ALL old chapter image files…';

            const pathFromRef=ref=>{
              let u=decodeURIComponent(String(ref||'').split('?')[0]);
              let m=u.match(/raw\.githubusercontent\.com\/[^/]+\/[^/]+\/[^/]+\/(.+)$/i);
              if(m)return m[1];
              m=u.match(/cdn\.jsdelivr\.net\/gh\/[^/]+\/[^@]+@[^/]+\/(.+)$/i);
              if(m)return m[1];
              m=u.match(/github\.com\/[^/]+\/[^/]+\/blob\/[^/]+\/(.+)$/i);
              if(m)return m[1];
              return u.replace(/^https?:\/\/[^/]+\//,'').replace(/^\/+/, '');
            };

            const coverPath=pathFromRef(c.cover||c.coverImage||c.cover_image||'');
            const targets=new Set();

            // Delete every image referenced by this chapter, except its cover.
            for(const ref of (c.pages||[])){
              const path=pathFromRef(ref);
              if(path && path!==coverPath)targets.add(path);
            }

            // Also scan the complete chapter-images directory so orphaned/old,
            // combined/long images are removed even when content.json no longer references them.
            const dir='chapter-images/'+c.mangaId+'/chapter-'+c.number;
            const scan=async folder=>{
              try{
                const listing=await api('/contents/'+folder+'?ref='+BRANCH);
                if(!Array.isArray(listing))return;
                for(const item of listing){
                  if(item.type==='file'){
                    const path=item.path;
                    if(path!==coverPath)targets.add(path);
                  }else if(item.type==='dir'){
                    await scan(item.path);
                  }
                }
              }catch(e){
                if(!/GitHub 404/.test(e.message))throw e;
              }
            };
            await scan(dir);

            let deleted=0,missing=0;
            for(const path of targets){
              progress.textContent=`Deleting old chapter image ${deleted+missing+1}/${targets.size}…`;
              try{
                const meta=await api('/contents/'+path+'?ref='+BRANCH);
                if(meta?.sha){
                  await api('/contents/'+path,{method:'DELETE',body:JSON.stringify({message:'Clear all old chapter images',sha:meta.sha,branch:BRANCH})});
                  deleted++;
                }else missing++;
              }catch(e){
                if(/GitHub 404/.test(e.message))missing++;
                else throw e;
              }
            }

            const latest=await readData(),fresh=latest.data.chapters.find(x=>x.id===editChapterId);
            if(!fresh)throw Error('Chapter not found after refresh.');
            // Clear ALL chapter page references while preserving the manga cover.
            fresh.pages=[];
            await writeData(latest.data,latest.sha,'Clear all old chapter images');
            data=latest.data;renderLists();
            $('part1Progress').textContent=`✓ Whole chapter cleared: ${deleted} old image file(s) deleted.`;
            $('part2Progress').textContent='✓ Whole chapter cleared. Cover image untouched.';
            setStatus(`Pura chapter clear ho gaya: ${deleted} old image file(s) GitHub se delete ho gayi hain. Cover image untouched hai.`);
          }catch(e){
            $('part1Progress').textContent='Error: '+e.message;
            $('part2Progress').textContent='Error: '+e.message;
            setStatus('Error: '+e.message);
          }
        }
          '''
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')
      - name: Commit patched admin
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html
          if git diff --cached --quiet; then
            echo 'No admin changes needed'
          else
            git commit -m 'Make Clear Part delete whole chapter images [skip ci]'
            git push
          fi
