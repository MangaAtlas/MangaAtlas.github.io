name: Repair MangaAtlas content
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'MangaAtlas repair complete') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair chapter data safely
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          p=pathlib.Path('data/content.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          chapters=d.setdefault('chapters',[])

          def sync_chapter(spec, image_root):
            c=next((x for x in chapters if x.get('id')==spec['id'] or x.get('slug')==spec['slug'] or (x.get('mangaId')==spec['mangaId'] and x.get('number')==spec['number'])),None)
            if c is None:
              c=dict(spec)
              c['pages']=[]
              chapters.append(c)
            else:
              c.update({k:v for k,v in spec.items() if k != 'pages'})
            root=pathlib.Path(image_root)
            by_page={}
            if root.exists():
              for f in root.iterdir():
                m=re.match(r'^(\d{4})-',f.name)
                if m and f.is_file(): by_page.setdefault(int(m.group(1)),f)
            if by_page:
              c['pages']=['https://raw.githubusercontent.com/MangaAtlas/MangaAtlas.github.io/main/'+str(by_page[k]).replace('\\','/') for k in sorted(by_page)[:20]]
            return c

          sync_chapter({
            'id':'mokushiroku-no-yon-kishi-252-raw',
            'mangaId':'mokushiroku-no-yon-kishi',
            'title':'黙示録の四騎士 Raw ( THE FOUR KNIGHTS OF THE APOCALYPSE raw ) 第252話',
            'number':252,
            'slug':'the-four-knights-of-the-apocalypse-raw-252',
            'country':'JP',
            'createdAt':'2026-09-07T19:00:00+05:00',
            'updatedAt':'2026-09-07T19:00:00+05:00'
          }, 'chapter-images/mokushiroku-no-yon-kishi/chapter-252')

          sync_chapter({
            'id':'blue-lock-360-raw',
            'mangaId':'blue-lock',
            'title':'ブルーロック raw ( Blue Lock raw ) 第360話',
            'number':360,
            'slug':'blue-lock-raw-360',
            'country':'JP'
          }, 'chapter-images/blue-lock/chapter-360')

          sync_chapter({
            'id':'kingdom-887-raw',
            'mangaId':'kingdom',
            'title':'キングダム raw ( Kingdom Raw ) 第887話',
            'number':887,
            'slug':'kingdom-raw-887',
            'country':'JP'
          }, 'chapter-images/kingdom/chapter-887')

          # Hunter x Hunter 420 is intentionally deleted; never recreate it.
          chapters[:]=[c for c in chapters if not (
            c.get('id')=='hunter-420-raw' or
            c.get('slug') in {'Hun-x-Hun-420-Raw','Hun x Hun 420'} or
            (c.get('mangaId')=='hunter-x-hunter' and str(c.get('number'))=='420')
          )]

          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Total chapters:', len(chapters))
          for slug in ['the-four-knights-of-the-apocalypse-raw-252','blue-lock-raw-360','kingdom-raw-887']:
            print(slug, 'FOUND' if any(c.get('slug')==slug for c in chapters) else 'MISSING')
          print('Hunter 420:', 'REMOVED' if not any(c.get('number')==420 and c.get('mangaId')=='hunter-x-hunter' for c in chapters) else 'ERROR')
          PY
      - name: Commit repairs
        run: |
          git config user.name "MangaAtlas Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "MangaAtlas repair complete"
          git push
