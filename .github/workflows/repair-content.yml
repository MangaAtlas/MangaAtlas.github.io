name: Repair MangaAtlas content
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'MangaAtlas repair complete') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair chapter data and admin uploader
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          p=pathlib.Path('data/content.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          chapters=d.setdefault('chapters',[])
          root=pathlib.Path('chapter-images/one-piece/chapter-1192')
          files=[]
          if root.exists():
            by_page={}
            for f in root.iterdir():
              m=re.match(r'^(\d{4})-',f.name)
              if m and f.is_file(): by_page.setdefault(int(m.group(1)),f)
            files=[by_page[k] for k in sorted(by_page)]
          op=next((c for c in chapters if c.get('slug')=='one-piece-en-raw-1192'),None)
          if op is not None and files:
            op['pages']=['https://raw.githubusercontent.com/MangaAtlas/MangaAtlas.github.io/main/'+str(f).replace('\\','/') for f in files]
          if not any(c.get('id')=='hunter-420-raw' for c in chapters):
            chapters.append({'id':'hunter-420-raw','mangaId':'hunter-x-hunter','title':'ハンター×ハンター raw ( Hunter x Hunter raw ) 第420話 Raw','number':420,'slug':'Hun-x-Hun-420-Raw','country':'JP','pages':[]})
          if not any(c.get('id')=='blue-lock-360-raw' or (c.get('mangaId')=='blue-lock' and c.get('number')==360) for c in chapters):
            chapters.append({'id':'blue-lock-360-raw','mangaId':'blue-lock','title':'ブルーロック raw ( Blue Lock raw ) 第360話','number':360,'slug':'blue-lock-raw-360','country':'JP','pages':[]})
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          a=pathlib.Path('admin/index.html')
          s=a.read_text(encoding='utf-8')
          s=s.replace("if(!r.content?.path)throw Error('GitHub did not confirm '+path+' was uploaded.');return RAW+path.split('/').map(encodeURIComponent).join('/')", "if(!r.content?.path)throw Error('GitHub did not confirm '+path+' was uploaded.');await api('/contents/'+path+'?ref='+BRANCH);return path")
          s=s.replace("if(files.length){c.pages=[];for(let i=0;i<files.length;i++){", "if(files.length){const uploadedPages=[];for(let i=0;i<files.length;i(){")
          s=s.replace("if(files.length){const uploadedPages=[];for(let i=0;i<files.length;i(){", "if(files.length){const uploadedPages=[];for(let i=0;i<files.length;i++){")
          s=s.replace("if(files.length){const uploadedPages=[];for(let i=0;i<files.length;i(){", "if(files.length){const uploadedPages=[];for(let i=0;i<files.length;i++){")
          s=s.replace("if(files.length){const uploadedPages=[];for(let i=0;i<files.length;i(){", "if(files.length){const uploadedPages=[];for(let i=0;i<files.length;i++){")
          s=s.replace("if(files.length){const uploadedPages=[];for(let i=0;i<files.length;i(){", "if(files.length){const uploadedPages=[];for(let i=0;i<files.length;i++){")
          s=s.replace("if(files.length){const uploadedPages=[];for(let i=0;i<files.length;i(){", "if(files.length){const uploadedPages=[];for(let i=0;i<files.length;i++){")
          s=s.replace("if(files.length){const uploadedPages=[];for(let i=0;i<files.length;i(){", "if(files.length){const uploadedPages=[];for(let i=0;i<files.length;i++){")
          s=s.replace("if(files.length){const uploadedPages=[];for(let i=0;i<files.length;i(){", "if(files.length){const uploadedPages=[];for(let i=0;i<files.length;i++){")
          s=s.replace("if(files.length){const uploadedPages=[];for(let i=0;i<files.length;i(){", "if(files.length){const uploadedPages=[];for(let i=0;i<files.length;i++){")
          s=s.replace("if(files.length){const uploadedPages=[];for(let i=0;i<files.length;i++){", "if(files.length){const uploadedPages=[];for(let i=0;i<files.length;i++){")
          s=s.replace("c.pages.push(await uploadFile(path,f))}}if(!editChapterId)data.chapters.push(c)", "uploadedPages.push(await uploadFile(path,f))}c.pages=uploadedPages}if(!editChapterId)data.chapters.push(c)")
          a.write_text(s,encoding='utf-8')

          i=pathlib.Path('index.html')
          h=i.read_text(encoding='utf-8')
          h=h.replace('.filter(hasPages)', ".filter(c=>hasPages(c)||c.slug==='Hun-x-Hun-420-Raw')")
          i.write_text(h,encoding='utf-8')

          ch=pathlib.Path('chapter.html')
          h=ch.read_text(encoding='utf-8')
          h=h.replace("if(kind==='728')return addHighRevenue(slot,'5a6c64cb9575c309f734f8923695283f',728,90);if(kind==='320')return addHighRevenue(slot,'23c41132d95748e456a7a25b71fe13b8',320,50);if(kind==='container')return addContainerAd(slot,'86f019b80a98d0c1a36bff26f5f7dfcd');if(kind==='300')return add300Ad(slot)", "if(kind==='728new')return addHighRevenue(slot,'048f6a8cdac82999df32c58fd9268909',728,90);if(kind==='728')return addHighRevenue(slot,'5a6c64cb9575c309f734f8923695283f',728,90);if(kind==='320new')return addHighRevenue(slot,'df64d8d9d0abc24ab2cc65c3dd3761eb',320,50);if(kind==='320')return addHighRevenue(slot,'23c41132d95748e456a7a25b71fe13b8',320,50);if(kind==='468new')return addHighRevenue(slot,'dfed786cfb88cd3143bae074860d3711',468,60);if(kind==='468')return addHighRevenue(slot,'dfed786cfb88cd3143bae074860d3711',468,60);if(kind==='container')return addContainerAd(slot,'86f019b80a98d0c1a36bff26f5f7dfcd');if(kind==='300')return add300Ad(slot)")
          h=h.replace(".ad-50{min-height:50px}", ".ad-50{min-height:50px}.ad-60{min-height:60px}")
          h=h.replace("let ad728Count=0;pages.forEach((p,i)=>", "let ad728Count=0;let new728Count=0;let new320Count=0;let new468Count=0;pages.forEach((p,i)=>")
          h=h.replace("if(ad728Count<6&&i<11){html+='<div class=\"ad-slot ad-90\" data-ad=\"728\"></div>';ad728Count++}", "if(ad728Count<6&&i<11){html+='<div class=\"ad-slot ad-90\" data-ad=\"'+(new728Count<3?'728new':'728')+'\"></div>';if(new728Count<3)new728Count++;ad728Count++}")
          h=h.replace("if(i===2||i===7)html+='<div class=\"ad-slot ad-container\" data-ad=\"container\"></div>';if(i===5)html+='<div class=\"ad-slot ad-50\" data-ad=\"320\"></div>'", "if(i===2||i===7)html+='<div class=\"ad-slot ad-container\" data-ad=\"container\"></div>';if(i===3||i===9||i===15){html+='<div class=\"ad-slot ad-60\" data-ad=\"468new\"></div>';new468Count++}if(i===5||i===11||i===17){html+='<div class=\"ad-slot ad-50\" data-ad=\"'+(new320Count<3?'320new':'320')+'\"></div>';if(new320Count<3)new320Count++}")
          ch.write_text(h,encoding='utf-8')

          sm=pathlib.Path('sitemap.xml')
          text=sm.read_text(encoding='utf-8')
          url='https://mangaatlas.github.io/chapter.html?slug=Hun-x-Hun-420-Raw'
          if url not in text:
            marker='  <url><loc>https://mangaatlas.github.io/chapter.html?slug=Hun%20x%20Hun%20420</loc>'
            if marker in text:
              pos=text.index(marker)
              text=text[:pos]+'  <url><loc>'+url+'</loc><lastmod>2026-09-05T00:00:00Z</lastmod></url>\n'+text[pos:]
            else:
              text=text.replace('</urlset>', '  <url><loc>'+url+'</loc><lastmod>2026-09-05T00:00:00Z</lastmod></url>\n</urlset>')
            sm.write_text(text,encoding='utf-8')
          PY
      - name: Commit repairs
        run: |
          git config user.name "MangaAtlas Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content.json admin/index.html index.html chapter.html ads/profit.html sitemap.xml
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "MangaAtlas repair complete"
          git push