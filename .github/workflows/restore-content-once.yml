name: Restore content database once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full historical content database
        run: |
          git checkout 74b42fc1db1c8be347238c72c551c2572ec8694d -- data/content.json
          git config user.name 'MangaAtlas Bot'
          git config user.email 'bot@mangaatlas.local'
          git add data/content.json
          git commit -m 'Restore full chapter database'
          git push
