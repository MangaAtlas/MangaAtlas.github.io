name: Restore and merge content database once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge historical and latest content safely
        run: |
          python3 <<'PY'
          import json, subprocess

          def load_worktree():
              with open('data/content.json', encoding='utf-8') as f:
                  return json.load(f)

          def load_commit(commit):
              raw = subprocess.check_output(['git', 'show', f'{commit}:data/content.json'], text=True)
              return json.loads(raw)

          current = load_worktree()
          historical = load_commit('74b42fc1db1c8be347238c72c551c2572ec8694d')
          latest_snapshot = load_commit('22354da78b71c1a6724521911f47ab381c434461')

          def merge_records(*datasets, key='id'):
              out = []
              pos = {}
              for data in datasets:
                  for item in data:
                      k = item.get(key) or item.get('slug')
                      if not k:
                          continue
                      if k in pos:
                          out[pos[k]] = item
                      else:
                          pos[k] = len(out)
                          out.append(item)
              return out

          mangas = merge_records(
              historical.get('mangas', []),
              current.get('mangas', []),
              latest_snapshot.get('mangas', [])
          )
          chapters = merge_records(
              historical.get('chapters', []),
              current.get('chapters', []),
              latest_snapshot.get('chapters', [])
          )

          result = {
              'version': max(historical.get('version', 1), current.get('version', 1), latest_snapshot.get('version', 1)),
              'mangas': mangas,
              'chapters': chapters
          }

          with open('data/content.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
              f.write('\n')

          print('Mangas:', len(mangas))
          print('Chapters:', len(chapters))
          for slug in ['the-four-knights-of-the-apocalypse-raw-252', 'blue-lock-raw-360', 'kingdom-raw-887', 'Hun-x-Hun-420-Raw']:
              print(slug, 'FOUND' if any(c.get('slug') == slug for c in chapters) else 'MISSING')
          PY
      - name: Remove one-time restore workflow and commit merged database
        run: |
          rm -f .github/workflows/restore-content-once.yml
          git config user.name 'MangaAtlas Bot'
          git config user.email 'bot@mangaatlas.local'
          git add data/content.json .github/workflows/restore-content-once.yml
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Restore full chapter database including Hunter x Hunter 420'
          git push
