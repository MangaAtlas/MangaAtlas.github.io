name: Fix admin upload 409
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch uploadPart with fresh SHA retry
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin/index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('async function uploadPart(which){')
          end=s.index("$('uploadPart1').onclick=", start)
          new='''async function uploadPart(which){try{const input=$(which==='1'?'cPages1':'cPages2'),progress=$(which==='1'?'part1Progress':'part2Progress'),files=[...input.files];if(!editChapterId)throw Error('Pehle chapter ko Save chapter details se create karo.');if(!files.length)throw Error('Is part ke liye images select karo.');if(files.length>10)throw Error('Ek part mein maximum 10 images upload karo.');const c=data.chapters.find(x=>x.id===editChapterId);if(!c)throw Error('Chapter not found.');const min=which==='1'?1:11,max=which==='1'?10:20;let uploaded=[];for(let i=0;i<files.length;i++){progress.textContent=`Preparing image ${i+1}/${files.length}…`;const f=await prepareImage(files[i]);let pageNo=pageNumberFromName(files[i].name);if(!(pageNo>=min&&pageNo<=max))pageNo=min+i;if(pageNo>max)throw Error('Part mein maximum 10 images allowed hain.');const path=`chapter-images/${c.mangaId}/chapter-${c.number}/${String(pageNo).padStart(4,'0')}-${Date.now()}-${i}.webp`;progress.textContent=`Uploading image ${i+1}/${files.length}…`;await uploadFile(path,f);uploaded.push({pageNo,path})}let lastErr=null;for(let attempt=0;attempt<4;attempt++){try{const latest=await readData(),fresh=latest.data.chapters.find(x=>x.id===c.id);if(!fresh)throw Error('Chapter disappeared from content data.');const pages=[...(fresh.pages||[])].slice(0,20);while(pages.length<20)pages.push(null);for(let i=min-1;i<max;i++)pages[i]=null;for(const u of uploaded)pages[u.pageNo-1]=u.path;fresh.pages=pages.filter(Boolean);await writeData(latest.data,latest.sha,`Upload chapter ${c.number} part ${which}`);data=latest.data;renderLists();progress.textContent=`✓ Part ${which} uploaded. Chapter now has ${fresh.pages.length} page(s).`;setStatus(`Part ${which} updated successfully.`);return}catch(e){lastErr=e;if(!/GitHub 409/.test(e.message)||attempt===3)throw e;progress.textContent=`GitHub SHA changed; retrying save (${attempt+2}/4)…`;await sleep(500*(attempt+1))}}throw lastErr}catch(e){$(which==='1'?'part1Progress':'part2Progress').textContent='Error: '+e.message;setStatus('Error: '+e.message)}}'''
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then echo 'No patch needed'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html
          git commit -m 'Fix admin Part 1/2 upload SHA conflict'
          git push