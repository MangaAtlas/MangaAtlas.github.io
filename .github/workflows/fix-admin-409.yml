name: Fix admin upload and clear SHA conflicts
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin SHA-safe upload and clear logic
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin/index.html')
          s=p.read_text(encoding='utf-8')

          start=s.index('async function uploadPart(which){')
          end=s.index("$('uploadPart1').onclick=", start)
          new_upload='''async function uploadPart(which){try{const input=$(which==='1'?'cPages1':'cPages2'),progress=$(which==='1'?'part1Progress':'part2Progress'),files=[...input.files];if(!editChapterId)throw Error('Pehle chapter ko Save chapter details se create karo.');if(!files.length)throw Error('Is part ke liye images select karo.');if(files.length>10)throw Error('Ek part mein maximum 10 images upload karo.');const c=data.chapters.find(x=>x.id===editChapterId);if(!c)throw Error('Chapter not found.');const min=which==='1'?1:11,max=which==='1'?10:20;let uploaded=[];for(let i=0;i<files.length;i++){progress.textContent=`Preparing image ${i+1}/${files.length}…`;const f=await prepareImage(files[i]);let pageNo=pageNumberFromName(files[i].name);if(!(pageNo>=min&&pageNo<=max))pageNo=min+i;if(pageNo>max)throw Error('Part mein maximum 10 images allowed hain.');const path=`chapter-images/${c.mangaId}/chapter-${c.number}/${String(pageNo).padStart(4,'0')}-${Date.now()}-${i}.webp`;progress.textContent=`Uploading image ${i+1}/${files.length}…`;await uploadFile(path,f);uploaded.push({pageNo,path})}let lastErr=null;for(let attempt=0;attempt<5;attempt++){try{const latest=await readData(),fresh=latest.data.chapters.find(x=>x.id===c.id);if(!fresh)throw Error('Chapter disappeared from content data.');const pages=[...(fresh.pages||[])].slice(0,20);while(pages.length<20)pages.push(null);for(let i=min-1;i<max;i++)pages[i]=null;for(const u of uploaded)pages[u.pageNo-1]=u.path;fresh.pages=pages.filter(Boolean);await writeData(latest.data,latest.sha,`Upload chapter ${c.number} part ${which}`);data=latest.data;renderLists();progress.textContent=`✓ Part ${which} uploaded. Chapter now has ${fresh.pages.length} page(s).`;setStatus(`Part ${which} updated successfully.`);return}catch(e){lastErr=e;if(!/GitHub 409/.test(e.message)||attempt===4)throw e;progress.textContent=`GitHub SHA changed; retrying save (${attempt+2}/5)…`;await sleep(600*(attempt+1))}}throw lastErr}catch(e){$(which==='1'?'part1Progress':'part2Progress').textContent='Error: '+e.message;setStatus('Error: '+e.message)}}'''
          s=s[:start]+new_upload+s[end:]

          start=s.index('async function clearChapter(){')
          end=s.index("$('clearChapter').onclick=", start)
          new_clear='''async function clearChapter(){try{if(!editChapterId)throw Error('Pehle chapter select karo.');let current=data.chapters.find(x=>x.id===editChapterId);if(!current)throw Error('Chapter not found.');if(!confirm('Is chapter ki TAMAM purani images delete karni hain? Manga cover delete nahi hoga.'))return;setStatus('Deleting all old chapter images…');const dir=`chapter-images/${current.mangaId}/chapter-${current.number}`;let deleted=0;for(let pass=0;pass<5;pass++){let listing;try{listing=await api('/contents/'+dir+'?ref='+BRANCH)}catch(e){if(/GitHub 404/.test(e.message))break;throw e}const files=Array.isArray(listing)?listing.filter(x=>x.type==='file'):[];if(!files.length)break;for(const item of files){let done=false;for(let retry=0;retry<4&&!done;retry++){try{let fresh=item;try{const one=await api('/contents/'+item.path+'?ref='+BRANCH);fresh=one}catch(e){}await api('/contents/'+item.path,{method:'DELETE',body:JSON.stringify({message:`Delete chapter image ${item.path}`,sha:fresh.sha,branch:BRANCH})});deleted++;done=true}catch(e){if(!/GitHub 409/.test(e.message)||retry===3)throw e;await sleep(500*(retry+1))}}}}let saved=false;for(let retry=0;retry<5&&!saved;retry++){try{const latest=await readData(),fresh=latest.data.chapters.find(x=>x.id===current.id);if(!fresh)throw Error('Chapter not found in latest content data.');fresh.pages=[];fresh.updatedAt=new Date().toISOString();await writeData(latest.data,latest.sha,'Clear entire chapter images');data=latest.data;renderLists();current=fresh;saved=true}catch(e){if(!/GitHub 409/.test(e.message)||retry===4)throw e;await sleep(600*(retry+1))}}$('existingPages').textContent='0 existing page(s).';setStatus(`✓ Entire chapter cleared. ${deleted} image file(s) deleted.`)}catch(e){setStatus('Error: '+e.message)}}'''
          s=s[:start]+new_clear+s[end:]
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then echo 'No patch needed'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html
          git commit -m 'Make admin chapter upload and clear SHA-safe'
          git push
