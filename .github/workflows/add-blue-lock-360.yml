name: Sync chapters and sitemap
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure required chapters exist
        run: |
          python - <<'PY'
          import json

          p='data/content.json'
          with open(p,'r',encoding='utf-8') as f:
              d=json.load(f)

          chapters=d.setdefault('chapters',[])
          required=[
              {
                  'id':'blue-lock-360-raw',
                  'mangaId':'blue-lock',
                  'title':'ブルーロック raw ( Blue Lock raw ) 第360話',
                  'number':360,
                  'slug':'blue-lock-raw-360',
                  'country':'JP',
                  'pages':[]
              },
              {
                  'id':'the-four-knights-of-the-apocalypse-252-raw',
                  'mangaId':'mokushiroku-no-yon-kishi',
                  'title':'Mokushiroku no Yonkishi raw ( The Four Knights of the Apocalypse raw ) 第252話',
                  'number':252,
                  'slug':'the-four-knights-of-the-apocalypse-raw-252',
                  'country':'JP',
                  'pages':[]
              },
              {
                  'id':'kingdom-887-raw',
                  'mangaId':'kingdom',
                  'title':'キングダム raw ( Kingdom Raw ) 第887話',
                  'number':887,
                  'slug':'kingdom-raw-887',
                  'country':'JP',
                  'pages':[]
              }
          ]

          changed=False
          for target in required:
              same_slug=next((c for c in chapters if c.get('slug')==target['slug']),None)
              same_chapter=next((c for c in chapters if c.get('mangaId')==target['mangaId'] and str(c.get('number'))==str(target['number'])),None)
              existing=same_slug or same_chapter
              if existing is None:
                  chapters.append(target)
                  changed=True
              elif existing.get('slug') != target['slug']:
                  existing['slug']=target['slug']
                  changed=True

          if changed:
              with open(p,'w',encoding='utf-8') as f:
                  json.dump(d,f,ensure_ascii=False,indent=2)
                  f.write('\n')
              print('content.json updated with required chapters')
          else:
              print('Required chapters already present')
          PY

      - name: Rebuild chapter URLs in sitemap
        run: |
          python - <<'PY'
          import json
          import re
          import os
          from datetime import datetime, timezone
          from urllib.parse import quote
          from xml.sax.saxutils import escape

          data=json.load(open('data/content.json','r',encoding='utf-8'))
          sitemap_path='sitemap.xml'
          old=open(sitemap_path,'r',encoding='utf-8').read() if os.path.exists(sitemap_path) else '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"></urlset>'

          old_dates={}
          for block in re.findall(r'<url>.*?</url>', old, flags=re.S):
              m=re.search(r'<loc>(.*?)</loc>', block)
              if not m:
                  continue
              loc=m.group(1)
              if '/chapter.html?slug=' in loc:
                  d=re.search(r'<lastmod>(.*?)</lastmod>', block)
                  if d:
                      old_dates[loc]=d.group(1)

          static=[]
          for block in re.findall(r'<url>.*?</url>', old, flags=re.S):
              m=re.search(r'<loc>(.*?)</loc>', block)
              if m and '/chapter.html?slug=' not in m.group(1):
                  static.append(block)

          now=datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z')
          chapters=[]
          seen=set()
          for c in data.get('chapters',[]):
              slug=str(c.get('slug') or '').strip()
              if not slug or slug in seen:
                  continue
              seen.add(slug)
              loc='https://mangaatlas.github.io/chapter.html?slug='+quote(slug,safe='-._~')
              lastmod=old_dates.get(loc,now)
              chapters.append(f'  <url><loc>{escape(loc)}</loc><lastmod>{escape(lastmod)}</lastmod></url>')

          out='<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
          out+='\n'.join(static)
          if static and chapters:
              out+='\n'
          out+='\n'.join(chapters)
          out+='\n</urlset>\n'
          open(sitemap_path,'w',encoding='utf-8').write(out)
          print(f'Sitemap synced: {len(chapters)} chapter URLs')
          PY

      - name: Commit synced data
        run: |
          git config user.name 'MangaAtlas Bot'
          git config user.email 'bot@mangaatlas.local'
          git add data/content.json sitemap.xml
          if git diff --cached --quiet; then
            echo 'No chapter or sitemap changes.'
          else
            git commit -m 'Auto-sync chapters to sitemap'
            git push
          fi
