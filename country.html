<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MangaAtlas</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#08090d;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1380px;margin:auto;padding:45px 5%}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.back{color:#9ea2b0}.back:hover{color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#101118;border:1px solid #242732;border-radius:14px;padding:12px}.card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:9px}.card h3{font-size:17px;margin:10px 0 5px}.card p{font-size:13px;color:#9296a5;margin:4px 0;line-height:1.45}.empty{padding:25px;border:1px dashed #303340;border-radius:12px;color:#9296a5;grid-column:1/-1}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="/">← MangaAtlas</a><h1 id="title">Manga</h1></div><div id="grid" class="grid"></div></main><script>const sb=supabase.createClient('https://vcrrkyqiunczhpxdcoil.supabase.co','sb_publishable_IWiCOqUZ7PtPaISAo_5RDw_9uTvyD4z');const map={JP:['🇯🇵 Japan','Japan'],US:['🇺🇸 United States','United States'],FR:['🇫🇷 France','France'],BR:['🇧🇷 Brazil','Brazil']};const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const code=(new URLSearchParams(location.search).get('country')||'').toUpperCase();async function init(){const info=map[code];if(!info){document.getElementById('title').textContent='Country not found';return}document.getElementById('title').textContent=info[0];const {data,error}=await sb.from('manga').select('id,title,author,description,cover_url,status,slug').eq('country',code).order('title');const grid=document.getElementById('grid');if(error||!data?.length){grid.innerHTML='<div class="empty">No manga published for this country yet.</div>';return}grid.innerHTML=data.map(x=>`<a class="card" href="/manga.html?slug=${encodeURIComponent(x.slug)}"><img src="${esc(x.cover_url||'https://placehold.co/600x800/171922/ffffff?text=Manga')}" alt="${esc(x.title)}"><h3>${esc(x.title)}</h3><p>${esc(x.author||'')}${x.status?` · ${esc(x.status)}`:''}</p><p>${esc(x.description||'')}</p></a>`).join('')}init();</script></body></html>
